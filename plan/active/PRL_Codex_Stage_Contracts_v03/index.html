零伪动量的重要门。<\/p>\n<p>流体能量为 ΔK_f = W_wall + W_ports - D_fluid + R_E；规定壁运动的机械功必须计入。活塞端口的动能输运一般非零；不能只记 pQ。转移数值能量变化单独量化，不笼统重命名残差。<\/p>\n<h2>6. 可视化交付<\/h2>\n<table>\n<thead>\n<tr>\n<th>视图/图<\/th>\n<th>用户检查什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>移动壁与流场同步<\/td>\n<td>输入壁轨迹、求解速度/压力、同一物理时间<\/td>\n<\/tr>\n<tr>\n<td>单元生灭/合并放大<\/td>\n<td>具体出现/消失单元、转移来源、最小 alpha<\/td>\n<\/tr>\n<tr>\n<td>几何/质量账本<\/td>\n<td>V(t)、积分流量、局部/全局残差及换向标记<\/td>\n<\/tr>\n<tr>\n<td>活塞解析对照<\/td>\n<td>u、p 和 Q 与正确侧壁条件下解析式，边界类型醒目标注<\/td>\n<\/tr>\n<tr>\n<td>压力尖峰定位<\/td>\n<td>异常时刻、单元 ID、几何与迭代残差，不截断色标隐藏<\/td>\n<\/tr>\n<tr>\n<td>动量/能量图<\/td>\n<td>转移前后状态、壁功、端口功、耗散和残差<\/td>\n<\/tr>\n<tr>\n<td>重启/回退差异图<\/td>\n<td>连续/重启/拒绝后状态差，累计功不能多记<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 通过与故障处理<\/h2>\n<p>质量每周期≤10^-3 V_ref 且周期内残差受控；解析整体/局部 2%/5%；能量≤1%；动量与匹配流误差随细化下降；全部生灭/换向覆盖。几何代数与映射阈值沿用前门。<\/p>\n<p>压力异常先核对离散几何兼容和新单元状态；质量正常但平移动能增长，检查交错动量体和重分配。质量问题不能靠补液，动量问题不能靠全局速度缩放。<\/p>\n<p>输出 <code>moving_boundary_contract.md<\/code>、<code>state_transfer_ledger.csv<\/code>、<code>wall_kinematics.csv<\/code>、解析/无滑移活塞对照、回退检查点及失败最小包。汇总 Z6 后只交 Z7 合同，不执行耦合。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z7（先汇总 Z6）。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z7_PASSIVE_TWO_WAY_FSI.md": {"title": "被动双向流固耦合：牵引、虚功与时间状态", "id": "Z7", "kind": "execution", "html": "<h1>Z7｜被动双向流固耦合：牵引、虚功与时间状态<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z4b 共同腔面、Z6 全部子门及所用 Z1/Z3 力学路径 PASS\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z8 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 本阶段要证明什么<\/h2>\n<p>由流体压力/牵引驱动被动 DCM 壁，壁位移又反作用于流体；整个迭代求解真实收敛，质量与能量闭合。主动激活固定关闭，无分裂、无 ECM 周转、无真实瓣叶。<\/p>\n<p>不得把规定壁运动传给 CFD、再计算一次反力画箭头称为双向 FSI。必须有流体改变结构、结构改变流体的闭环，并与独立耦合参考比较。<\/p>\n<h2>2. 界面和符号<\/h2>\n<p>复用 Z4b 的 XΓ=g(q)，vΓ=J qdot；fΓ 为固体施于流体的已积分壁面力，结构反力 <code>F_f→s=-Jᵀ fΓ<\/code>。对随机/实际状态验证虚功，并用 g 的独立方向差分验证 J，不仅用同一矩阵代数自证。<\/p>\n<p>fΓ 取 Z6 的动量壁通量；记录压力和黏性两部分。若结构过阻尼，C qdot=F_internal+F_fluid+F_ext；结构惯性是否保留沿用已批准定义，不因耦合不稳随意添加假质量。<\/p>\n<p>界面几何由细胞决定，不能通过先对壁强平滑再忽略其导数改变反力。所有内外表面、ECM 连接和支撑功有明确系统边界。<\/p>\n<h2>3. 强耦合推进合同<\/h2>\n<p>默认可采用分区固定点+Aitken 松弛，或现有已审计稳定方案；正式前写出准确迭代变量/残差、松弛初值/界限、最大迭代 30 次、最多 6 次时间步回退和非线性/线性容差。若该方法不适用，按变更合同修改算法并回归，不能只追加物理阻尼。<\/p>\n<p>伪代码仅表示语义，Codex 须映射到真实接口：<\/p>\n<pre><code class=\"language-text\">accepted = checkpoint(t_n)           # 完整不可变历史\nfor retry in permitted_retries:\n    trial_guess = predictor(accepted, dt)\n    for k in permitted_iterations:\n        candidate = solve_candidate_from(accepted, trial_guess, dt)\n        residuals = evaluate_kinematics_traction_and_equations(candidate)\n        if converged(residuals):\n            commit(candidate)       # 一次提交时间、内变量和累计账本\n            break\n        trial_guess = update_guess(trial_guess, candidate, residuals)\n    if accepted_step: break\n    restore_everything(accepted)\n    dt = registered_reduction(dt)\n<\/code><\/pre>\n<p>同一个 t_n 上的 ECM z、激活时间（虽关闭也保持）、接触历史、阀/负载状态和功积分不能随 k 重复推进。残差覆盖速度/位移与牵引/方程，不只看“末两次位移变化很小”。迭代容差应低于离散误差的十分之一；默认归一化界面目标 10^-6，实际是否足够由容差加严检查确认。<\/p>\n<p>减小 Δt 不是通用稳定性保证。附加质量/阻尼问题需根据实际算法诊断；[R7] 是稳定性和精确模型参考，不能直接把弹性连续体 AMP 结论套到过阻尼 DCM。<\/p>\n<h2>4. 必需实验：从可解耦合夹具到 DCM 通道<\/h2>\n<table>\n<thead>\n<tr>\n<th>case_id<\/th>\n<th>内容<\/th>\n<th>目的<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Z7-MAP<\/td>\n<td>随机/刚体/实际界面虚功<\/td>\n<td>符号、求积、合力合矩与 g 导数<\/td>\n<\/tr>\n<tr>\n<td>Z7-REDUCED<\/td>\n<td>流体活塞+已知弹簧/阻尼的测试夹具<\/td>\n<td>独立耦合参考；不是替代生产 DCM<\/td>\n<\/tr>\n<tr>\n<td>Z7-PASSIVE<\/td>\n<td>被动 DCM 柔性通道压力加载/卸载/松弛<\/td>\n<td>真实双向传递<\/td>\n<\/tr>\n<tr>\n<td>Z7-ZERO<\/td>\n<td>等压且无过剩初始储能<\/td>\n<td>静止/平衡对照<\/td>\n<\/tr>\n<tr>\n<td>Z7-RIGID<\/td>\n<td>壁足够刚/冻结壁极限<\/td>\n<td>与 Z6 对应固定边界流一致<\/td>\n<\/tr>\n<tr>\n<td>Z7-ITER<\/td>\n<td>松弛/迭代上限/容差变化但均收敛<\/td>\n<td>收敛解不依赖迭代路径<\/td>\n<\/tr>\n<tr>\n<td>Z7-RESTART<\/td>\n<td>中断重启、人为拒绝步<\/td>\n<td>内变量与账本回退正确<\/td>\n<\/tr>\n<tr>\n<td>Z7-REFINE<\/td>\n<td>结构面、流体 h、Δt 独立细化<\/td>\n<td>空间/时间耦合误差<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>独立活塞耦合参考<\/h3>\n<p>采用 Z6c 的测试用滑移侧壁管，活塞位置 L、面积 A、结构质量 m_s、阻尼 c、弹簧 k，外侧压 p_ext，端口压 p_res。由匹配流动得到<\/p>\n<pre><code class=\"language-latex\">(m_s+\\rho A L)\\ddot L+c\\dot L+k(L-L_{ref})=A(p_{res}-p_{ext}).\n<\/code><\/pre>\n<p>小幅线性化 L≈L_ref 后是常系数受迫振子，可用解析幅相；有限幅度用独立高精度 ODE 参考，并明确为数值参考。生产 DCM 无惯性时测试夹具可以取 m_s=0，但流体惯性仍存在。测试夹具仅验证耦合器，不新增第二个细胞引擎。<\/p>\n<p>先验证该独立 ODE 与所施边界/能量符号一致；均匀速度假设仅对滑移侧壁有效，不套给后续无滑移 DCM 通道。<\/p>\n<h2>5. DCM 被动通道设置<\/h2>\n<p>使用 Z4b 的短管共同腔面和材料，主动关闭，外部压力/端支撑/初始预载冻结。压力负载先平滑小幅，确保处于 Z1/Z4 已验证区，再卸载观察 ECM/组织松弛。<\/p>\n<p>每步求解结构反力与壁速度，流体不另规定整条壁轨迹。刚壁极限可以逐级增大结构刚度作独立极限研究，但要说明该实验改变物理参数；不能把它混作空间细化或代替正常柔性工况。<\/p>\n<h2>6. 可视化交付<\/h2>\n<table>\n<thead>\n<tr>\n<th>视图/图<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>双向耦合动画<\/td>\n<td>DCM 网格、ECM、真实腔内流体、界面反力同屏<\/td>\n<\/tr>\n<tr>\n<td>壁片/细胞选择<\/td>\n<td>来源细胞、J 权重、壁速度、压力/黏性力与交换功<\/td>\n<\/tr>\n<tr>\n<td>载荷与形变<\/td>\n<td>压力输入、壁位移、Q/V、卸载松弛<\/td>\n<\/tr>\n<tr>\n<td>迭代残差<\/td>\n<td>每步 k、重试时刻、界面两侧残差，不只最终值<\/td>\n<\/tr>\n<tr>\n<td>双分账能量<\/td>\n<td>流体得功与结构失功相消、外功/耗散和总残差<\/td>\n<\/tr>\n<tr>\n<td>独立参考图<\/td>\n<td>活塞幅相/轨迹与解析或高精度 ODE<\/td>\n<\/tr>\n<tr>\n<td>重启与细化图<\/td>\n<td>z、累计功、壁运动和流体差异；三类 h/Δt 分开<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 验收、失败与 Z8 交接<\/h2>\n<p>映射/合力合矩代数≤10^-10；质量≤10^-3；能量≤1%；整体/局部 2%/5%；迭代加严不改变离散解；零载/刚壁/重启对照均成立。达不到迭代门或附加质量失稳时 <code>FAIL_NUMERICAL<\/code>，不加假阻尼把动画变稳。<\/p>\n<p>重启结果变化先查 z、参考态、几何/合并组和累计功保存；迭代次数影响松弛时间，说明历史重复推进。输出 <code>fsi_interface_contract.md<\/code>、<code>coupling_iteration_ledger.csv<\/code>、<code>interface_power_ledger.csv<\/code>、独立夹具参考及完整检查点。<\/p>\n<p>Z8 接收已闭合的被动 FSI，不继承“主动心室已经会泵血”的结论。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z8。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z8_ACTIVE_IDEAL_VENTRICLE_PUMP.md": {"title": "主动理想心室泵血：短管、椭球、负载与强对照", "id": "Z8", "kind": "execution", "html": "<h1>Z8｜主动理想心室泵血：短管、椭球、负载与强对照<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z2 主动、Z4/Z4b 组织/共同腔面、Z7 被动 FSI 均 PASS；所有依赖版本兼容\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z9a（先阅读 Z9 控制入口） 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 本阶段的问题和不能冒充的结果<\/h2>\n<p>在固定细胞数量下，由主动心肌力通过 ECM 和心内膜产生壁运动，并对预登记负载输出可解释液压功。先短管，再理想椭球；相同材料与主动机制跨几何。理想阀只负责整流，不应提供净能量。<\/p>\n<p>不使用规定壁轨迹完成主实验，不缩小目标细胞体积，不模拟真实瓣叶、电生理或生长。外部储库驱动的被动流不是主动泵血；稳定漂亮动画不是守恒或创新证据。<\/p>\n<h2>2. 模型、参考态与参数冻结<\/h2>\n<p>复用 Z4b 几何映射及端口，心肌/心内膜闭合细胞、组织连接和共同腔面分别保留。材料参数采用 Z1/Z3 独立标定结果，主动采用 Z2。均匀激活是初始默认，不额外添加时空激活波来获得目标流量。<\/p>\n<p>短管先采用能定义清楚的环向材料驱动与有限端区支撑；椭球方向场根据材料坐标冻结，顶点/接缝缺陷显式显示。不得按三角边方向随机取纤维，也不把 Hong 人体左室参数直接叫作斑马鱼参数。[R3] 仅为合成几何/低维对照线索。<\/p>\n<p>定义被动无应力/人工参考态、外压 p_ext、被动预载、端部约束和初始液体状态。舒张末样式不自动是无应力态。预加载耗能/储能作为初始化独立记录，不能当第一周期主动输入。<\/p>\n<p>冻结细胞数、细胞体积/层厚、腔体尺寸、端口位置/面积、ρ/μ、T/主动幅度、负载、Re/α、观测区域。材料/主动量随网格缩放但跨短管/椭球不重拟合。<\/p>\n<h2>3. 外循环与理想阀方程<\/h2>\n<p>首版只有固定储库压力 p_a、p_b 和有限阻力 R_in/R_out，固定端口平面；不加入顺应性状态。p_b&gt;p_a 的工况用于检验抗负载输出。端口未知压力加载系数 p_in/p_out 必须与 CFD 联立，不预设流量。<\/p>\n<p>以每个阀的正向流 Q≥0 定义互补关系：<\/p>\n<pre><code class=\"language-latex\">0\\le Q\\ \\perp\\ RQ-\\Delta p\\ge0.\n<\/code><\/pre>\n<p>入口 Δp=p_a-p_in，出口 Δp=p_out-p_b；开放时 Δp=RQ，关闭时 Q=0 且 Δp≤0。正向阻力功率 RQ²≥0。使用 p 的含义是边界法向牵引加载系数还是截面平均压力要固定，并与流体端口功一致。<\/p>\n<p>闭阀施加无穿透条件并由方程求反力/压力；不能又指定不相容的压力。开阀施加联立的压力—流量关系，而不是压力和速度两个独立边界。有限 R 避免无约束短路。阀切换进入耦合迭代，状态仅在接受步后提交。<\/p>\n<p>单独做理想阀/电阻的零驱动、反向压差、正向压差和功率单元测试；闭阀零通量不等于给整个入口流场随意清零。<\/p>\n<h2>4. 必需工况与执行次序<\/h2>\n<table>\n<thead>\n<tr>\n<th>case_id<\/th>\n<th>条件<\/th>\n<th>需要排除的解释<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Z8-LOAD-UNIT<\/td>\n<td>阀/阻力独立测试<\/td>\n<td>阀/边界成为数值能量源<\/td>\n<\/tr>\n<tr>\n<td>Z8-EQUAL-OFF<\/td>\n<td>a=0，等储库压力，平衡初态<\/td>\n<td>隐含驱动、几何漏液<\/td>\n<\/tr>\n<tr>\n<td>Z8-LOAD-OFF<\/td>\n<td>a=0，与正式负载相同<\/td>\n<td>外压差/初始弹性驱动的被动流<\/td>\n<\/tr>\n<tr>\n<td>Z8-TUBE<\/td>\n<td>主动短管，小幅到冻结目标幅度<\/td>\n<td>真实主动驱动闭环<\/td>\n<\/tr>\n<tr>\n<td>Z8-ELLIPSOID<\/td>\n<td>主动理想椭球，同材料定义<\/td>\n<td>不是针对一几何调参<\/td>\n<\/tr>\n<tr>\n<td>Z8-PERTURB<\/td>\n<td>椭球局部预定 ECM τ 扰动<\/td>\n<td>固定细胞数下局部预测价值<\/td>\n<\/tr>\n<tr>\n<td>Z8-CONTROLS<\/td>\n<td>低维/均匀与同信息组织对照<\/td>\n<td>少量模态或等效材料已足够<\/td>\n<\/tr>\n<tr>\n<td>Z8-REFINE<\/td>\n<td>结构/ECM/流体/时间独立检查<\/td>\n<td>模型差异大于数值误差<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>各几何只运行少量冻结工况：同边界 OFF/ON 和一个局部扰动。默认最多 20 周期；小幅先用 Z2 已通过幅度，不为追求正流量无界增大激活。一个负载点证明的是该工况输出，不主张已得到完整泵功能曲线。<\/p>\n<p>“跨几何材料不调参”不要求两几何细胞数或形状相同；要记录几何与细胞总材料量的真实差异，并在比较科学结论时控制必要总量。网格离散权重转换不算重新拟合物理材料。<\/p>\n<h2>5. 周期读出与能量<\/h2>\n<p>每周期记录 V_max/V_min、几何排量、Q_in/Q_out 净积分、反流体积（若允许）、平均/峰值压力、主动正/负功、负载输出和 PV。几何排量 V_max−V_min 不在有同时进出流时自动等于净射出量。<\/p>\n<p>选择腔内压力的定义（如固定物理采样区/体积加权均值），不要用随时间移动的单点峰压代替 p_c。PV 的 -∮p_c dV 与完整壁牵引功并列；压力不均匀时明确差值含义。<\/p>\n<p>总账沿统一合同，端口含动能输运和黏性/压力牵引功。储库抗压输出可报告 <code>(p_b-p_a)×净转移体积<\/code>，但它是某一液压输出定义，不替代完整能量。初始瞬态、外压功和预载能不得计作主动功。<\/p>\n<h2>6. 固定细胞数下科学比较<\/h2>\n<p>沿用 Z4 单变量局部 ECM τ 改变，不同时改变刚度/激活/厚度。固定平均激活和独立被动标定，测局部层间滑移、材料区平均应变、牵引与相位；整体 Q/PV 为辅助。<\/p>\n<p>Hong 思路低维模型与简化组织都用相同边界、材料标定数据、观测算子和保留工况。具体离散参数可以各自拟合同一标定实验，但不能分别拟合目标场景。可用已存在低维代码；缺失则实现最小对照，不以“对照太弱”虚构优越性。<\/p>\n<p>若主张身份/局部状态优越，提供同样空间信息的动态材料域连续模型对照；不能让 DCM 知道扰动位置而对照不知道。成本记录几何/接触/线性求解/耦合/标定/失败重跑，比较相同误差，而非自由度或彩图精细程度。<\/p>\n<h2>7. 可视化必须交付<\/h2>\n<table>\n<thead>\n<tr>\n<th>视图/图<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>主动泵血主视图<\/td>\n<td>真细胞网格、ECM、心内膜、腔内流体和端口；旋转/剖切<\/td>\n<\/tr>\n<tr>\n<td>选细胞/壁片<\/td>\n<td>激活、材料方向、应变、牵引、来源和原始时刻<\/td>\n<\/tr>\n<tr>\n<td>循环曲线联动<\/td>\n<td>V、Q_in/Q_out、压力、阀开闭与当前动画帧<\/td>\n<\/tr>\n<tr>\n<td>PV 与功<\/td>\n<td>PV 循环箭头、真实壁功、主动功、端口/负载输出<\/td>\n<\/tr>\n<tr>\n<td>OFF/ON 对照<\/td>\n<td>同负载/初态，流量和能量差，而非只显示一个成功动画<\/td>\n<\/tr>\n<tr>\n<td>多周期稳定性<\/td>\n<td>周期均值/差异、累计体积/能量漂移及慢变量<\/td>\n<\/tr>\n<tr>\n<td>局部扰动与对照<\/td>\n<td>输入参数图、局部预测、数值误差包络、成本<\/td>\n<\/tr>\n<tr>\n<td>网格/时间收敛<\/td>\n<td>Q、PV 功、局部应变/牵引；WSS 仅在其门通过时显示<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>流线标为瞬时流线，示踪动画有独立积分定义。模型外背景不得显示成血液。必要剪切图的单位和壁梯度验收入口可查。<\/p>\n<h2>8. 验收与停止<\/h2>\n<p>20 周期内末两周期主要量差&lt;1% 且无累计漂移；质量≤10^-3、能量≤1%、整体/局部 2%/5%；OFF/ON、阀功率和跨几何材料一致性成立。超过预算未周期化为 UNRESOLVED/STOPPED_BUDGET，不是默认失稳。<\/p>\n<p>正向流量不自动 PASS：需抗冻结负载、来源明确并高于数值误差。无净输出但方程正确时可报告“该工况不泵送”，不能乱调参数制造成功；工程目标未达到与实现错误分开。强对照解释全部响应则停止独占性主张。<\/p>\n<p>输出 <code>pump_model_frozen.md<\/code>、<code>valve_load_unit_tests<\/code>、<code>cycle_metrics.csv<\/code>、<code>energy_by_cycle.csv<\/code>、材料跨几何清单、强对照/成本和局部扰动报告。只有本阶段真正通过后再准备 Z9，不能让美化动画掩盖未解析项。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z9a（先阅读 Z9 控制入口）。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z9_DATA_VALIDATION_CONTROLLER.md": {"title": "斑马鱼数据比较总控制入口", "id": "Z9", "kind": "controller", "html": "<h1>Z9｜斑马鱼数据比较总控制入口<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：阶段控制入口，不授权批量执行子门\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z0 数据清单；Z8 主动理想泵血的相关路径 PASS；生物数据能力待复核\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z9a；不得自动进入 Z9b 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 两种不同验证必须分开<\/h2>\n<table>\n<thead>\n<tr>\n<th>子门<\/th>\n<th>文件<\/th>\n<th>能支持的主张<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Z9a<\/td>\n<td><code>Z9a_PRESCRIBED_WALL_DATA_COMPARISON.md<\/code><\/td>\n<td>给定实测壁运动与边界条件时的流动预测<\/td>\n<\/tr>\n<tr>\n<td>Z9b<\/td>\n<td><code>Z9b_ACTIVE_PREDICTION_AND_IDENTIFIABILITY.md<\/code><\/td>\n<td>由主动 DCM 预测壁运动及流动，在独立保留条件下检验<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>用户只给本控制文件时，完成数据分级/主张/依赖审计并准备 Z9a 合同，不一次执行两个子门。规定壁运动成功不等于 DCM 力学成功；校准过的壁运动不是独立预测。<\/p>\n<h2>2. 数据能力门<\/h2>\n<p>A：完整可追踪细胞膜/边界、动态壁面、流场与必要边界信息；有条件做细胞—组织—流动验证。<\/p>\n<p>B：腔面/壁运动与流场，没有完整细胞边界；可检验几何和流动，但细胞几何、状态和材料仍属模型假设。<\/p>\n<p>C：两个静态壁相位或仅有血流；可做几何/有限读出描述，不足以验证全周期主动结构模型。<\/p>\n<p>每项来源、年龄、鱼 ID、单位、配准、采样与不确定度重新核验，来源沿 [R1/R2/R8]。不默认已确认为 96 hpf。核位置不是细胞膜；合成分区不是分割；插值不是测量；密集 PIV 箭头不意味着独立分辨率同样密集。<\/p>\n<h2>3. 依赖与状态<\/h2>\n<p>Z9a 的 <code>data_status<\/code>、<code>conditional_cfd_status<\/code>、<code>comparison_status<\/code> 分开。资料不足时停止对应动态/细胞级主张并保留可完成的描述性证据。Z9b 还需主动参数可辨识性及独立保留条件。<\/p>\n<p>整个 Z9 只有必需声明范围完成后可 PASS；可以明确给“B 级个例条件性流动比较通过”，不能写“斑马鱼细胞力学全面验证”。缺真实数据不阻断已授权且具有数值前置门的合成 Z10/Z11，但绝不自动跳阶段。<\/p>\n<h2>4. 汇总可视化<\/h2>\n<p>父页显示数据覆盖/缺项、校准与保留分组、两类预测信息流、实际数值/实验不确定度和限定主张。只挂真实结果入口；无数据不生成实验—模拟叠加图。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z9a；不得自动进入 Z9b。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z9a_PRESCRIBED_WALL_DATA_COMPARISON.md": {"title": "实测壁运动驱动的条件性 CFD 比较", "id": "Z9a", "kind": "execution", "html": "<h1>Z9a｜实测壁运动驱动的条件性 CFD 比较<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z9 数据分级审计；相关 Z6/Z8 流体路径 PASS；动态验证所需壁运动/配准实际可用\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z9b 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 本阶段的限定问题<\/h2>\n<p>在给定实测壁运动、几何和边界负载后，CFD 能否解释对应血流及其不确定度？壁运动是输入，不评估主动 DCM 是否会产生该运动。没有足够动态壁数据时不合成全周期冒充测量。<\/p>\n<h2>2. 数据入场与实际读取<\/h2>\n<p>复用 Z0 清单但重新确认实际可读文件、哈希和版本。核对年龄、鱼/实验 ID、标记、体素大小、速度单位、相位参考、周期、有效视野与配准变换。元数据缺项保持 UNKNOWN，不凭论文示意或文件名补齐。<\/p>\n<p>把原影像、分割腔面、处理速度与误差分别保存。腔面若由分割获得，记录方法/参数、人工修正和分割不确定度。分割光滑前后体积差、壁位移变化和最小特征尺寸必须可查。<\/p>\n<p>只见两静态壁相位时允许检查两个几何及配准，动态 CFD 比较标 <code>BLOCKED_DATA<\/code>；两个几何之间的任意插值可作“假定运动敏感性探索”，但不在本阶段必需验证内、不称实测动态验证。<\/p>\n<h2>3. 壁运动与边界条件<\/h2>\n<p>动态壁面需连续几何对应或明确表面速度重建；不能仅用每相位体素分割编号当材料追踪。CFD 必需法向运动和无滑移全速度的来源分别写清；只有法向位移时，切向速度模型属于额外假设，必须列入敏感性。<\/p>\n<p>使用固定端口和预登记的负载/入口信息。实测域可能只有部分心腔，截断边界不确定性不可忽略。不能一边根据流量反推边界，一边用相同流量做独立验证。记录观测用于几何/壁运动/负载校准/验证的具体角色。<\/p>\n<p>壁重建的体积变化与可测进出流量先做数据层面的相容性检查。若不相容超过不确定度，不强行补液以让 CFD 满足两套矛盾数据；报告配准/分割/边界误差。<\/p>\n<h2>4. 观测算子 H<\/h2>\n<p>定义 <code>y_pred=H(u,wall)<\/code>：空间采样位置、PIV interrogation window 或有效平均核、光学/遮挡掩码、时间/相位平均、配准、速度分量和单位。先把模拟场投影到实验观测尺度，再计算误差。<\/p>\n<p>PIV 窗口尺寸不一定等于真实点扩散函数或独立采样尺度，未知时使用明确简化 H 并做窗口/配准敏感性。不把密集插值位置当独立数据点。红细胞追踪作为速度代理时说明单相连续模型的尺度限制，不强解释近壁个别细胞轨迹。<\/p>\n<p>配准位置变换 <code>x'=R x+t<\/code> 时向量 <code>u'=R u<\/code>（另有单位/时间尺度换算）；协方差 <code>C'=R C Rᵀ<\/code>。不确定度只有分量标准差时不要凭空构造独立完整协方差为事实，可在“对角近似”下比较并限定结论。<\/p>\n<h2>5. 校准/保留与误差统计<\/h2>\n<p>以鱼或独立实验条件划分；同鱼相位是相关观测，不是生物重复。只有一条鱼，明确个例/工况或时间外推。先冻结保留集和观测量，再校准可支持的最少边界参数，不在保留集上选模型/调光滑。<\/p>\n<p>报告物理单位 RMSE/MAE、方向误差（仅非零速度可靠区）、局部/整体流量、覆盖率及带不确定度残差。可用 <code>rᵀ C^-1 r<\/code> 的标准化指标，但 C 的来源、秩/相关性及有效自由度须明确；不把它无条件当卡方检验。<\/p>\n<p>数值误差、分割/配准误差、边界不确定度、测量噪声分别评估。实验通过阈值根据数据能力预登记，不套数值 2%/5% 门槛。没有可信不确定度时可报告误差，但不能宣称统计上验证。<\/p>\n<h2>6. 必需实验<\/h2>\n<table>\n<thead>\n<tr>\n<th>case_id<\/th>\n<th>工作<\/th>\n<th>结果<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Z9a-REGISTER<\/td>\n<td>单位/相位/空间变换独立核对<\/td>\n<td>同源/配对证据与缺项<\/td>\n<\/tr>\n<tr>\n<td>Z9a-DATA-BALANCE<\/td>\n<td>壁体积变化与可测通量<\/td>\n<td>数据兼容性而非模拟修正<\/td>\n<\/tr>\n<tr>\n<td>Z9a-CONDITIONAL<\/td>\n<td>冻结壁运动和负载的 CFD<\/td>\n<td>给定运动下的流动<\/td>\n<\/tr>\n<tr>\n<td>Z9a-H<\/td>\n<td>原场和观测尺度场并列<\/td>\n<td>排除尺度错比<\/td>\n<\/tr>\n<tr>\n<td>Z9a-HOLDOUT<\/td>\n<td>预留鱼/条件/相位区段<\/td>\n<td>不在训练数据上宣称预测<\/td>\n<\/tr>\n<tr>\n<td>Z9a-SENSITIVITY<\/td>\n<td>最小壁面/配准/负载扰动<\/td>\n<td>误差来源与稳定结论<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>不开展大规模生物参数反演；仅必要的有上限小集合敏感性，参数列表和范围先登记。<\/p>\n<h2>7. 可视化交付<\/h2>\n<table>\n<thead>\n<tr>\n<th>视图/图<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>原影像—分割—模拟同视角<\/td>\n<td>三者可切换、坐标/年龄/鱼 ID/相位/来源标签<\/td>\n<\/tr>\n<tr>\n<td>运动覆盖图<\/td>\n<td>真测量帧、插值段、缺失相位分开<\/td>\n<\/tr>\n<tr>\n<td>实验/模拟速度叠加<\/td>\n<td>同一 H、掩码、向量尺度和时刻<\/td>\n<\/tr>\n<tr>\n<td>误差与不确定度地图<\/td>\n<td>差值、测量置信、配准敏感区，不能混作一色<\/td>\n<\/tr>\n<tr>\n<td>流量/壁运动曲线<\/td>\n<td>数据及模拟、校准/保留段区别、时间采样<\/td>\n<\/tr>\n<tr>\n<td>观测尺度对照<\/td>\n<td>原始 CFD 点场与 PIV 尺度场并列<\/td>\n<\/tr>\n<tr>\n<td>误差来源图<\/td>\n<td>数值/几何/边界/观测贡献及成本<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>禁止用论文截图当实验分割。原数据不可用时交缺项与访问日志，不生成虚假叠加。<\/p>\n<h2>8. 验收与输出<\/h2>\n<p>动态数据和 H 可定义；数值门通过；保留集误差按预登记不确定度解释；没有同鱼相位伪重复；限定主张成立。否则保留可完成项及 <code>BLOCKED_DATA/UNRESOLVED<\/code>。<\/p>\n<p>输出 <code>data_roles_and_split.csv<\/code>、<code>registration_transform<\/code>、<code>observation_operator.md<\/code>、<code>segmentation_uncertainty<\/code>、<code>holdout_metrics.csv<\/code>、数据/模拟同步快照和边界敏感性。Z9b 接收的是条件性 CFD 能力和真实约束，不接收主动心肌已验证的结论。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z9b。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z9b_ACTIVE_PREDICTION_AND_IDENTIFIABILITY.md": {"title": "主动预测：参数可辨识性与保留数据检验", "id": "Z9b", "kind": "execution", "html": "<h1>Z9b｜主动预测：参数可辨识性与保留数据检验<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z8 主动 FSI PASS；Z9a 相关数据/观测算子可信；独立保留条件和参数约束实际具备\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z10 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 核心问题<\/h2>\n<p>不给 CFD 规定实测壁运动，由主动 DCM—ECM—心内膜闭环预测壁运动和流动，检验模型能否在没有参与拟合的条件下同时解释局部和整体读出。不能把几何重放命名为预测。<\/p>\n<p>数据只能支持 B 级时，可以做组织/流动尺度比较，但合成细胞分区仍标合成，不能验证未观测的细胞身份、分裂或局部应力。<\/p>\n<h2>2. 参数分层而不是一次拟合全部<\/h2>\n<p>按来源分类：独立测量量（几何、周期、已知负载）；独立模块标定量（被动响应、ECM 松弛）；有限待估量（如主动幅度和一个有证据约束的负载参数）；不可辨识但可敏感性分析量。<\/p>\n<p>先给参数表：物理含义、单位、先验/边界来源、是否固定、哪些数据约束它。不能仅用一条 V(t) 同时识别主动幅度、心肌刚度、ECM 刚度/τ 和外负载。没有信息就固定为明确假设或报告不可辨识，不返回一组虚假精确参数。<\/p>\n<p>观测舒张末几何是加载态。采用人工参考态、反演卸载态或预应力初始化，必须明确所选方法及其限制；不得每个保留场景重置为零应力来获得匹配。<\/p>\n<h2>3. 可辨识性小规模门<\/h2>\n<p>先在 Z8 合成已知参数上做“带观测算子的参数恢复”测试。用同一 H、采样和噪声结构模拟观测，但避免仅用生产离散生成再精确反演造成不现实的自证；至少包括独立网格/时间、不同已知工况或明确模型差异探针。<\/p>\n<p>对预选少量参数计算归一化灵敏度 <code>S_ij=∂y_i/∂log(theta_j)<\/code>（仅正参数适用；其它用适当尺度），记录差分幅度和数值噪声。检查奇异值、相关方向或 profile objective；单个最优点/优化收敛不等于可辨识。<\/p>\n<p>合成已知真值无法在合理观测噪声下恢复的参数，不进入真实数据精确反演。只允许缩小问题到有数据支持的参数集合，不用额外未观测自由度降低训练误差。<\/p>\n<h2>4. 校准/保留实验<\/h2>\n<table>\n<thead>\n<tr>\n<th>case_id<\/th>\n<th>工作<\/th>\n<th>判据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Z9b-RECOVER<\/td>\n<td>合成真值+观测算子恢复<\/td>\n<td>参数和预测不确定度是否可解释<\/td>\n<\/tr>\n<tr>\n<td>Z9b-CALIBRATE<\/td>\n<td>冻结校准集，拟合可辨识少量参数<\/td>\n<td>成本、边界和全部候选均记录<\/td>\n<\/tr>\n<tr>\n<td>Z9b-HOLDOUT<\/td>\n<td>预留鱼/负载/频率/局部扰动<\/td>\n<td>不重新调材料/主动参数<\/td>\n<\/tr>\n<tr>\n<td>Z9b-COMPARE<\/td>\n<td>同信息的简单/连续模型对照<\/td>\n<td>同校准自由度/数据与观测尺度<\/td>\n<\/tr>\n<tr>\n<td>Z9b-UNCERTAINTY<\/td>\n<td>传播参数/边界/配准不确定度<\/td>\n<td>不只输出一个确定最优动画<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>不同鱼几何可作为已知输入变化，但“跨鱼预测”的哪些量固定、哪些量允许由独立测量设定先声明。只有同一鱼的相位保留时只称时间/相位外推；相关结构要保留。<\/p>\n<p>优化预算在正式前固定（候选评估数、总 CPU、最大迭代），不得为降低误差无限拟合。代码失败的参数点与物理失配点分开记录，不能当缺失数据悄悄删除。<\/p>\n<h2>5. 真正独立的读出<\/h2>\n<p>至少包含未参与拟合的壁运动和流动之一，尽可能包含局部层间响应。若 V(t) 参与拟合，不能把同一 V(t) 再列独立成功；仍可比较其拟合质量，但标签为 CALIBRATION。<\/p>\n<p>未知应力/牵引可以作为模型预测输出，不称实验验证；WSS 需数值门及观测尺度支持。只具整体影像不能验证细胞级力。预测误差与校准误差并列，参数区间与可辨识性另列。<\/p>\n<h2>6. 可视化交付<\/h2>\n<table>\n<thead>\n<tr>\n<th>视图/图<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>因果来源视图<\/td>\n<td>哪些量来自数据输入、哪些拟合、哪些真正预测<\/td>\n<\/tr>\n<tr>\n<td>主动模拟—实验同步<\/td>\n<td>壁运动/血流同视角，主动壁运动不是实验重放<\/td>\n<\/tr>\n<tr>\n<td>校准/保留对照图<\/td>\n<td>数据集标签醒目，不能颜色相同混淆<\/td>\n<\/tr>\n<tr>\n<td>灵敏度与不可辨识方向<\/td>\n<td>S 矩阵、奇异值/目标剖面，零灵敏度明确<\/td>\n<\/tr>\n<tr>\n<td>参数/预测区间<\/td>\n<td>有限范围传播，不只一个最优参数<\/td>\n<\/tr>\n<tr>\n<td>多模型误差—成本<\/td>\n<td>同 H/校准/保留与局部支持区域<\/td>\n<\/tr>\n<tr>\n<td>局部误差地图<\/td>\n<td>细胞合成与实验观测尺度区分<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 验收与科学停止条件<\/h2>\n<p>数值依赖 PASS、数据/观测算子可用、参数集合有信息支持、保留误差在登记的实验不确定度/主张范围内、对照公平。资料不足为 BLOCKED_DATA；参数恢复不稳定为 UNRESOLVED，不虚报精确材料。<\/p>\n<p>如果连续模型同样解释结果，停止 DCM 独有主张。若所有模型均失配，区分边界未知、牛顿近似、结构本构与观测误差；不得自动加入更多生物模块。任何新增模型需独立变更和验证。<\/p>\n<p>输出 <code>parameter_information_table.csv<\/code>、<code>identifiability_report.md<\/code>、<code>calibration_manifest<\/code>、<code>holdout_predictions<\/code>、参数/预测不确定度和公平对照成本。给 Z10 的不是分裂机制验证，而是本阶段可用的参考几何/状态及限定证据。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z10。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z10_SINGLE_MYOCARDIAL_DIVISION.md": {"title": "心肌单次受控分裂与材料状态继承", "id": "Z10", "kind": "execution", "html": "<h1>Z10｜心肌单次受控分裂与材料状态继承<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z1–Z4b 与 Z7/Z8 相关路径 PASS；分裂基础能力已审计；Z9 数据不足不构成本合成阶段逻辑阻断\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z11；Z10b 仅另行授权 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 核心问题与范围<\/h2>\n<p>从一个已经达到分裂尺寸的母心肌细胞出发，只实施一次预登记事件，验证身份、材料、状态和能量转移；先女儿状态相同，再做一个受控状态差异。<strong>第一版不改变心内膜腔面拓扑<\/strong>，让分裂通过牵引和随后壁运动影响流体。<\/p>\n<p>不模拟持续生长、真实胞质分裂全过程、死亡或重复分裂。初始大母细胞是受控合成输入，不声称已经有质量增长机制。可以先在无流体组织片做事件转移，再在已通过 Z8 的状态运行同一事件；两项同属本阶段必需子实验。<\/p>\n<h2>2. 事件前必须冻结<\/h2>\n<p>母 cell_id、事件时刻 t_event（与时间步无关）、分裂平面材料定义、女儿体积分配、谱系 ID、新界面材料、锚点迁移规则、主动方向/相位、ECM z 转移、事件功/耗散机制以及输出 t^- / t^+。<\/p>\n<p>默认母体积等于两个目标女儿体积之和，目标量按明确比例分配；默认对称 1/2、1/2。将母几何切分为两个闭合子域，女儿并集等于母占据，新增内部界面明确。不能用两个互相重叠的小球替代并称体积守恒。<\/p>\n<p>事件触发在接受时刻执行一次；若步跨事件，按事件时间拆步。拒绝/重启后不能再次分裂。所有派生 ID、随机数和事件计数存到检查点。<\/p>\n<h2>3. 广延量/强度量和材料历史<\/h2>\n<table>\n<thead>\n<tr>\n<th>项目<\/th>\n<th>默认转移原则<\/th>\n<th>检查<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>cell_id/lineage<\/td>\n<td>母退役、两个唯一女儿、parent_id 保留<\/td>\n<td>总细胞数 +1，无碰撞或重复事件<\/td>\n<\/tr>\n<tr>\n<td>目标体积/材料量/总分子量<\/td>\n<td>按材料区域积分或冻结比例分配<\/td>\n<td>两女儿总量=母，不复制两份<\/td>\n<\/tr>\n<tr>\n<td>浓度/无量纲状态<\/td>\n<td>按定义继承；必要时由总量/体积重算<\/td>\n<td>不把浓度当广延量守恒<\/td>\n<\/tr>\n<tr>\n<td>主动相位/方向<\/td>\n<td>材料映射转移，不用新网格边重设<\/td>\n<td>同状态对照无额外相位偏移<\/td>\n<\/tr>\n<tr>\n<td>被动参考态/预应力<\/td>\n<td>从母材料域保留<\/td>\n<td>外表面不一律重设零应力<\/td>\n<\/tr>\n<tr>\n<td>ECM 锚点与 z<\/td>\n<td>按母材料锚点落在的女儿区域继承<\/td>\n<td>不跳到最近节点、不清零记忆<\/td>\n<\/tr>\n<tr>\n<td>接触/连接历史<\/td>\n<td>按原物理对象映射，新增界面另建规则<\/td>\n<td>旧接触不丢失/重复计数<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>穿过分裂面的主动连接如何终止/分配/重建必须预先定义，保持原材料权重并说明拓扑变化带来的真实力学差异；不能以纯重网格名义暗中切断纤维。没有定义时为 BLOCKED_SPEC。<\/p>\n<h2>4. 新界面能量不能事后补账<\/h2>\n<p>事件账本：<\/p>\n<pre><code class=\"language-latex\">E^+-E^-=W_{event}-D_{event}+R_{transfer}.\n<\/code><\/pre>\n<p>W_event/D_event 由预登记的材料创建/不可逆规则独立计算，不能将任意观察到的 ΔE 直接定义为事件功以强行闭合。<\/p>\n<p>一个允许的合成规则：新增两侧皮质以当前界面构型作为各自零应变参考；若各有常张力 γ_new，新皮质面积项为 <code>2γ_new A_cut<\/code>，黏附项为 <code>-w A_contact<\/code>，其它新增项按其已声明参考态计算。只有模型实际含这些项时才用该式，不能凭空给无张力模型加 γ。新增材料/界面所需机械能由明确外部事件预算提供，不称测得的分裂代谢。<\/p>\n<p>原外表面、原 ECM 与已有主动材料的状态转移误差归 R_transfer，不借新增能量掩盖。事件前后可以有真实力突变和后续松弛，不要求物理分裂能量无条件相等，但必须可解释且随离散稳定。<\/p>\n<h2>5. 必需对照矩阵<\/h2>\n<table>\n<thead>\n<tr>\n<th>case_id<\/th>\n<th>操作<\/th>\n<th>排除的替代解释<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Z10-NO<\/td>\n<td>同一状态不发生事件<\/td>\n<td>自然周期变化<\/td>\n<\/tr>\n<tr>\n<td>Z10-ID<\/td>\n<td>仅改编号<\/td>\n<td>身份索引/渲染 bug<\/td>\n<\/tr>\n<tr>\n<td>Z10-MESH<\/td>\n<td>同物理形状纯重网格，材料历史守恒<\/td>\n<td>网格/转移误差<\/td>\n<\/tr>\n<tr>\n<td>Z10-PARTITION<\/td>\n<td>虚拟标签分区，不新增物理界面<\/td>\n<td>标签导致虚假效应<\/td>\n<\/tr>\n<tr>\n<td>Z10-SAME<\/td>\n<td>真分裂，女儿相同状态<\/td>\n<td>新界面/连接机制效应<\/td>\n<\/tr>\n<tr>\n<td>Z10-DIFF<\/td>\n<td>同分裂，仅一项女儿状态差异<\/td>\n<td>状态继承/异质性效应<\/td>\n<\/tr>\n<tr>\n<td>Z10-CONTINUUM<\/td>\n<td>携带相同材料域/事件/状态的连续模型<\/td>\n<td>事件并非 DCM 独有<\/td>\n<\/tr>\n<tr>\n<td>Z10-REFINE<\/td>\n<td>事件位置固定的网格/时间及重启<\/td>\n<td>事件误差和漏触发/重触发<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>状态差异首选激活幅度有界差异并保持冻结的总加权平均，或已有被批准的局部状态；只改变一项。不得同时改变体积、刚度、ECM 源项和激活再宣称单机制。<\/p>\n<p>连续对照须知晓相同事件位置、材料继承、新界面/连接规则与观测区域。它不具备相同物理信息时只能称较弱简化对照。对照能力暂缺可以报告事件数值通过，但“DCM 方法优势”主张保持未完成。<\/p>\n<h2>6. 事件对流体的影响<\/h2>\n<p>首个 t^+ 瞬间心内膜几何及流体域拓扑保持不变；同一血液状态不应被凭空重置。之后结构受力改变产生新的壁运动，再由 Z7 耦合传入 CFD。若实现为了分裂立即移动心内膜或改腔体积，已超出本阶段规则，应停并申请 Z10b/运动路径扩展。<\/p>\n<p>测局部牵引、层间滑移、细胞/组织应变、壁面运动、流量和压力变化。跨事件比较按相同驱动相位与材料区域，不用新的女儿节点编号平均替代原区域。<\/p>\n<h2>7. 可视化交付<\/h2>\n<table>\n<thead>\n<tr>\n<th>视图/图<\/th>\n<th>用户要看见<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>事件前后同步视图<\/td>\n<td>母/女儿、切面、新皮质、旧外表面，t^- / t^+ 不跨拓扑插值<\/td>\n<\/tr>\n<tr>\n<td>谱系和材料追踪<\/td>\n<td>点击女儿追到母细胞与材料锚点，广延/强度量分开<\/td>\n<\/tr>\n<tr>\n<td>锚点/纤维转移<\/td>\n<td>ECM z、主动方向、连接重分配与新界面<\/td>\n<\/tr>\n<tr>\n<td>事件能量阶跃图<\/td>\n<td>独立 W_event/D_event 与 ΔE、R_transfer<\/td>\n<\/tr>\n<tr>\n<td>零效应对照图<\/td>\n<td>ID/重网格/虚分区与真分裂并列，固定色标<\/td>\n<\/tr>\n<tr>\n<td>组织—流体响应<\/td>\n<td>先牵引后壁运动/流场，事件标记与周期对齐<\/td>\n<\/tr>\n<tr>\n<td>同信息模型对照<\/td>\n<td>局部误差—成本、相同事件与观测算子<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>8. 验收与停止<\/h2>\n<p>广延量默认相对转移误差≤10^-8（代数可达时），几何并集/体积误差需分开；纯重编号目标≤10^-10，重网格物理误差按独立细化包络且低于待解释分裂信号。新界面能量独立闭合，R_transfer≤1% 冻结事件能量尺度并随细化改善；普通 FSI 质量/能量门继续适用。<\/p>\n<p>真实事件效应必须大于纯重网格与时间定位误差。差异被对照消除时停止独占性主张，不把数值波动叫分裂生物机制。无法转移材料历史或同时保持空间占据时 BLOCKED_SPEC/FAIL_NUMERICAL。<\/p>\n<p>输出 <code>division_event_contract.md<\/code>、<code>lineage.csv<\/code>、<code>material_transfer_map<\/code>、<code>event_energy_ledger.csv<\/code>、对照/重启/时间定位报告。默认下一份为 Z11；Z10b 是另行授权扩展，不能顺手执行。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z11；Z10b 仅另行授权。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z10b_ENDOCARDIAL_TOPOLOGY_EVENT_OPTIONAL.md": {"title": "可选扩展：直接涉及腔面拓扑的心内膜分裂", "id": "Z10b", "kind": "execution", "html": "<h1>Z10b｜可选扩展：直接涉及腔面拓扑的心内膜分裂<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z10 事件转移、Z4b 腔面、Z6/Z7 移动/耦合均 PASS；用户单独授权本扩展\n本轮终点：提交本阶段结果与验收后停止；任何后续扩展都须用户另行授权。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 额外风险与范围<\/h2>\n<p>这里只研究一次受控心内膜分裂导致的壁面细胞身份/三角剖分变化，首先保持事件瞬间的共同流体几何完全不变。它不同于 Z10 的心肌事件：壁片归属、界面映射、流体牵引分配和可能的切割结构直接受影响。<\/p>\n<p>不是死亡开洞、细胞挤出、屏障修复，也不是允许血液漏出后补液。任何需要瞬间改变腔体占据体积的操作都超出零时长拓扑事件；应设计具有时间路径和做功来源的连续形变并另立合同。<\/p>\n<h2>2. 两种事件严格分开<\/h2>\n<p><strong>A：几何不变的身份/壁网格/内部细胞界面事件。<\/strong> 母心内膜细胞被切为两女儿，流体可见外表面的并集不变。CFD 物理域在 t^- 与 t^+ 相同，血液体积和连续流体状态不应产生物理跳跃；壁面反力重新分配需保持合力/合矩/虚功。<\/p>\n<p><strong>B：真实腔面形状在有限时间内变化。<\/strong> 只能在 A 和相关移动门通过后另行批准。必须给出 XΓ(t)、墙速度、端口通量、事件驱动力和能量路径；不可从前后两帧几何差直接瞬移细胞后声称已守恒。<\/p>\n<p>本文件默认只授权 A 和其后的正常 FSI 演化，B 仅记录扩展条件，不执行。<\/p>\n<h2>3. 执行步骤<\/h2>\n<p>先在零流/常压静止腔做 A，验证几何/流体零效应；再在 Z8 某个已接受非零流动时刻做同几何事件，检查转移；最后允许新增细胞界面的物理力改变之后的连续演化。<\/p>\n<p>新壁片能追溯原母面/材料点、女儿归属、面积权重与参考态。切割集合相同时尽量保持同一 CFD 状态，不能为改 cell_id 重建全场；若数值实现重建导致状态重投影，必须有独立守恒映射和误差账本。<\/p>\n<p>重新计算 g 与 J 后验证导数、虚功、合力和合矩；不要只检查新的三角面闭合。新细胞侧界面不得露入腔内造成未定义突起或缝隙。端口若受影响须仍有完整标记，不把虚封帽变成细胞膜。<\/p>\n<p>事件事务与 Z10 一致：接受一次、回退全状态、重启不重复。压力规范、流体交错速度和几何版本作为整体检查点保留。<\/p>\n<h2>4. 必需实验<\/h2>\n<table>\n<thead>\n<tr>\n<th>case_id<\/th>\n<th>操作<\/th>\n<th>判据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Z10b-RELABEL<\/td>\n<td>只变腔面归属标签<\/td>\n<td>流体域/状态不变，力只重排<\/td>\n<\/tr>\n<tr>\n<td>Z10b-REMESH<\/td>\n<td>同几何重三角化<\/td>\n<td>几何/流体/牵引转移误差受控<\/td>\n<\/tr>\n<tr>\n<td>Z10b-STATIC<\/td>\n<td>零流常压下真心内膜分裂<\/td>\n<td>无无来源压力/流量脉冲<\/td>\n<\/tr>\n<tr>\n<td>Z10b-FLOW<\/td>\n<td>非零流下同几何事件<\/td>\n<td>质量/动量/动能不凭空变化<\/td>\n<\/tr>\n<tr>\n<td>Z10b-EVOLVE<\/td>\n<td>新界面物理规则后的有限时间演化<\/td>\n<td>力学变化有来源，移动 CFD 仍守恒<\/td>\n<\/tr>\n<tr>\n<td>Z10b-RESTART<\/td>\n<td>事件前/后和拒绝步检查<\/td>\n<td>无重复分裂和状态丢失<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5. 可视化交付<\/h2>\n<p>事件前后相同视角显示心内膜母/女儿和<strong>共同腔面差值图<\/strong>；流体网格活动掩码、切割体积和壁片追踪可切换。用放大标记突出接缝，不靠光滑掩盖微小裂口。<\/p>\n<p>显示 t^- / t^+ 的压力/速度差、质量/动量/动能、界面力矩和能量跳变；图上明确“应为数值零效应”的项与“有新界面物理贡献”的项。之后正常动力学另用时间动画，不跨拓扑插值。<\/p>\n<p>至少提供壁归属映射图、开边/重复面检查图、流体零效应图、事件账本图和 h/Δt/重启对照。<\/p>\n<h2>6. 验收与停止<\/h2>\n<p>共同流体域同几何不变；壁归属覆盖完整；无未解释开边；映射/合矩代数≤10^-10；几何和流体状态转移误差在冻结的独立预算内且低于真实事件信号。后续 FSI 仍满足质量10^-3、能量1%、整体/局部2%/5%。<\/p>\n<p>出现有限腔体积瞬时改变，不做全局补液，也不重置速度使之稳定；本事件规则与不可压缩流体不相容，停为 BLOCKED_SPEC。真实流体响应不能由纯标签操作产生。<\/p>\n<p>输出 <code>endocardial_event_contract.md<\/code>、<code>wall_ownership_transfer<\/code>、<code>fluid_remap_ledger.csv<\/code>、事件前后几何/压力/能量包和完整重启证据。完成后停止；本扩展不是 Z11 的强制依赖。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。完成后停止，不执行任何后续实验。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z11_ECM_SECRETION_DEGRADATION_AND_MEMORY.md": {"title": "ECM 分泌、降解与沉积参考态", "id": "Z11", "kind": "execution", "html": "<h1>Z11｜ECM 分泌、降解与沉积参考态<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z3 网络内变量、Z4 组织、Z8 主动 FSI 均 PASS；仅使用分裂状态时依赖 Z10；Z9 数据不足不阻断合成工作\n本轮终点：提交本阶段结果与验收后停止；任何后续扩展都须用户另行授权。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 核心问题与范围<\/h2>\n<p>在固定薄层网络拓扑与空间占据下，局部材料积累/降解及其记忆能否产生可解释的力学和流动变化？严格区分材料量、黏弹松弛、沉积参考态和细胞状态反馈。<\/p>\n<p>首版不让 ECM 长出实体厚度，不模拟孔隙流、腔道堵塞或组织细胞消失。网络的材料量可为 kg 或明示的相对量；未作密度/厚度转换标定时不能显示成真实厚度。材料量仅作为惯性可忽略网络的材料账本，不自动改变结构节点质量；需要惯性/动量源时另立模型。<\/p>\n<h2>2. 第一道门：只更新材料量，不改力学<\/h2>\n<p>每连接或参考面积的材料量满足<\/p>\n<pre><code class=\"language-latex\">\\dot m=s-k_d m,\\quad m\\ge0,\\ s\\ge0,\\ k_d\\ge0.\n<\/code><\/pre>\n<p>常数 s/k_d 的精确解：k_d&gt;0 时 <code>m(t)=m0 exp(-k_d t)+(s/k_d)[1-exp(-k_d t)]<\/code>；k_d=0 时 <code>m=m0+st<\/code>。数值求值用稳定极限，不能靠逐步截断负值掩盖不稳定。<\/p>\n<p>分泌率若按面积给出 <code>s_A<\/code>，每连接 <code>s_e=s_A A_e<\/code> 并保持代表面积不重复；密度细化不增加总材料输入。先做无源无降解、纯源、纯降解、常源常降解四项。材料量账本通过前不将 m 接入弹簧参数。<\/p>\n<h2>3. 第二道门：固定参考态材料更新的合成对照<\/h2>\n<p>可先做“材料继承原参考长度/历史”的受控对照，令刚度按 m/m_ref 缩放；这会在固定应变下改变力和储能。必须将 <code>∂E/∂m · mdot<\/code> 作为已定义材料机械输入/移出项，不能假装无应力沉积。<\/p>\n<p>该模型只用于区分映射影响，不作为默认无应力分泌机制。不得在相同几何和应变下仅更新 k 后遗漏材料能量，再把残差叫黏弹耗散。<\/p>\n<h2>4. 默认沉积模型：在当前构型零应力加入<\/h2>\n<p>将每次新材料以当前连接长度 L(t_birth) 为其参考长度，黏性支路从零伸长开始；旧材料保持原参考态与松弛历史。默认所有同一连接内材料共享每单位材料刚度 κ∞、κ1 和 τ、k_d，但具有不同沉积参考态。<\/p>\n<p>这是明确的合成材料机制，不是实验已经验证的 ECM 分泌过程。新增材料没有瞬间机械预应力；化学能消耗不在本机械模型中。带预拉伸沉积是另一机制，默认不启用。<\/p>\n<h3>4.1 可执行的最小实现方式<\/h3>\n<p>最小参考实现可用材料批次 cohorts：每批保存质量 m_j、参考长度 r_j、Maxwell 有效松弛参考长度 y_j=r_j+z_j，力和能量按批求和。只用于小规模验证/预算内网络；不允许批次数随全运行无上限增长。<\/p>\n<p>同一连接共享 κ/τ/k_d 时，以下五个矩是线性标量 SLS 的等价有限记忆表示，可作为正式实现；必须先与独立批次参考验证，不将公式未经测试就推广到非线性/批次特异材料：<\/p>\n<pre><code class=\"language-latex\">M=\\sum_jm_j,\\quad B_0=\\sum_jm_jr_j,\\quad C_0=\\sum_jm_jr_j^2,\\quad\nB_1=\\sum_jm_jy_j,\\quad C_1=\\sum_jm_jy_j^2.\n<\/code><\/pre>\n<p>在所有批次采用同一局部降解率、当前长度零应力沉积时，本合同由逐批方程直接得到<\/p>\n<pre><code class=\"language-latex\">\\dot M=s-k_dM,\\quad \\dot B_0=sL-k_dB_0,\\quad \\dot C_0=sL^2-k_dC_0,\n<\/code><\/pre>\n<pre><code class=\"language-latex\">\\dot B_1=(LM-B_1)/\\tau+sL-k_dB_1,\\quad\n\\dot C_1=2(LB_1-C_1)/\\tau+sL^2-k_dC_1.\n<\/code><\/pre>\n<p>总连接反力、储能和黏弹耗散为<\/p>\n<pre><code class=\"language-latex\">f=\\kappa_\\infty(ML-B_0)+\\kappa_1(ML-B_1),\n<\/code><\/pre>\n<pre><code class=\"language-latex\">E=\\tfrac12\\kappa_\\infty(ML^2-2LB_0+C_0)+\\tfrac12\\kappa_1(ML^2-2LB_1+C_1),\n<\/code><\/pre>\n<pre><code class=\"language-latex\">D_{visc}=\\frac{\\kappa_1}{\\tau}(ML^2-2LB_1+C_1),\\qquad\n\\dot E=f\\dot L-D_{visc}-k_dE.\n<\/code><\/pre>\n<p>这里 -k_d E 表示按比例降解带走的储能，本版登记为离开所建模机械系统的能量，不再重复记作流体/网络黏性耗散。零应力新材料瞬时源项在能量中抵消，不意味着以后受载不存能。<\/p>\n<p>初始旧材料必须保留 z 与参考长度，不能为使用矩法重新无应力化。M=0 时保留安全零材料状态，不偷偷加最低刚度；若由此形成真实断连/欠约束，按模型问题报告。矩的非负方差和能量条件需检查，不能通过将负能量裁零隐藏积分误差。<\/p>\n<p>上述有限矩仅适用于本阶段冻结的线性标量连接与共同参数；法向/交叉标量连接各自使用，不直接宣称完整三维非线性沉积记忆已经解决。<\/p>\n<h2>5. 必需实验矩阵<\/h2>\n<table>\n<thead>\n<tr>\n<th>case_id<\/th>\n<th>工作<\/th>\n<th>要区分的效应<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Z11-MASS<\/td>\n<td>四种局部材料 ODE<\/td>\n<td>源/降解、正性、解析解<\/td>\n<\/tr>\n<tr>\n<td>Z11-FROZEN-REF<\/td>\n<td>原参考态增量的受控对照<\/td>\n<td>材料机械输入不是无应力沉积<\/td>\n<\/tr>\n<tr>\n<td>Z11-BIRTH-REST<\/td>\n<td>固定长度加入新材料<\/td>\n<td>新材料不瞬间增应力，旧应力历史保留<\/td>\n<\/tr>\n<tr>\n<td>Z11-HISTORY<\/td>\n<td>同最终 M、不同沉积/加载历史<\/td>\n<td>仅有总量不足以解释记忆<\/td>\n<\/tr>\n<tr>\n<td>Z11-MOMENT<\/td>\n<td>有限矩与逐批高精度参考<\/td>\n<td>力/能/耗散/降解移出一致<\/td>\n<\/tr>\n<tr>\n<td>Z11-NOTURN<\/td>\n<td>已通过基线，s=k_d=0<\/td>\n<td>精确退化回 Z3/Z8<\/td>\n<\/tr>\n<tr>\n<td>Z11-UNIFORM<\/td>\n<td>组织/心室均匀周转<\/td>\n<td>总量改变的影响<\/td>\n<\/tr>\n<tr>\n<td>Z11-LOCAL<\/td>\n<td>预登记局部细胞状态控制 s<\/td>\n<td>局部反馈与空间分布<\/td>\n<\/tr>\n<tr>\n<td>Z11-REFINE<\/td>\n<td>连接密度、时间和若适用批次离散<\/td>\n<td>非任意源项—刚度映射<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>LOCAL 初版采用一个冻结非负源律，例如 <code>s_A=s0[1+beta h(state)]<\/code>，h∈[0,1]、beta≥0，state 为已有定义的局部状态；不自动加入未知生化网络。先比较相同总源量的局部/均匀或空间重排，再解释局部效应。需要分裂女儿状态时才依赖 Z10。<\/p>\n<h2>6. 与 FSI 的时间一致性<\/h2>\n<p>材料变量更新在唯一总时间控制器内，每次耦合迭代从同一 M/B/C 或批次 accepted 状态重算；拒绝步回退所有材料历史和累计源/降解量。慢周转可以分步，但需要明确分裂误差和步长收敛，不能每个子迭代重复分泌。<\/p>\n<p>在固定长度零应力沉积与恒定应变继承旧参考态两模型中，能量结论不同；可视化与输出必须注明选择。只改变 m 而不追踪参考态的版本不能冒充当前构型沉积。<\/p>\n<h2>7. 可视化交付<\/h2>\n<table>\n<thead>\n<tr>\n<th>视图/图<\/th>\n<th>必须看见<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ECM 材料量地图<\/td>\n<td>单位、源/降解位置与 A_e 权重，不画成真实增厚<\/td>\n<\/tr>\n<tr>\n<td>连接历史选择<\/td>\n<td>M、出生参考态统计、z/矩、反力、储能和降解移出<\/td>\n<\/tr>\n<tr>\n<td>材料账本<\/td>\n<td>初始+累计源−累计降解=当前量，解析/数值及误差<\/td>\n<\/tr>\n<tr>\n<td>同量不同历史对照<\/td>\n<td>输入 L(t)/沉积历程和最终力/能不同的可解释来源<\/td>\n<\/tr>\n<tr>\n<td>旧参考/无应力沉积对照<\/td>\n<td>应力和材料功差异，机制标签明确<\/td>\n<\/tr>\n<tr>\n<td>组织/流体同步图<\/td>\n<td>材料量、应变/牵引、壁运动、Q/压力，不混成因果证明<\/td>\n<\/tr>\n<tr>\n<td>能量/细化/记忆成本<\/td>\n<td>黏弹耗散、材料移出、总残差；矩法与批次对照<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>8. 验收与停止<\/h2>\n<p>材料解析误差默认≤1% 并随 Δt 下降，正性满足，来源—降解账本独立闭合；无周转回到已通过基线。当前长度零应力加入不产生额外新材料瞬时反力；有限矩与逐批参考误差在 2%/5% 门内且收敛。所有有效刚度与代表材料量的缩放可解释。<\/p>\n<p>机械总账增加材料移出/输入项后仍≤1%；流体质量10^-3；局部读出高于数值误差。若结果随任意 k(m) 选择改变，报告模型敏感性而非发现生物规律。没有材料记忆证据不主张沉积年龄效应。<\/p>\n<p>输出 <code>turnover_model_contract.md<\/code>、<code>mass_source_decay_ledger.csv<\/code>、<code>deposition_memory_state<\/code>、<code>material_energy_ledger.csv<\/code>、逐批/矩法验证、局部/均匀/无周转对照与重启包。<\/p>\n<p>完成后停止。本包不默认启动生长、死亡、三维 ECM 占据或真实组织周转；这些需要独立质量/几何/屏障和流体合同。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。完成后停止，不执行任何后续实验。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "sources/v02_original.md": {"title": "原始修订方案 v02（保留）", "id": "来源", "kind": "source", "html": "<h1>三维细胞分辨心室模型：DCM—ECM 网络—CFD 评估与修订方案 v02<\/h1>\n<p><strong>修订日期：2026-09-10。文档性质：研究设计评估与建议执行合同，不是运行报告。<\/strong><\/p>\n<p>保留既定路线：PRL 负责心脏应用；复用 MeshCell3D 的唯一 <code>muse_dcm<\/code> 内核；自建最小 CFD；先完成固定细胞数量的理想心室，再分别研究受控分裂、ECM 周转及真实斑马鱼数据。默认 CPU，每次只执行一个阶段，验收后再决定下一阶段。<\/p>\n<p>本次核查了公开论文、公开数据记录和作者仓库说明，并检索到用户 Library 中的 MeshCell3D Casebook 摘要；没有访问用户 Windows 本地 PRL 工作区、M1 完整执行包或 <code>muse_dcm<\/code> 源码，没有运行 Z0—Z11。<strong>所有新增计算阶段仍为 NOT_RUN；公开资料核查不等于 Z0 已通过。<\/strong> 下述新增条款和阈值解释属于建议修订，须在相应阶段正式计算前登记冻结。<\/p>\n<p>本文 DCM 指 deformable cell model（可变形细胞模型），不是心脏疾病语境中的 dilated cardiomyopathy。<\/p>\n<h2>1. 总体判断与不能改变的边界<\/h2>\n<p>路线成立，分阶段验证、保留失败证据、区分数值验证与生物验证、使用强对照的原则均应保留。但是，原方案还不是完全闭合的执行规格：最大的前置风险是细胞本构及阻尼语义、细胞层到流体腔面的封闭映射、三维移动切割单元守恒，以及主动驱动的能量定义，而不是分裂或 ECM 分泌。<\/p>\n<p>首版继续采用主动心肌 DCM—薄层 ECM—被动心内膜 DCM—腔内不可压缩牛顿流体—简化外部负载。ECM 不赋予细胞身份；不使用目标体积周期缩小冒充肌肉收缩；不引入真实瓣叶、电生理、血细胞分辨流变、生长和死亡作为基础泵血的前置条件。<\/p>\n<p>自建 CFD、采用 DCM、获得泵血动画均不单独构成方法创新。方法贡献必须由守恒、事件一致性、可观测的局部预测及相同精度下的成本证据支持。<\/p>\n<h2>2. 证据核查及资料用途<\/h2>\n<table>\n<thead>\n<tr>\n<th>来源<\/th>\n<th>本次实际核查到的内容<\/th>\n<th>允许支持的用途<\/th>\n<th>尚不能支持的结论<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Glasgow 官方数据记录及 Readme<\/td>\n<td>两个心脏内皮 z-stack，分别为舒张、收缩相位；各约 5 MB；代码包约 6 MB；约 37 GB 大文件需申请 [1]<\/td>\n<td>Z0 数据入口、静态相位几何核查<\/td>\n<td>年龄已确认为 96 hpf、完整细胞边界已齐备、全周期壁运动已公开<\/td>\n<\/tr>\n<tr>\n<td>作者 GitHub<\/td>\n<td>已处理的相位速度场；每个快照包含位置、速度及速度不确定度数组 [2]<\/td>\n<td>数据可读性、单位、配准和观测算子检查<\/td>\n<td>所有相位与壁面一一配对、压力或细胞材料参数已测量<\/td>\n<\/tr>\n<tr>\n<td>Zenodo 15627197<\/td>\n<td>本次页面访问未成功，未独立复核文件内容<\/td>\n<td>保留原方案备用入口，状态 UNKNOWN<\/td>\n<td>不重复确认原方案中的体量和时间点数<\/td>\n<\/tr>\n<tr>\n<td>Hong 等 2019<\/td>\n<td>人体左室的低维变形模态、壁体积保持及动力学模型 [3]<\/td>\n<td>合成几何、低维对照、压力—容积读出<\/td>\n<td>直接指定斑马鱼生理材料参数<\/td>\n<\/tr>\n<tr>\n<td>Van Liedekerke 等 2019/2020<\/td>\n<td>三维 DCM、细胞和组织标定、分裂事件以及与中心模型的比较 [4]<\/td>\n<td>DCM 结构、接触及标定思路<\/td>\n<td>已证明心肌主动周期收缩和血液双向耦合<\/td>\n<\/tr>\n<tr>\n<td>arXiv:2211.10698<\/td>\n<td>守恒交错网格切割单元空间算子，展示的典型流动验证为二维固定几何 [5]<\/td>\n<td>空间离散算子的参考<\/td>\n<td>已提供本项目的三维移动边界完整解法<\/td>\n<\/tr>\n<tr>\n<td>arXiv:1610.07510<\/td>\n<td>96 hpf 理想二维心脏，壁运动由影像运动学规定，研究血细胞和肌小梁影响 [6]<\/td>\n<td>既有相关工作和流动敏感性参照<\/td>\n<td>三维主动心肌 DCM 双向 FSI 已有验证或本项目已通过<\/td>\n<\/tr>\n<tr>\n<td>MeshCell3D Casebook 摘要<\/td>\n<td>门户汇总为 PASS 23、FAIL 2、NO RUN 8、NOT EVALUATED 1，列出若干代表案例<\/td>\n<td>发现依赖并建立复用审计清单<\/td>\n<td>由汇总数字推断心室依赖路径均已正确<\/td>\n<\/tr>\n<tr>\n<td>M1<\/td>\n<td>沿用用户提供的“二维、小应变、全 FEM，PASS 仅原范围”声明<\/td>\n<td>历史参照<\/td>\n<td>本次重新审计通过，或三维 DCM/CFD 正确<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Glasgow 当前仓库配置给出 0.431 μm/像素、24×24 像素的 PIV interrogation window，名义窗口宽约 10.3 μm。这是定义观测算子的线索，不等于已确认的独立空间分辨率，也不能由插值后的箭头密度推定细胞尺度验证能力。[2]<\/p>\n<h2>3. 将工程目标与科学假设分开<\/h2>\n<h3>3.1 工程目标<\/h3>\n<p>在固定细胞数量下，主动心肌细胞通过 ECM 与心内膜层产生自洽壁运动，在不相容边界条件、隐含体积驱动和未登记外部能量输入均被排除后，得到收敛的正向液压输出，并闭合质量、动量及能量账本。<\/p>\n<p>“无主动驱动”不是无条件的“无流动”：有外部压差或初始弹性储能时，被动系统仍可能流动。必须同时设置等压、无初始过剩储能的被动对照，以及相同负载下的有主动/无主动对照。<\/p>\n<h3>3.2 固定细胞数量下的首个科学问题<\/h3>\n<p>建议先检验：<strong>在平均激活和整体被动力学响应匹配时，ECM 的局部耦合与松弛时间，是否改变心肌到心内膜的空间性幅值、相位传递，并留下均匀或低维模型不能在保留条件下同时解释的局部读出？<\/strong><\/p>\n<p>这是假设，不预设一定存在效应，更不预设 DCM 独有。首轮只操纵一个 ECM 参数族，之后再区分局部激活减弱、相位延迟与 ECM 改变。<\/p>\n<p>在小幅稳定周期工况定义 <code>De = ωτ_ECM<\/code>，并在预先选定、具有非零响应的物理区域和位移分量上测量层间传递增益与相位差。大变形时直接比较材料追踪的应变、相对位移及牵引，不强行套用线性传递函数。<\/p>\n<p>主读出优先为细胞/物理区域平均应变、层间滑移、牵引积分与局部相位；流量、射出体积和压力—容积环是整体读出。局部壁面剪切必须另过几何及速度梯度验收，不作第一轮唯一主要终点。<\/p>\n<h2>4. 第一版模型的闭合定义<\/h2>\n<h3>4.1 细胞力学不由闭合网格自动确定<\/h3>\n<p>每类细胞必须登记参考构型、材料方向、膜/皮质面内弹性、弯曲项、体积约束、细胞间连接与接触、内部黏性以及环境阻力。允许某项关闭，但不能留为空白。用轴向、横向、剪切及松弛加载检查所声明的本构响应；对光滑保守项做能量梯度与节点力互检，接触切换单独验收。<\/p>\n<p>采用表面壳及内部等效材料时，只对实际定义的表面量、连接量和平均量作解释；没有体内本构与运动学重建时，不输出所谓完整心肌三维应力场。<\/p>\n<p>心肌主动方向必须绑定材料标记或材料坐标，随细胞运动更新，并在重网格和分裂时正确转移；不能随三角边方向随机改变，也不能在未声明机制时自动追随当前主应变。<\/p>\n<p>既有 DCM 中的节点—环境阻力不能原封不动解释为已经模拟的血液黏性。[4] 将每个阻力项列出物理对应对象：细胞内部耗散、细胞—细胞相对运动、细胞—ECM 相对运动，或未显式建模的外界。若继续使用相对固定背景的阻力，必须声明参考介质并记录其功和反力；否则会使主动功被一个隐含固定环境吸收。<\/p>\n<p>准静态/过阻尼结构可以与非稳态流体耦合，但是否忽略结构惯性须由目标尺度和敏感性检查决定；不是由原内核恰好采用过阻尼形式决定。<\/p>\n<h3>4.2 三种“闭合”分别验收<\/h3>\n<p>分别检查单个细胞表面闭合、组织连接/空间占据一致、血液腔面封闭。三者不等价。<\/p>\n<p>首版固定邻接时，明确腔面、基底面和侧向连接面；以共形连接或经过验证的约束构造连续腔面。重复表示的相邻细胞皮质、黏附能和连接能按各自物理定义计数，不把同一界面项无意计入两次。<\/p>\n<p>流体壁面可以有单独的离散表示，但它只能是细胞状态的确定性几何映射 <code>XΓ = g(q)<\/code>，不能成为独立驱动的“第二张会动的膜”。每个壁面片必须能追溯到细胞面或明确的连接结构。几何修补和光滑化的体积、法向、曲率及反力映射误差必须可检查。<\/p>\n<p><strong>血液腔面在端口处有明确开口。<\/strong> 用于计算腔体体积的虚拟端口封帽不是实体壁，不能错误施加无滑移或计入固体膜能。首版固定端口平面，以降低体积与通量记账的复杂性。<\/p>\n<p>细胞之间若仍有未建模间隙，不能只在渲染时填平。没有经过验证的共同腔面时，不进入移动边界 CFD。<\/p>\n<h3>4.3 体积约束与加载参考态<\/h3>\n<p>目标细胞体积 <code>V0<\/code> 不随激活变化。采用罚函数时，目标不变不代表实际体积严格不变；须报告 <code>max|V−V0|/V0<\/code> 及罚参数敏感性，并将其误差与血液质量误差分开。<\/p>\n<p>自由收缩的初始形状必须与允许的体积及面积变化相容。不得给球形细胞同时施加严格固定体积、固定为球面最小值的面积，还期待非球形自由缩短。<\/p>\n<p>理想心室预先定义外部压力、端口及支撑约束、被动预加载和参考构型。观测到的舒张末形态不自动等于无应力参考态。首版可以明确采用人工参考态，但生物参数反演需处理加载态与参考态的区别。<\/p>\n<h3>4.4 主动参考长度及其做功<\/h3>\n<p>令 <code>q<\/code> 为节点自由度，<code>a(t)<\/code> 为激活，选定能量表示：<\/p>\n<pre><code class=\"language-latex\">E_s=E_{pass}(q)+E_{fib}(q,a)+E_{junction}(q)+E_{ECM}(q,z).\n<\/code><\/pre>\n<p>若激活通过能量中的参考长度进入，保守节点力来自 <code>−∂E_s/∂q<\/code>，主动机械输入功率定义为<\/p>\n<pre><code class=\"language-latex\">P_{act}=\\frac{\\partial E_{fib}}{\\partial a}\\dot a.\n<\/code><\/pre>\n<p>对固定刚度的单根主动弹性连接：<\/p>\n<pre><code class=\"language-latex\">E_{fib}=\\tfrac12 k[\\ell(q)-\\ell_0(a)]^2,\n\\qquad\nP_{act}=-k(\\ell-\\ell_0)\\dot\\ell_0.\n<\/code><\/pre>\n<p>若刚度也受激活调节，必须再计入对刚度变化的能量导数。该定义与“把主动力作为单独非保守项，并记 <code>f_act·qdot<\/code>”是不同的能量分解方式；只能选定一种自洽分解，不能对同一机制同时记两份主动功。<\/p>\n<p>记录正、负主动机械功，不解释为 ATP 消耗或代谢效率。固定端收缩时外部位移功可为零，但参考长度改变仍可增加弹性储能。去激活可能释放或回收该储能，均须进入账本。<\/p>\n<p>Z2 除自由缩短、固定端收缩外，增加一个有限负载及加载—卸载循环。整个细胞、组织和跨几何实验保持同一材料与主动驱动定义。<\/p>\n<h3>4.5 ECM 标准线性固体与离散标定<\/h3>\n<p>对一个轴向连接，令 <code>x<\/code> 为相对固定参考长度的伸长，<code>z<\/code> 为 Maxwell 黏性支路的内部伸长：<\/p>\n<pre><code class=\"language-latex\">E_e=\\tfrac12 k_\\infty x^2+\\tfrac12 k_1(x-z)^2,\n\\quad f_e=k_\\infty x+k_1(x-z),\n\\quad \\dot z=\\frac{k_1}{\\eta}(x-z).\n<\/code><\/pre>\n<p>因此<\/p>\n<pre><code class=\"language-latex\">\\dot E_e=f_e\\dot x-\\eta\\dot z^2,\n\\qquad \\tau=\\eta/k_1.\n<\/code><\/pre>\n<p>阶跃后固定伸长 <code>x0<\/code>、初始 <code>z=0<\/code> 时，反力为 <code>[k∞+k1 exp(−t/τ)]x0<\/code>。以上给出可独立检查的储能、耗散和松弛时间。<\/p>\n<p>在简单的平行薄层连接标定中，法向刚度尺度为 <code>E_n A/t0<\/code>，切向刚度尺度为 <code>G A/t0<\/code>。<code>A<\/code> 为代表面积，<code>t0<\/code> 为参考厚度。交叉弹簧的整体剪切响应还取决于取向与连接方式，必须由均匀应变能或独立法向/剪切实验验证，不能给每条斜连接同一刚度就宣称材料标定完成。<\/p>\n<p>每个代表面积只能按既定规则分配，不因增加连接数重复计入材料。更改密度时保持连续材料量和等效参数不变。检查无应变刚体转动不产生额外应力；有预应力时应力正确随动。<\/p>\n<p>首版网络是薄层力学等效体，不自动表示心肌内部所有 ECM、真实三维 ECM 增厚、孔隙液或腔道堵塞。<\/p>\n<h2>5. CFD 与流固耦合合同<\/h2>\n<h3>5.1 流体选择及独立验证<\/h3>\n<p>采用交错笛卡尔网格、有限体积通量和压力投影；求解域只含腔内流体与端口。声明密度、黏度、特征长度、速度及频率，并记录 Reynolds 数和 Womersley 数。不因尺寸微小便默认所有惯性均可忽略，也不因存在血细胞成像就声称牛顿单相模型能解释所有近壁细节。<\/p>\n<p>Z5 包括稳态通道、振荡通道及光滑解析/制造解；分开检验速度、压力、相位、散度和离散阶次。固定边界的解析应力/剪切测试属于 WSS 的前置门。<\/p>\n<h3>5.2 移动切割单元不是固定边界的附加显示功能<\/h3>\n<p>需统一计算流体体积、开放面面积、面与体积矩、壁面扫掠体积以及交错速度对应的动量控制体几何。[5] 固定几何算子参考不能替代这些时空几何构造。<\/p>\n<p>对于固定 Cartesian 单元中的流体部分，无穿透运动壁面满足离散几何兼容关系，其连续形式为<\/p>\n<pre><code class=\"language-latex\">\\frac{dV_K}{dt}=\\int_{\\Gamma_w\\cap K}\\mathbf w\\cdot\\mathbf n_f\\,dA,\n<\/code><\/pre>\n<p>其中 <code>n_f<\/code> 指向流体域外，固定网格面不贡献几何运动。有限体积流体通量与壁扫掠体积必须在同一时间离散上兼容；投影右端不能仍当固定体积单元处理。<\/p>\n<p>Z6 在开始计算前冻结三件事：极小切割单元策略、新出现/消失流体单元的保守状态转移、运动边界压力及黏性通量构造。允许局部守恒合并或有明确离散性质的重分配，禁止删除小单元、截断流速或全域补液。<\/p>\n<p>对交错速度不仅要守恒体积，也要检查动量和动能转移。仅有总腔体质量守恒，不能排除局部注入动量的错误。<\/p>\n<p>几何级测试先于流动：平面/球/椭球截交、法向和面积一致性、体积与扫掠体积；随后为恒速整体平移的匹配流、体积保持变形、带固定端口的活塞排液。不能把加速平移导致的真实压力当作“应为零的压力误差”。<\/p>\n<p>封闭不可压缩腔只能规定体积保持壁运动。规定整体缩小必须有开口、可压缩性或明确通透性，首版只允许有开口的情况。<\/p>\n<h3>5.3 空间虚功、力与力矩<\/h3>\n<p>对同一瞬时界面几何，令<\/p>\n<pre><code class=\"language-latex\">\\mathbf v_\\Gamma=J(q)\\dot q,\\qquad J=\\partial g/\\partial q.\n<\/code><\/pre>\n<p>若 <code>fΓ<\/code> 是固体施于流体的离散界面力，且面积积分权重已包含在其中，则结构反力必须为<\/p>\n<pre><code class=\"language-latex\">F_{fluid\\to solid}=-J^T f_\\Gamma.\n<\/code><\/pre>\n<p>于是 <code>qdotᵀF + vΓᵀfΓ = 0<\/code>。使用牵引而非已积分力时须显式保留面积/求积权重。除虚功外，检查合力、合力矩、刚体平移及转动再现性。<\/p>\n<p>空间代数恒等式通过不意味着完全离散耦合通过；不同时刻的力与速度相乘仍可产生时间离散能量误差。<\/p>\n<h3>5.4 迭代、回退与时间状态<\/h3>\n<p>生产路线采用强耦合迭代。预先指定主迭代、残差尺度、松弛/加速方法、最大迭代次数及回退条件。减小时间步不是所有附加质量/附加阻尼失稳的通用解法；相关分区算法已有稳定性分析和精确基准。[7]<\/p>\n<p>可在受控小模型中评估 Aitken 或准牛顿加速等迭代方法，但它们只改变求解过程，不能改变收敛后的物理方程。方法选择须写入阶段合同。<\/p>\n<p><strong>每次耦合迭代都从同一个已接受的时刻状态出发。<\/strong> ECM 内变量、激活时间、阀状态和主动功积分不能随迭代次数重复前进。拒绝一步时，必须回退结构、流体、几何版本、内变量、累计收支及事件队列，而不仅回退节点坐标。<\/p>\n<p>结果快照与可重启检查点分别定义。增加“中断重启与连续运行一致”和“迭代上限改变但均收敛时解一致”测试。<\/p>\n<h3>5.5 外部负载与真正的主动泵血<\/h3>\n<p>首版可采用固定端口平面、给定储库压力与有限阻力、理想单向阀。阀的压差—流量关系与 CFD 联立，不能同时指定相同端口的独立压力和流量。先不加入额外的循环状态；需要顺应性时，再增加并验证其状态方程和储能。<\/p>\n<p>固定支撑、外部压力及所有外力反应必须明确。端口虚拟封帽不承担固体无滑移条件。局部回流边界处理如引入稳定化，须记录对应机械功，不能隐含附加耗散。<\/p>\n<p>主动泵血必须与相同边界下的被动流比较，并展示抵抗预先给定负载的输出。理想阀负责整流而不应成为净能量源。不能由存在净流量单独证明主动心肌做功成功。<\/p>\n<h2>6. 统一守恒账本与验收<\/h2>\n<h3>6.1 质量<\/h3>\n<p>固定端口采用预先定义的符号：入口朝腔内为正，出口朝腔外为正。<\/p>\n<pre><code class=\"language-latex\">R_V(t)=V(t)-V(0)-\\int_0^t(Q_{in}-Q_{out})\\,dt.\n<\/code><\/pre>\n<p>保留每周期 <code>|R_V|/V_ref ≤ 10⁻³<\/code> 的拟议阈值，并同时展示每步残差、周期内累计最大残差、整段运行漂移及局部切割单元残差。周期末正负抵消不能掩盖周期内泄漏。<\/p>\n<p><code>V_ref<\/code> 在计算前冻结，可用规定的非零体积尺度；不能每次由接近零的净输运量临时选取。若追求小射出体积变化，还须报告误差相对于射出体积的比例，避免大腔体归一化掩盖小信号。<\/p>\n<h3>6.2 能量<\/h3>\n<p>对首版腔内流体与细胞—ECM 系统，且端口平面固定，采用<\/p>\n<pre><code class=\"language-latex\">\\Delta(K_f+K_s+E_s)\n=W_{act}+W_{ports}+W_{ext}-D_{phys}+R_E.\n<\/code><\/pre>\n<p>忽略结构惯性时 <code>K_s=0<\/code>。若把外循环顺应性包含在系统内部，增加其储能，并将内部端口交换消去；不能既计内部端口输入又计外循环同一份输入。<\/p>\n<p>固定流体端口的机械能净输入为<\/p>\n<pre><code class=\"language-latex\">P_{ports}=\\sum_p\\int_{\\Gamma_p}\n\\left[\\mathbf u\\cdot(\\sigma\\mathbf n)\n-\\frac12\\rho|\\mathbf u|^2\\,\\mathbf u\\cdot\\mathbf n\\right]dA,\n\\quad \\sigma=-pI+2\\mu D(\\mathbf u).\n<\/code><\/pre>\n<p>因此完整端口能量一般不只有 <code>pQ<\/code>，还包含黏性牵引功和动能输运。移动端口需改用相对通量；首版不启用。<\/p>\n<p>物理耗散分开记录流体黏性、细胞内部黏性、连接摩擦及 ECM 耗散。只有能由离散算子独立计算的项才可标为数值耗散；不能把所有未解释能量残差重命名为数值耗散。<\/p>\n<p>保留周期能量残差不超过非零预登记参考能量 1% 的要求，并报告随细化的趋势。空间界面交换应在总账中抵消，分账用于诊断。<\/p>\n<p>压力—容积环是辅助读出。用 <code>−∮p_c dV<\/code> 代表壁面压力输出功须声明压力近似均匀及符号约定；用跨壁压或绝对/参考压的选择要一致。该量不能无条件代替完整壁牵引功或出口液压能。<\/p>\n<h3>6.3 精度、局部量与稳定性<\/h3>\n<table>\n<thead>\n<tr>\n<th>类别<\/th>\n<th>修订验收解释<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>几何<\/td>\n<td>单细胞闭合、组织连接一致及腔面闭合分别验收；端口作为有标记开口处理；无未处理自交、负体积与失效法向<\/td>\n<\/tr>\n<tr>\n<td>映射代数<\/td>\n<td>保留归一化误差 ≤10⁻¹⁰，使用适当的范数乘积/非零尺度；同时检查力与力矩；不把该阈值套用到所有 PDE 离散误差<\/td>\n<\/tr>\n<tr>\n<td>细胞体积<\/td>\n<td>单独报告实际体积误差与罚参数敏感性，不能用血液守恒代替<\/td>\n<\/tr>\n<tr>\n<td>守恒<\/td>\n<td>周期质量、能量阈值外，加周期内及长期残差，区分局部与全局<\/td>\n<\/tr>\n<tr>\n<td>空间/时间<\/td>\n<td>至少三档，各自独立细化；中细差异 ≤2%（整体）/5%（预定局部）是门槛，不单独等同“已证明收敛”<\/td>\n<\/tr>\n<tr>\n<td>迭代<\/td>\n<td>加严求解容差不显著改变离散误差；建议迭代误差目标低于已估计离散误差的十分之一，正式计算前冻结<\/td>\n<\/tr>\n<tr>\n<td>局部读出<\/td>\n<td>固定物理支持区域、材料标签与观测尺度；压力、应力、WSS 分别验证；几何尖角处点最大值不作默认收敛指标<\/td>\n<\/tr>\n<tr>\n<td>周期稳定<\/td>\n<td>保留首先最多 20 周期和末两周期主要量差 &lt;1% 的门槛，同时检查趋势与慢变量；预算耗尽仍未周期化标为未达周期态，不自动称数值失稳<\/td>\n<\/tr>\n<tr>\n<td>试验验证<\/td>\n<td>根据实验误差、配准误差、观测算子及保留条件判断，不复用数值阈值<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>当残差已达舍入或线性求解误差地板，不要求每一档继续严格下降。非单调结果不能强行套 Richardson 外推；先确认渐近区、几何质量和迭代误差。<\/p>\n<p>细胞数量变化、每细胞表面网格细化、ECM 连接离散细化、CFD 网格细化及物理区域扩大分别登记，不能混为一个“分辨率实验”。<\/p>\n<p>对称性测试在预期对称解稳定的小幅区间进行。超过稳定区后的屈曲或真实对称破缺，需要扰动符号、幅值与离散敏感性检查，不自动归为程序错误。<\/p>\n<h2>7. 修订后的阶段与最小交付<\/h2>\n<p>默认顺序仍为 Z0 起，每次一个阶段。子门只是拆清依赖，不能自动跳转。<\/p>\n<table>\n<thead>\n<tr>\n<th>阶段<\/th>\n<th>原目标保留；新增/修订要点<\/th>\n<th>最小定量证据与进入条件<\/th>\n<th>状态<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Z0 资料与模型入口<\/td>\n<td>数据清单、内核依赖矩阵、细胞—组织—腔面定义、参数与单位、Z1 合同；不运行泵血<\/td>\n<td>小文件可读性和缺项表；静态几何检查；所有未启用字段明确<\/td>\n<td>NOT_RUN<\/td>\n<\/tr>\n<tr>\n<td>Z1 被动单/双细胞<\/td>\n<td>加能量—力导数一致性、参考态、刚体模式和物理阻尼检查<\/td>\n<td>平衡、接触、作用反作用、力矩、松弛及空间/时间检查<\/td>\n<td>NOT_RUN<\/td>\n<\/tr>\n<tr>\n<td>Z2 主动单细胞<\/td>\n<td>自由缩短、固定端、有限负载；实际体积与主动储能分开记<\/td>\n<td>激活—参考长度—力—功闭合；无激活对照通过<\/td>\n<td>NOT_RUN<\/td>\n<\/tr>\n<tr>\n<td>Z3 ECM 网络<\/td>\n<td>标准线性固体内变量；正常/剪切及均匀应变能标定；连接密度检查<\/td>\n<td>恢复刚度与 τ、非负耗散、转动客观性、有效材料不随离散改变<\/td>\n<td>NOT_RUN<\/td>\n<\/tr>\n<tr>\n<td>Z4 有限双层组织<\/td>\n<td>每层 4×4 仅作小规模入口；4×4 与更大物理片比较边缘影响；引入均匀/局部扰动和简单组织对照<\/td>\n<td>层间增益/相位、局部平均应变/牵引；区分边缘与内部。Z4b 增加无 CFD 的闭合腔面及被动压力加载验收<\/td>\n<td>NOT_RUN<\/td>\n<\/tr>\n<tr>\n<td>Z5 独立 CFD<\/td>\n<td>规则边界解析/制造解；压力、速度及 WSS 分开验证<\/td>\n<td>时间与空间阶次、通量及压力方程兼容性<\/td>\n<td>NOT_RUN<\/td>\n<\/tr>\n<tr>\n<td>Z6 移动边界 CFD<\/td>\n<td>分为几何与扫掠体积、固定曲壁、移动壁三子门；新旧单元与极小单元处理提前冻结<\/td>\n<td>几何守恒、局部/整体质量与动量、压力及能量残差<\/td>\n<td>NOT_RUN<\/td>\n<\/tr>\n<tr>\n<td>Z7 被动双向 FSI<\/td>\n<td>柔性通道及刚壁极限；强耦合稳定性、虚功、回退与重启<\/td>\n<td>耦合残差、界面功交换、质量与能量；重复迭代不重复推进历史<\/td>\n<td>NOT_RUN<\/td>\n<\/tr>\n<tr>\n<td>Z8 主动理想泵血<\/td>\n<td>先短管，再理想椭球；由细胞力产生运动；相同材料跨几何；均匀/局部扰动；低维和简单组织对照<\/td>\n<td>多周期负载输出及被动对照；泵功、PV、局部读出；数值误差与模型差异分开<\/td>\n<td>NOT_RUN<\/td>\n<\/tr>\n<tr>\n<td>Z9 数据比较<\/td>\n<td>Z9a 壁运动规定后的条件性流动检验；Z9b 主动结构预测壁运动和流场；按数据能力分级<\/td>\n<td>独立校准/保留条件、观测算子和误差传播；缺什么只阻断相应主张<\/td>\n<td>NOT_RUN<\/td>\n<\/tr>\n<tr>\n<td>Z10 受控单次分裂<\/td>\n<td>先心肌层单次事件，保持心内膜腔面拓扑不变；单独研究直接改变血液腔面拓扑的事件<\/td>\n<td>谱系、材料状态、体积、事件能量与纯重编号/重网格对照；不要求物理事件前后能量无条件相等<\/td>\n<td>NOT_RUN<\/td>\n<\/tr>\n<tr>\n<td>Z11 ECM 分泌/降解<\/td>\n<td>先材料量账本，再材料性质更新；明确沉积参考态及降解能量去向；不改变体积占据<\/td>\n<td>无周转、均匀周转、局部周转逐项对照；源项、松弛及反馈可以分辨<\/td>\n<td>NOT_RUN<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>“4×4→更大组织”是有限尺寸/边界效应实验，不是每细胞网格收敛。小片通过并不自动证明完整闭合心室的曲率、纤维方向和预应力路径通过，因此保留 Z4b。<\/p>\n<p>依赖分开：Z9 的实验资料不足只阻断对应生物结论；合成 Z10/Z11 可以在其真实数值前置门通过且另行授权后开展，不以获得完整生物数据为逻辑必要条件。仍然不得自动推进。<\/p>\n<h2>8. 分裂和 ECM 周转的额外守恒<\/h2>\n<h3>8.1 单次分裂<\/h3>\n<p>记录广延量与强度量的不同转移规则：总量/质量按体积或机制分配；浓度和状态不能机械地各复制一份总量；材料方向、黏弹历史、激活相位和连接锚点均需转移。增加父细胞—子细胞—材料点的可追溯关系。<\/p>\n<p>保持母细胞与女儿细胞的总体积和空间占据，并不意味着新界面没有能量。事件账本写为<\/p>\n<pre><code class=\"language-latex\">E^+-E^-=W_{event}-D_{event}+R_{transfer}.\n<\/code><\/pre>\n<p><code>W_event<\/code> 表示明确声明的分裂机械输入/材料创建，<code>D_event<\/code> 表示已定义的不可逆过程。纯重编号与纯重网格事件没有这些物理机制，其状态改变应只有可量化的转移误差。<\/p>\n<p>由一张表面变成两个闭合表面产生的新皮质、黏附和连接必须声明如何建立，不能把事件瞬间的大幅力变化全称为“生物分裂效应”。<\/p>\n<h3>8.2 ECM 周转<\/h3>\n<p>材料量 <code>m<\/code> 的变化须遵守 <code>dm/dt = s − k_d m<\/code> 或另行明确的源项模型，并保持非负。无扩散或转运时，这是局部材料量更新，而不是完整 ECM 输运。<\/p>\n<p>若 <code>E=E(q,z,m,ℓ0,...)<\/code>，则不仅有形变和黏弹耗散，还包含 <code>∂E/∂m · mdot<\/code>、参考态变化等能量项。必须定义新沉积材料是在当前构型无应力加入，还是以指定预拉伸加入；两者不能混同。<\/p>\n<p>降解带走的储能是被输出、释放还是耗散，须按模型规定记账。若没有材料代际或等价记忆变量，不主张解释复杂沉积年龄及预应力历史。<\/p>\n<p>薄层网络材料量增加不等于几何增厚；研究腔道堵塞、侵占空间或 ECM 中液体排出，必须新增独立标定的体积占据/多相模型，且另立阶段。<\/p>\n<h2>9. 斑马鱼数据与公平对照<\/h2>\n<h3>9.1 数据可验证层级<\/h3>\n<table>\n<thead>\n<tr>\n<th>等级<\/th>\n<th>可用数据<\/th>\n<th>可支持的主要比较<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A<\/td>\n<td>完整可追踪细胞边界、动态壁面、流场及必要边界信息<\/td>\n<td>有条件建立细胞—组织—流动的多层验证<\/td>\n<\/tr>\n<tr>\n<td>B<\/td>\n<td>腔面/壁运动与流场；没有完整细胞边界<\/td>\n<td>几何和流动验证；细胞级状态和材料参数仍是模型假设<\/td>\n<\/tr>\n<tr>\n<td>C<\/td>\n<td>两个静态壁面相位或仅血流<\/td>\n<td>静态几何及有限流动读出；不足以验证完整主动结构循环<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>核位置不是完整膜边界；合成分区不是实验分割；相位插值不是实测动态壁运动。<\/p>\n<p>Z9a 使用实测壁运动时，结论是“给定壁运动与边界条件下的流动预测”，不能称为主动 DCM 力学验证。壁运动也是校准数据时，不得再把同一壁运动作为独立预测成功。<\/p>\n<p>以 <code>y_pred = H_sim(q,u)<\/code> 定义观测算子：考虑 PIV 空间窗口、采样位置、时间/相位平均、可见范围、配准与测量不确定度。不要把未经滤波的点速度直接与窗口平均速度比较。血细胞轨迹也不是单相连续模型在所有尺度下的精确流体点速度。<\/p>\n<p>同鱼不同相位是相关重复观测，不是独立生物样本；以鱼/实验条件划分保留集。只有一条鱼时，将结论限制为个例或时间/工况外推。<\/p>\n<p>先开展敏感性与可辨识性检查；不能只用一条 V(t) 同时识别主动幅度、心肌刚度、ECM 刚度/τ 和外负载。先模块标定，再在保留频率、负载或局部扰动条件检验迁移。<\/p>\n<h3>9.2 强对照按需逐级引入<\/h3>\n<p>Z4 引入标定后的简单双层组织；Z8 引入 Hong 思路的低维模态和均匀连续组织；当主张细胞身份、状态、分裂及 ECM 记忆具有方法价值时，必须使用携带相同信息的动态材料域连续模型对照。对照不是替换生产路线。<\/p>\n<p>所有表示使用相同物理参数意义、边界条件、观测算子、校准/保留数据及局部平均尺度。每种表示可以通过同一独立标定数据获得其离散参数，但不能分别针对每个目标场景重新拟合。<\/p>\n<p>局部改变的对照包括总量或直方图保持的空间重排；纯重编号、无物理重网格、虚拟分区；材料及整体被动响应匹配。若完全相同的材料空间场只是换了身份标签，且方程不使用标签，不应产生物理变化。<\/p>\n<p>比较误差—成本曲线而非彩图细节。成本包括求解、几何重建、接触搜索、内层迭代、标定及失败重跑，并固定硬件和精度定义。<\/p>\n<h2>10. 可视化、执行权限与状态管理<\/h2>\n<p>每阶段保留离线 HTML 和驾驶舱入口，顺序为：问题—模型与假设—难点—实际结果—下一步。浏览器所需脚本和资源本地打包，不依赖 CDN；页面可离线打开，但不要求所有数据嵌在一个巨大 HTML 文件内。<\/p>\n<p>最小视图为真实三角网格、身份与材料方向、层次、单位、坐标、比例尺；支持旋转、透明和剖切。选择细胞及同步动画/曲线用同一物理时间与同一网格版本。放大形变、显示平滑、插值场和数值过滤均标注。<\/p>\n<p>没有启用的字段显示“尚未启用”。压力和应变等场的定义可查；节点力不标应力；网络牵引不未经推导标完整 ECM 应力。瞬时流线与示踪轨迹分别命名。<\/p>\n<p>正式阶段必须有至少一张定量验收图及证据入口：参数与单位、代码提交、内核提交、随机种子、求解器与阈值、依赖状态、原始快照、可重启检查点、验证脚本和机器可读摘要。预检只展示实际几何/数据检查，不伪造模拟曲线。<\/p>\n<p>失败页面保留最后有效状态、失效位置、残差及失败包。依赖测试是否阻断按实际代码路径判断，不因与心室无关的 FAIL 一概停止，也不忽略关键依赖 FAIL。<\/p>\n<p>状态至少区分 NOT_RUN、RUNNING、PASS（带明确适用范围）、FAIL_NUMERICAL、UNRESOLVED、BLOCKED_DATA、STOPPED_BUDGET。20 周期内未达周期状态可以是 UNRESOLVED 或 STOPPED_BUDGET，不伪装 PASS。<\/p>\n<p>Codex 仅可自主决定不改变物理语义的文件组织、绘图和局部重构。材料定义、耦合账本、阈值、对照、事件规则和数据主张改变必须提交变更说明并重新登记。阈值冻结后不按结果回调；发现标准错误时允许通过有版本的方案修订纠正，并重跑受影响验收，而不是永久保留错误标准。<\/p>\n<p>每阶段先做有上限的小规模成本测量，登记细胞数、每细胞网格、ECM 连接数、有效流体单元、时间步、耦合迭代、内存和累计计算量。预算不足时保持未解析，不通过降低精度获得名义 PASS。<\/p>\n<h2>11. 唯一首项任务：Z0 执行合同<\/h2>\n<p><strong>允许的工作：<\/strong> 登记新旧路线关系，读取并核验已有依赖记录；在登记的下载体量上限内获取公开小文件；检查文件结构、单位和配准信息；生成单细胞、双细胞、有限双层组织的合成静态入口；明确腔面构造方案；冻结 Z1 的实验输入、参数和验收定义。<\/p>\n<p><strong>禁止的工作：<\/strong> 不运行泵血、不加入分裂/分泌、不重标 M1、不修改已冻结物理参数、不复制第二个 DCM 引擎、不自动进入 Z1、不将数据缺项插值或合成后称为实验事实。<\/p>\n<p>Z0 最小输出为五类：<\/p>\n<ol>\n<li><strong>依赖能力表<\/strong>：力学路径/源代码位置/所依赖测试/最后有效提交/当前状态/心脏适用范围与缺项；包括那两个 Casebook FAIL 是否被本路线触及。<\/li>\n<li><strong>数据缺项表<\/strong>：来源及版本、许可、体量、年龄、鱼 ID、标记、单位、轴向、相位定义、时间戳、体素大小、速度单位、配准关系、动态覆盖、细胞边界及流场不确定度。<\/li>\n<li><strong>静态模型包<\/strong>：闭合细胞、组织连接和候选腔面的不同对象及 ID；几何检查结果；合成标记；未启用字段说明。<\/li>\n<li><strong>物理与账本草案<\/strong>：参考态、阻尼物理意义、主动能量、ECM 内变量、界面映射、端口及力/质量/能量符号；未知项保持 UNKNOWN。<\/li>\n<li><strong>Z1 执行合同<\/strong>：单/双细胞实验、三档表面网格和独立时间步、负载路径、参考解/独立检查、非零归一化尺度、输出字段、成本上限、失败与停止规则。<\/li>\n<\/ol>\n<p>Z0 报告只能声明资料/几何/合同层面的通过范围。若相关数据无法取得，记录 BLOCKED_DATA，不伪造实验结果；只要合成建模和必要依赖可定义，数据缺失不自动阻断 Z1。<\/p>\n<p>本次评估不写入 PRL 工作区，不宣布 Z0 通过。第一项获授权执行任务仍然是上述 Z0。<\/p>\n<h2>参考资料与核查范围<\/h2>\n<p>以下是本修订使用的公开一手资料标识，访问日期均为 2026-09-10。未作穷尽性新颖性检索。<\/p>\n<p>[1] University of Glasgow. <em>Multiview-SPIM-μPIV for mapping 3C-3D blood flow within beating zebrafish heart<\/em>. 2026. DOI: 10.5525/gla.researchdata.2322。官方记录及 Readme_2322.md；核查两个相位小文件和大文件申请说明。<\/p>\n<p>[2] Jiang 等作者仓库：GitHub <code>JJ473/BOE_multiview_SPIM_PIV<\/code>。核查 readme.md 与 config.py；确认公开处理速度场和不确定度数组的说明。正式 Z0 仍须实际读取数组并冻结提交版本。<\/p>\n<p>[3] Hong BD 等. <em>Modeling left ventricular dynamics with characteristic deformation modes<\/em>. Biomechanics and Modeling in Mechanobiology, 2019. DOI: 10.1007/s10237-019-01168-8。<\/p>\n<p>[4] Van Liedekerke P 等. <em>A quantitative high-resolution computational mechanics cell model for growing and regenerating tissues<\/em>. Biomechanics and Modeling in Mechanobiology 19, 189–220 (2020); online 2019-11-20. DOI: 10.1007/s10237-019-01204-7。<\/p>\n<p>[5] Quirós Rodríguez A, Fullana T, Le Chenadec V, Sayadi T. <em>A Conservative Cartesian Cut Cell Method for the Solution of the Incompressible Navier-Stokes Equations on Staggered Meshes<\/em>. arXiv:2211.10698。使用其算子性质和固定二维基准范围，不将其作为已完成的三维移动 FSI 实现。<\/p>\n<p>[6] Battista NA, Lane AN, Liu J, Miller LA. <em>Fluid Dynamics in Heart Development: Effects of Hematocrit and Trabeculation<\/em>. arXiv:1610.07510。二维、规定运动的 96 hpf 理想心脏；不等同本项目目标。<\/p>\n<p>[7] Serino DA, Banks JW, Henshaw WD, Schwendeman DW. <em>A stable added-mass partitioned (AMP) algorithm for elastic solids and incompressible flow: model problem analysis<\/em>. arXiv:1812.03192；及 <em>A stable added-mass partitioned (AMP) algorithm for elastic solids and incompressible flow<\/em>, arXiv:1812.05208。仅用于分区耦合稳定性和基准参考，不直接推断本项目过阻尼 DCM 已稳定。<\/p>\n<p>补充方法线索：Libat L 等. <em>A space-time extension of a conservative two-fluid cut-cell diffusion method for moving geometries<\/em>. arXiv:2512.23358。处理规定运动中的时空控制体和单元生灭，但方程为扩散而非本项目不可压缩 Navier–Stokes；不能作为后者已实现的证据。<\/p>\n<p>内部来源：用户提供的 M1 状态及方案正文；用户 Library 的 MeshCell3D Casebook 摘要。均不替代本地源码、运行包和失败依赖的正式审计。<\/p>\n"}}</script><script>
