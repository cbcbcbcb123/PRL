→ Z9a → Z9b → 汇总 Z9\n   → Z10 → Z11\n\nZ10b：涉及腔面拓扑的可选扩展，须 Z10 之后单独授权；不是 Z11 前置。\n<\/code><\/pre>\n<p>这只是默认执行次序，不把不相关模块假设为物理依赖。Z5 独立 CFD 不需要调用 DCM；Z3 可独立做网络材料试验。Z9 数据缺失只阻断对应实验主张，合成 Z10/Z11 满足真实数值依赖后可以另行授权，但不能自动跳过阶段。<\/p>\n<p>Z6 与 Z9 的主文件是<strong>控制入口<\/strong>，不授权一次跑完所有子门。Z4b、Z6a/b/c、Z9a/b、Z10b 拆开，是为了每次有明确的可检查结果和停止点。<\/p>\n<h2>4. 六份公共说明<\/h2>\n<table>\n<thead>\n<tr>\n<th>文件<\/th>\n<th>用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><a href=\"00_README_START_HERE.md\" data-open-doc=\"00_README_START_HERE.md\">本文件<\/a><\/td>\n<td>起步指令、阶段索引和执行顺序<\/td>\n<\/tr>\n<tr>\n<td><a href=\"01_GLOBAL_EXECUTION_CONTRACT.md\" data-open-doc=\"01_GLOBAL_EXECUTION_CONTRACT.md\">总执行合同<\/a><\/td>\n<td>权限、唯一内核、预算、状态/回退和变更<\/td>\n<\/tr>\n<tr>\n<td><a href=\"02_VISUALIZATION_AND_DATA_CONTRACT.md\" data-open-doc=\"02_VISUALIZATION_AND_DATA_CONTRACT.md\">可视化与数据合同<\/a><\/td>\n<td>真网格、离线 HTML、交互/同步、字段、原始数据和失败展示<\/td>\n<\/tr>\n<tr>\n<td><a href=\"03_VALIDATION_METRICS.md\" data-open-doc=\"03_VALIDATION_METRICS.md\">指标与验收<\/a><\/td>\n<td>单位、能量/质量/虚功、收敛、事件和材料账本<\/td>\n<\/tr>\n<tr>\n<td><a href=\"04_REFERENCES_AND_PROVENANCE.md\" data-open-doc=\"04_REFERENCES_AND_PROVENANCE.md\">来源与变更<\/a><\/td>\n<td>资料核查边界、各论文用途、v02→v03 扩展<\/td>\n<\/tr>\n<tr>\n<td><a href=\"05_REPORT_AND_CHANGE_TEMPLATES.md\" data-open-doc=\"05_REPORT_AND_CHANGE_TEMPLATES.md\">报告与变更模板<\/a><\/td>\n<td>Codex 阶段报告、机器摘要、失败包、变更请求<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>原 v02 保存在 <a href=\"sources/v02_original.md\" data-open-doc=\"sources/v02_original.md\">sources/v02_original.md<\/a>，不覆盖原文。模板目录中的 null/空表是待填字段，不是模拟结果；具体 CLI 由实际项目审计后生成，不预设一个不存在的命令。<\/p>\n<h2>5. 每阶段最低可视化承诺<\/h2>\n<p>每个实际阶段都有离线模型/网格入口、至少一张定量验收图、原始数据和日志；适用时有真实网格动画、选细胞/连接/单元、剖切、透明、字段色标、同物理时间曲线游标。无动力学阶段只显示真实静态检查/几何扫描，不制造压力/流量曲线。<\/p>\n<p>失败也有页面：最后有效状态、首次异常对象和残差。未启用字段不填零。节点力不写应力，ECM 连接不冒充完整三维应力场，规定壁运动不冒充主动耦合，实验插值不冒充测量。<\/p>\n<p>合同包内的 <code>index.html<\/code> 只是<strong>文档导航<\/strong>，可离线查看各份 MD 的预览，不是模拟驾驶舱。真正阶段结果的 HTML 必须由 Codex 从实际运行产物生成。<\/p>\n<h2>6. 执行保护与通过范围<\/h2>\n<p>默认 CPU、有上限预检、预算冻结、独立验证和一次一阶段。新增工程测试幅度/阈值是合成默认值，不是生理参数，正式前登记；已有批准定义不能被静默覆盖。<\/p>\n<p>没有真实计算不生成 PASS。即便物理子项通过，交付查看器缺失也要单列；有合成证据但缺实验数据，不声称生物验证。完整阶段矩阵都在 <a href=\"stage_manifest.json\">stage_manifest.json<\/a> 中，初始状态一致为 NOT_RUN。<\/p>\n"}, "01_GLOBAL_EXECUTION_CONTRACT.md": {"title": "总执行合同", "id": "公共说明", "kind": "common", "html": "<h1>PRL 阶段执行总合同 v03<\/h1>\n<p><strong>文档日期：2026-09-10。所有实验状态均为 NOT_RUN。<\/strong> 本包将 v02 拆为单阶段执行合同；没有检查本地代码、没有替用户运行模拟，也没有将资料核查升级为 Z0 PASS。<\/p>\n<h2>1. 范围与优先级<\/h2>\n<p>用户当前选定的路线不变：PRL 管心脏应用，唯一 <code>muse_dcm<\/code> 管 DCM；ECM 为非细胞性薄层黏弹网络；血液为腔内不可压缩牛顿流体；自建最小 CFD 使用交错笛卡尔网格、有限体积和投影，并在后续添加守恒切割单元。固定细胞数优先；生长、死亡、真实瓣叶、电生理、血细胞分辨流变与三维 ECM 占据不在本包默认范围。<\/p>\n<p>优先级：用户最新明确指令 &gt; 已登记的模型/阈值变更 &gt; 本包总合同与指标定义 &gt; 当前阶段具体合同 &gt; Codex 实现选择。发现物理或符号冲突，输出 <code>change_request.md<\/code>，不要静默择一。可先完成不受冲突影响的检查；受影响的正式计算必须停止。<\/p>\n<p>本包的新数值例子、载荷幅度、无量纲尺度和资源上限是<strong>工程测试默认值<\/strong>，不是斑马鱼参数，也不是已校准结果。第一次执行时将其写入预登记。已有更具体且已批准的物理参数不能被默认值覆盖。<\/p>\n<h2>2. 一次只执行一个阶段或一个子门<\/h2>\n<p>读取全部文档不等于获授权运行全部文档。唯一默认起点是 Z0。Z6、Z9 为总控制入口，实际计算分别由 Z6a/Z6b/Z6c 和 Z9a/Z9b 合同授权。Z4b 为单独腔面门，Z10b 为后续可选拓扑扩展，均不得顺带执行。<\/p>\n<p>阶段内部可以完成所列“必需”子实验，但不得自动启动下一阶段、开放范围之外的参数扫描、或为求 PASS 不断增加运行预算。调试运行与正式运行分离并分别编号。父阶段汇总只有在全部必需子门通过后才能 PASS。<\/p>\n<p>Z9 的数据不足不构成所有合成 Z10/Z11 的逻辑阻断。后两者满足真正数值前置门后仍需另行授权；不借此自动越过编号。<\/p>\n<h2>3. 本地仓库与唯一内核<\/h2>\n<p>首先只读检查用户打开的目录、项目说明、git 状态、现有脚本/测试/驾驶舱与依赖路径。<code>E:/Temp-Projects/PRL<\/code> 仅来自用户历史文字，是候选路径，不是假定已存在的 API 或当前工作目录。Windows/WSL 路径转换须实际验证。<\/p>\n<p>定位并记录：PRL 根目录、<code>muse_dcm<\/code> 唯一实现位置及版本、配置加载器、运行入口、快照格式、已有 PASS 的适用范围、关键 FAIL 的实际依赖。门户汇总不能替代运行包。M1 的 PASS 仍仅限原二维小应变全 FEM 范围。<\/p>\n<p>允许在唯一内核原位置做有测试的兼容修复，或按项目已有扩展点添加功能；不把代码复制到心脏目录形成第二引擎。不得 <code>git reset --hard<\/code>、删除失败包、覆盖用户修改或重新标记旧结果。改动共享力学路径后要重跑受影响回归；无关失败可登记而不一概阻断。<\/p>\n<p>本包中的建议目录、JSON 字段与概念接口并非声称仓库已有这些对象。优先适配现有实现；真实调用命令必须执行验证后写入 <code>commands.md<\/code>。不得报告虚构 CLI 执行成功。<\/p>\n<h2>4. 每个阶段都采用同一执行闭环<\/h2>\n<h3>4.1 审计和预登记<\/h3>\n<p>列出本阶段可用能力、待新增能力、外部数据及阻断项。将以下项目在正式运行前冻结：<\/p>\n<ul>\n<li>物理模型与关闭项；参考构型、边界条件、参数单位/来源及主动/耗散语义。<\/li>\n<li>必需/可选实验、网格与时间细化序列、参考解、观测区域、误差范数与非零尺度。<\/li>\n<li>求解器方法与形式阶次、迭代容差、回退规则、极小单元/接触/事件处理。<\/li>\n<li>所有通过阈值、预算、随机种子、输出频率和版本散列。<\/li>\n<\/ul>\n<p>没有既定绝对材料参数时，模块测试可采用有明确尺度变换的无量纲合成参数。不得把拟合 Z8 目标 PV 曲线当成 Z1 材料标定，也不得为不同几何分别调物理参数。实际需要新增未定义物理机制时交付 <code>BLOCKED_SPEC<\/code> 和最小变更请求。<\/p>\n<h3>4.2 小规模预检<\/h3>\n<p>以最小几何和最短有效历程确认：程序能运行、单位一致、符号方向正确、无 NaN/负体积/异常拓扑、导出可读取、CPU/内存/存储量受控。预检图可展示真实几何和实际发生的短历程，但必须带 <code>PILOT<\/code> 标签，不当作正式收敛证据。<\/p>\n<h3>4.3 正式执行与独立验收<\/h3>\n<p>按冻结矩阵运行，不用全参数笛卡尔积代替有目的的实验设计。分别验证空间、时间、迭代、材料罚参数、物理区域大小与细胞数量；不得混为同一“分辨率”。独立验证器优先从快照重算体积、通量积分、能量差、作用反作用和观测量，另与求解器账本对照。<\/p>\n<p>任何真实失败先缩到可复现最小包，再做不改变物理语义的修复。修复后建立新 run_id；不修改旧日志。若标准本身有错误，记录有版本修订、影响范围及重跑计划；不能看结果调阈值。<\/p>\n<h3>4.4 交付和停止<\/h3>\n<p>交付阶段报告、离线页面、原始证据、独立验证命令及失败信息。报告下一阶段合同的就绪条件，但不启动下一阶段。没有模型计算也可以交付静态检查图；不得生成伪装为结果的期望曲线。<\/p>\n<h2>5. 资源边界：上限，不是工期承诺<\/h2>\n<p>以下为本包默认保护值；机器或项目已有更小上限时从严执行。改变上限只在正式计算前登记；超过冻结上限需新授权，不得无界重试。<\/p>\n<table>\n<thead>\n<tr>\n<th>项目<\/th>\n<th>默认保护值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>计算设备<\/td>\n<td>CPU；不自动切 GPU、云计算或付费服务<\/td>\n<\/tr>\n<tr>\n<td>线程<\/td>\n<td>最多 4，并不超过可用物理核心数；无法查询则 1<\/td>\n<\/tr>\n<tr>\n<td>内存<\/td>\n<td>最多 8 GiB 且不超过启动时可用内存的 35%；未知则先用 2 GiB<\/td>\n<\/tr>\n<tr>\n<td>预检<\/td>\n<td>单例最多 120 s，累计最多 600 s；允许更短<\/td>\n<\/tr>\n<tr>\n<td>正式阶段/执行子门<\/td>\n<td>wall time 最多 4 h、CPU core-hours 最多 16 h，先到者停止<\/td>\n<\/tr>\n<tr>\n<td>输出<\/td>\n<td>默认每阶段最多 4 GiB；先控制展示抽样，不删除验收需要的原始账本<\/td>\n<\/tr>\n<tr>\n<td>Z0 下载<\/td>\n<td>总计最多 256 MiB，先取清单与小文件；不自动申请、下载 37 GB 原始数据<\/td>\n<\/tr>\n<tr>\n<td>周期运行<\/td>\n<td>首轮最多 20 周期；未达周期态不自动归类数值失稳<\/td>\n<\/tr>\n<tr>\n<td>重试<\/td>\n<td>单步拒绝/回退默认最多 6 次；单问题自动修复重跑最多 3 轮，之后提交诊断<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>为实际代码设置 timeout、内存监视、停止标记和检查点；不得仅在 README 写上限而不执行。预算耗尽保留 <code>STOPPED_BUDGET<\/code>，不缩短必须的验收项后给 PASS。数据数组优先查看元数据、dtype、形状与小切片，避免整包解压或危险反序列化。<\/p>\n<h2>6. 物理不变项<\/h2>\n<p>细胞目标体积不随激活变化；实际体积罚误差单独报告。闭合细胞、组织连接和血液共同腔面是三项不同检查。共同腔面是细胞自由度的映射，不能成为独立施加运动的隐藏膜。虚拟端口封帽仅用于体积计算，不是实体壁。<\/p>\n<p>每个阻尼项有明确物理对应物、参考速度和功率；不能用隐含背景阻力隐藏耦合不稳定。主动功、端口功、外力功、弹性能、流体/结构动能、物理耗散和事件/材料变化项各记一次。参见指标合同。<\/p>\n<p>第一版只用固定端口平面及压力—流量负载，不同时独立指定同一端口的压力和流量。封闭不可压缩腔不允许被规定整体缩小。没有主动驱动但存在外部压差或初始储能时可以有流动。<\/p>\n<h2>7. 接口和可回退状态<\/h2>\n<p>仅维持三个概念接口：结构状态→几何/力/能量；流体与界面状态→流场/通量/反力；快照→数据/可视化。内部类和函数名由实际项目决定。<\/p>\n<p>结构状态至少包含几何与材料参考态、身份/谱系、主动材料方向、目标量与实际量、黏弹内变量、接触/连接历史、激活时间。流体状态包括交错速度、压力及压力基准、切割几何/版本、负载/阀状态与累计收支。<\/p>\n<p>每次同一时间步内迭代必须从同一个已接受的 t_n 状态重算候选 t_(n+1)。不得重复累积激活、ECM 松弛、阀状态、材料源项和主动功。只有收敛接受后提交一次。拒绝时间步需原子回退全部状态与事件队列。<\/p>\n<p>展示快照不必能重启。真正检查点必须含所有内部历史、随机数发生器状态、版本与单位，能够通过连续运行/中断重启对照。<\/p>\n<h2>8. 状态与主张分开<\/h2>\n<p><code>PASS<\/code> 必须注明适用对象、参数与范围。<code>physics_status<\/code>、<code>visualization_status<\/code>、<code>claims_status<\/code> 单独登记。缺资料可 <code>BLOCKED_DATA<\/code>，缺必要代码能力可 <code>BLOCKED_DEPENDENCY<\/code>，缺物理定义可 <code>BLOCKED_SPEC<\/code>，分辨率不足为 <code>UNRESOLVED<\/code>。<\/p>\n<p>页面完成不是物理通过；物理通过但离线页面缺失，不是阶段交付完成。无生物数据的合成 PASS 不能支持实验验证。强对照消除差异就停止独占性主张，不靠追加生物过程扩大叙事。<\/p>\n<h2>9. 变更权限<\/h2>\n<p>Codex 可调整文件组织、绘图布局、缓存和不改变数值语义的局部重构；可修复实现错误并重跑受影响测试。不得自行改变模型范围、材料定义、冻结阈值、守恒项、强对照、事件规则或数据层级。<\/p>\n<p>所有影响语义的变更写清：原定义、修改原因、新方程/条款、可能改变的结论、受影响测试和所需重新授权。开发中发现算术或程序 bug 不需要把错误永久冻结，但必须留存旧证据与新版本。<\/p>\n"}, "02_VISUALIZATION_AND_DATA_CONTRACT.md": {"title": "可视化与原始数据", "id": "公共说明", "kind": "common", "html": "<h1>可视化与原始数据交付合同<\/h1>\n<h2>1. 用户应该怎样检查每个阶段<\/h2>\n<p>每阶段必须有 <code>index.html<\/code>，页面固定顺序为：<strong>这一步问什么 → 模型与假设 → 当前难点 → 实际结果 → 验收证据 → 下一步但不执行<\/strong>。首屏显示阶段 ID、run_id、状态、物理/可视化/主张状态和代码版本。缺资料、失败、未运行应在首屏可见，不藏在日志末尾。<\/p>\n<p>页面不是一个只有按钮的空壳。最小交付包含一个已加载的代表状态、至少一张来自真实数据的定量图、字段定义和原始证据入口。用预计算快照播放，不从浏览器启动求解器。合成、实验、重建、校准、保留和参考解必须有不同文字标签；不要仅靠颜色区分。<\/p>\n<h2>2. 离线双击可用，不依赖互联网<\/h2>\n<p><code>file://<\/code> 双击打开是最小浏览要求。浏览器读取本地文件有安全限制，不能把 <code>fetch('./data.json')<\/code> 在开发服务器上可用就当离线通过。采取以下实际可行的一种：将小型展示数据嵌入 HTML；用本地经典脚本携带静态数据；或让用户通过文件选择器加载数据包。JS、字体替代方案与渲染资源本地化，不依赖 CDN。<\/p>\n<p>完整大数据可单独保存，首页只加载降采样的<strong>显示副本<\/strong>。原始网格和原始曲线不能因浏览性能被覆盖。可提供本地 HTTP 浏览作为附加选项，但不能把它当成“双击 HTML”的唯一实现。<\/p>\n<p>Z0 必须建立可复用最小查看器；后续扩展字段而不是每阶段重写前端。优先复用 PRL 已有查看器。库名和具体 API 由 Codex 检查项目实际版本后确定；本合同不声称某个 API 已存在。<\/p>\n<h2>3. 三维模型视图<\/h2>\n<h3>必需交互<\/h3>\n<p>支持旋转、缩放、平移、重置视角、正交/透视说明、坐标轴和比例尺。支持原始三角边显示、透明度、按层开关、剖切/裁剪平面，以及点击细胞/连接/面片显示 ID 和数值。显示几何使用实际坐标；变形放大须默认关闭并醒目标注倍数。<\/p>\n<p>细胞显示 <code>cell_id<\/code>、<code>cell_type<\/code>、<code>mesh_version<\/code>、参考态来源、实际/目标体积；主动阶段加材料方向。流体阶段显示有效流体域、固定端口平面及边界类型；心肌内部数值背景不能画成血液。ECM 为连接网络或经过定义的牵引，不可涂成虚构完整体应力。<\/p>\n<p>有截面时同时说明截取的是求解几何、展示平滑几何还是体图像切片。对称对照保持同视角、同色标和同阈值。单位与数值精度适合实际量级。<\/p>\n<h3>只有 CFD 时<\/h3>\n<p>无需为了统一页面而伪造细胞。显示 Cartesian/切割网格、壁面、端口、速度与压力探针。选择对象改为单元或壁面片 ID；细胞栏显示“不适用：本阶段无 DCM”。<\/p>\n<h3>没有动力学时<\/h3>\n<p>Z0 和 Z6a 的几何扫描可以播放几何位置，但必须标为“几何扫描/规定轨迹”，不是求解出来的生理运动。若只做静态几何，时间控件禁用；可有网格质量分布和数据缺项图，不能出现虚构压力或泵血曲线。<\/p>\n<h2>4. 时间同步和事件显示<\/h2>\n<p>快照须有真实 <code>physical_time<\/code>、<code>step_id<\/code>、<code>mesh_version<\/code>、<code>event_id<\/code>（无事件为 null）、<code>validity<\/code>。动画帧与曲线游标通过同一时间索引对应，不通过“第几张图片”猜。压力或速度处于半步/整步时必须明确对齐方法；不能默认为同一物理时刻。<\/p>\n<p>显示抽帧不影响原始积分频率。插值仅用于显示且标注，不能改变验收数据。分裂/重网格事件前后要有 <code>t_event^-<\/code> 和 <code>t_event^+<\/code> 两个状态；不能在不同拓扑间直接插值三角顶点。保留暂停、逐帧、播放速度、跳到最后有效状态和事件标记功能。<\/p>\n<p>曲线提供当前数值、参考曲线、误差/残差与阈值线。主图可同页并列，但每张独立图有自己的坐标、图注和原始 CSV；不得把不同量纲硬叠在同一纵轴。<\/p>\n<h2>5. 字段语义与缺失值<\/h2>\n<table>\n<thead>\n<tr>\n<th>字段例子<\/th>\n<th>单位/定义<\/th>\n<th>禁止替代<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>节点力<\/td>\n<td>N；每节点积分力<\/td>\n<td>Pa 应力<\/td>\n<\/tr>\n<tr>\n<td>膜张力/面应力合力<\/td>\n<td>N/m；明确局部定义<\/td>\n<td>未除厚度的三维应力<\/td>\n<\/tr>\n<tr>\n<td>连接反力<\/td>\n<td>N；作用端及正负号明确<\/td>\n<td>连续 ECM 完整体应力<\/td>\n<\/tr>\n<tr>\n<td>面牵引<\/td>\n<td>Pa；由面反力/面积及定义得到<\/td>\n<td>未知面积下的节点力<\/td>\n<\/tr>\n<tr>\n<td>表面应变<\/td>\n<td>无量纲；相对材料参考态<\/td>\n<td>未定义的体应变<\/td>\n<\/tr>\n<tr>\n<td>压力<\/td>\n<td>Pa；记录基准/规范<\/td>\n<td>无说明的绝对压力<\/td>\n<\/tr>\n<tr>\n<td>WSS<\/td>\n<td>Pa；切向流体牵引，需独立通过门<\/td>\n<td>流速大小或未经验证的单元差分<\/td>\n<\/tr>\n<tr>\n<td>流量<\/td>\n<td>m³/s；说明方向与相对/绝对通量<\/td>\n<td>速度箭头计数<\/td>\n<\/tr>\n<tr>\n<td>主动功<\/td>\n<td>J；使用冻结能量分解<\/td>\n<td>代谢功或 ATP 消耗<\/td>\n<\/tr>\n<tr>\n<td>ECM 材料量<\/td>\n<td>kg 或明示的无量纲相对量<\/td>\n<td>未定义厚度或浓度<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>disabled<\/code>、<code>not_computed<\/code>、<code>invalid<\/code>、<code>not_applicable<\/code> 分开；缺值用 null/NaN 加掩码，不填 0。色标不得把缺值映射为低值正常区域。瞬时流线、时间积分的示踪轨迹和实际红细胞轨迹分开命名。<\/p>\n<p>应变、牵引、WSS 的空间平均支持区域要存到数据中；多个网格间必须使用同一物理区域，不以“三个三角形”作为固定尺度。<\/p>\n<h2>6. 最小原始数据结构（语义合同，不限定存储库）<\/h2>\n<p>建议每次运行如下；适配现有结构时保存对应关系：<\/p>\n<pre><code class=\"language-text\">&lt;stage&gt;/&lt;run_id&gt;/\n  preregistration.json\n  run_manifest.json\n  commands.md\n  report.md\n  summary.json\n  metrics.csv\n  snapshots/           # 几何和场，可用项目原有二进制格式\n  checkpoints/         # 含所有历史的独立重启文件\n  tables/              # 每步账本、相位、探针及映射\n  figures/             # PNG/SVG 与来源 CSV\n  viewer/index.html\n  viewer/assets/       # 本地脚本和展示副本\n  verification/        # 独立复核程序和实际日志\n  failures/            # 失败状态、异常堆栈、最小重现\n<\/code><\/pre>\n<p>几何数据至少能追踪：节点坐标、面连接、细胞/层/材料 ID、壁面标记、端口标记、参考态和版本。流体数据保留速度分量实际交错位置、压力位置、活动单元体积/开口面积与单位；不得导出成“所有量都在中心”的伪原始数据。<\/p>\n<p>记录快照、时间序列、展示抽样各自频率及过滤规则。保存字段字典 <code>field_dictionary.json<\/code>；每项有 <code>association<\/code>（node/face/cell/link/fluid_face/fluid_cell/global）、unit、definition、validity、reference_configuration、time_location。<\/p>\n<h2>7. 独立可视化验收<\/h2>\n<p>至少完成：<\/p>\n<ol>\n<li>断网并以 <code>file://<\/code> 打开，检查首屏、模型、曲线、图例和证据链接；禁止网络外链作为必要运行依赖。<\/li>\n<li>从原始快照随机选 3 个真实有效对象核对坐标/字段/单位；少于 3 个则全部检查。更换时间时 ID 与曲线游标同步。<\/li>\n<li>开关原始边、透明与剖切；确认没有因展示裁剪修改用于体积/通量积分的几何。<\/li>\n<li>对照图保持相同视角/色标；激活关闭等零值场可有全零数据，但“未计算”不可如此表示。<\/li>\n<li>失败运行页面能定位最后有效时刻、首个异常对象和残差；异常状态不得被自动平滑抹掉。<\/li>\n<li>导出至少一张完整页面截图和阶段规定的静态图；检查文字未截断、色标可读、轴标签有单位。动态阶段提供一段从真实快照生成的 GIF/视频预览，或经过实际测试的离线交互播放。<\/li>\n<\/ol>\n<p>自动浏览器可用时做 smoke test 并保存截图和控制台日志；不可用时执行静态资源/数据一致性检查，并把需要人工查看的部分明确列出，不能谎称已经肉眼看过。只完成静态资源检查不等于交互验收通过。<\/p>\n<h2>8. 驾驶舱集成<\/h2>\n<p>把阶段页面接入原 PRL 驾驶舱，保留原路径与用户修改。若驾驶舱无法定位，生成阶段独立入口和 <code>integration_pending.md<\/code>，不捏造集成成功。首页按阶段显示“可运行合同”和“真实结果”两种不同链接；NOT_RUN 阶段只能进入合同/几何说明，不展示看似成功的模拟卡片。<\/p>\n"}, "03_VALIDATION_METRICS.md": {"title": "指标与验收公式", "id": "公共说明", "kind": "common", "html": "<h1>统一数值指标、符号与验收阈值<\/h1>\n<p>本文件的方程是供实现和独立验证使用的合同；不是已求解结果。新增工程阈值在第一次正式计算前登记冻结，不代替实验不确定度。光滑解析基准中的离散误差，与代数恒等式误差必须分开。<\/p>\n<h2>1. 单位、参考尺度与压力规范<\/h2>\n<p>内部统一 SI，或完整无量纲化。若用基本尺度 L0、T0、F0，则 U0=L0/T0、E0=F0 L0、P0=F0/L0²、Q0=L0³/T0；密度尺度为 F0 T0²/L0⁴，黏度尺度为 F0 T0/L0²。每个输出能无歧义还原；不得把无量纲 1 自动叫作 1 Pa。<\/p>\n<p>CFD 中 ν=μ/ρ；Re=ρUL/μ，α=L√(ωρ/μ)，需声明 L 是半间隙、半径还是其他长度。ρ、μ 在数值阶段可为合成值，生物解释前需要来源。纯 Neumann 压力具有常数自由度，使用一致的零均值/参考点；开放压力负载已固定规范时不可再随意平移而不同时平移外部压力。<\/p>\n<p>归一化分母在预登记中固定非零。比较接近零的信号用绝对误差/独立尺度，不除以接近零的实测幅值。不以全程最大输出作为事后放松分母。<\/p>\n<h2>2. 能量梯度与力学平衡<\/h2>\n<p>光滑保守项：F=-∂E/∂q。对单位方向 d，比较中心差分 <code>[E(q+εd)-E(q-εd)]/(2ε)<\/code> 与 <code>-F·d<\/code>，对 ε/L0 做 10^-2 至 10^-7 扫描。期待截断误差下降后遇到舍入地板，不要求最小 ε 最好。接触切换点不使用光滑导数验收。<\/p>\n<p>默认方向导数相对误差目标为 10^-6，刚体能量不变/内力合力合矩代数目标为 10^-10；如果已有实现的浮点尺度导致不能达到，先诊断而非悄悄修改阈值。非零参考力矩为 F0L0。加载平衡看 <code>||F_internal+F_external+F_constraint||<\/code>，过阻尼动态看 <code>||C v-F||<\/code>，不能把动态非零内力当作失衡。<\/p>\n<p>约束反力、固定背景阻力和外部支撑各列明。内部力若形成力偶，应按相应材料机制计入力矩；不能只验合力。旋转客观性包括：无应变刚体转动不增加应力，已存在的应力随刚体转动正确变换。<\/p>\n<h2>3. 主动能量和 ECM 内变量<\/h2>\n<p>主动参考长度模型：<\/p>\n<pre><code class=\"language-latex\">E_{act}=\\tfrac12 k[\\ell(q)-\\ell_0(a)]^2,\\qquad\nP_{act}=\\frac{\\partial E_{act}}{\\partial a}\\dot a=-k(\\ell-\\ell_0)\\dot\\ell_0.\n<\/code><\/pre>\n<p>k 固定时使用上述式；k 随激活改变需另计导数。不能又计一次同一纤维节点力做功为额外主动输入。按同一时间积分顺序记录正、负主动功；不是 ATP 或代谢账本。<\/p>\n<p>标准线性固体连接：<\/p>\n<pre><code class=\"language-latex\">E_e=\\tfrac12k_\\infty x^2+\\tfrac12k_1(x-z)^2,\\quad\nf_e=k_\\infty x+k_1(x-z),\\quad \\dot z=(x-z)/\\tau,\\quad \\tau=\\eta/k_1,\n<\/code><\/pre>\n<pre><code class=\"language-latex\">\\dot E_e=f_e\\dot x-\\eta\\dot z^2.\n<\/code><\/pre>\n<p>x、z 是长度，k 的单位为 N/m、η 为 N·s/m。平面界面代表面积 A、厚度 t0 下，法向/剪切目标刚度分别按 E_n A/t0、G A/t0 标定；斜连接需由整体应变能验证，不机械套法向公式。<\/p>\n<h2>4. 共同腔面、几何守恒与质量<\/h2>\n<p>细胞闭合、组织连接、血液腔面封闭分别检查。除标记端口外，无未解释的开边、非流形连接、重复面或自交。体积 V 用真实边界及虚拟固定端口封帽计算；封帽不属于固体能量或无滑移壁。<\/p>\n<p>n_f 为指向流体域外的法向，入口朝腔内正、出口朝腔外正：<\/p>\n<pre><code class=\"language-latex\">R_V(t)=V(t)-V(0)-\\int_0^t(Q_{in}-Q_{out})\\,dt.\n<\/code><\/pre>\n<p>每周期 |R_V|/V_ref≤10^-3；同时记录周期内 max|R_V|、逐步残差、长期漂移、误差/射出体积。局部 Cartesian 单元流体占据体积应满足<\/p>\n<pre><code class=\"language-latex\">\\frac{dV_K}{dt}=\\int_{\\Gamma_w\\cap K}w\\cdot n_f\\,dA.\n<\/code><\/pre>\n<p>壁扫掠几何与开口通量在同一时间离散中兼容。体积误差不能靠全域补液消去。闭合不可压缩域规定壁运动需满足全局积分兼容；整体缩小必须有开口。<\/p>\n<p>独立验证用边界积分/散度公式重算全局体积，另与切割体积和报告值交叉检查。比较解析曲面与分片三角曲面的误差时区分“几何逼近误差”和“同一个多面体被切割求积的误差”。<\/p>\n<h2>5. 界面功、合力和合力矩<\/h2>\n<p>设真实壁坐标 XΓ=g(q)，J=∂g/∂q。fΓ 表示固体对流体的<strong>已积分<\/strong>界面力，则<\/p>\n<pre><code class=\"language-latex\">v_\\Gamma=J\\dot q,\\quad F_{f\\to s}=-J^Tf_\\Gamma,\\quad\n\\dot q^T F_{f\\to s}+v_\\Gamma^T f_\\Gamma=0.\n<\/code><\/pre>\n<p>若输入为牵引，必须乘面求积权重。通过映射的代数误差目标≤10^-10；分母使用固定的力×速度尺度或可靠范数乘积加非零下界。至少以随机速度/力、刚体平移、刚体旋转和实际界面数据分别测试。映射矩阵来源相同不等于其几何导数正确；以 g(q) 的数值方向导数另验 J。<\/p>\n<p>fΓ 的实际计算必须与流体动量控制体的壁压力、黏性通量同源；不能在动量方程中用一种力，在结构反力中另用一个不守恒的后处理梯度。空间恒等式不替代力和速度在同一时刻配对的时间功验收。<\/p>\n<h2>6. 总机械能与端口<\/h2>\n<p>系统包含流体和细胞/ECM，固定端口平面：<\/p>\n<pre><code class=\"language-latex\">\\Delta(K_f+K_s+E_s)=W_{act}+W_{ports}+W_{ext}-D_{phys}+R_E.\n<\/code><\/pre>\n<p>过阻尼结构 K_s=0，但其阻尼耗散仍需计入。所有固定支撑、外部压力、预载、体力与材料/事件源按系统边界记账。<\/p>\n<pre><code class=\"language-latex\">P_{ports}=\\sum_p\\int_{\\Gamma_p}\\left[u\\cdot(\\sigma n)-\\tfrac12\\rho|u|^2u\\cdot n\\right]dA,\n\\quad\\sigma=-pI+2\\mu D(u).\n<\/code><\/pre>\n<p>仅 pQ 一般不完整；需要黏性牵引功与动能输运。移动端口首版禁用。物理耗散应非负（容忍预登记浮点地板），数值耗散只有能从离散算子独立算出时才能单列；不能把残差改名为数值耗散。<\/p>\n<p>每周期 |R_E|/E_ref≤1%，并给出细化趋势及周期内最大值。E_ref 来自冻结的合成驱动/载荷尺度，不以可能正负抵消的净主动功作唯一分母。存在开阀损失或回流稳定化时写出其功率。<\/p>\n<p>PV 环可辅助比较。<code>-∮p_c dV<\/code> 解释为壁面对流体的压力功需满足压力近似均匀、符号/跨壁参考明确；它不自动等于出口能量或净可用液压功。<\/p>\n<h2>7. 收敛、周期和局部量<\/h2>\n<p>至少三档 h 和三档 Δt，分别变化。细胞数、每细胞三角网格、ECM 连接密度、CFD 网格与组织片大小五项独立登记。预检可少档，正式 PASS 不可省略合同规定的档位。<\/p>\n<p>整体中细差≤2%，预定局部差≤5%。这些是验收门，不是单凭两点证明收敛。光滑基准记录误差对 h/Δt 的拟合阶次；方法的预期阶次在正式结果前冻结，无法宣称所有曲壁压力/WSS 都与速度具有相同阶次。非单调或未进入渐近区不得强行 Richardson 外推。<\/p>\n<p>求解容差加严 10 倍后，变化应小于估计离散误差的 10%（需要可解析的非零误差尺度），否则先消除迭代误差。解析为零的散度以独立尺度 L0/U0 归一化，默认全局加权范数≤10^-8；切割区还需局部通量残差，不用小体积放大后的单点散度单独决定成败。<\/p>\n<p>长周期先最多 20 个；末两周期主要量差&lt;1%，同时检查均值漂移、ECM 慢变量和初始瞬态。比较采用同一驱动相位，不允许事后任意相位平移以制造周期稳定。未达周期态标 <code>UNRESOLVED<\/code> 或 <code>STOPPED_BUDGET<\/code>。<\/p>\n<p>局部量固定物理区域或材料标签，优先面积/体积加权均值、分位数与积分；尖角附近最大应力/WSS 不作默认主指标。小信号相位只在响应幅度高于冻结可靠性下限时报告，否则 <code>not_resolved<\/code>。<\/p>\n<h2>8. 事件与材料周转<\/h2>\n<p>分裂事件：<\/p>\n<pre><code class=\"language-latex\">E^+-E^-=W_{event}-D_{event}+R_{transfer}.\n<\/code><\/pre>\n<p>W_event/D_event 必须由声明的机制或材料创建规则独立给出，不能把任意实测能量差事后命名为事件功。纯重编号/纯重网格无物理源项，只允许量化转移误差。广延量守恒与强度量继承分开；不能把一份总量复制两次。<\/p>\n<p>材料周转：dm/dt=s-k_d m；若 E=E(q,z,m,参考态)，需记录材料量和参考态变化的能量贡献。新沉积无应力/带预拉伸是不同模型；降解携带的储能必须有去向。薄层网络增量不等于几何增厚。<\/p>\n<h2>9. 实验误差<\/h2>\n<p>数值门与实验门分开。比较 y_pred=H(q,u)，H 包含空间平均、时间/相位采样、配准、掩码及测量类型。使用不确定度时包括相关性和缺失数据，不把同一条鱼不同相位当独立生物样本。只有一个个体时限定个例/工况外推，不声称群体预测。<\/p>\n"}, "04_REFERENCES_AND_PROVENANCE.md": {"title": "资料来源与变更", "id": "公共说明", "kind": "common", "html": "<h1>资料来源、核查范围与 v03 变更说明<\/h1>\n<h2>1. 母文档与证据边界<\/h2>\n<p>本包由用户已提供的 v02 拆解并补成执行合同。原文按字节保留在 <a href=\"sources/v02_original.md\" data-open-doc=\"sources/v02_original.md\">sources/v02_original.md<\/a>。v03 没有访问用户 Windows PRL、M1 完整运行包或 <code>muse_dcm<\/code> 源码；所有计算阶段仍 NOT_RUN。来源网页可访问不等于 Z0 已完成，合同检查不等于求解器验证。<\/p>\n<p>2026-09-10 对下列公开 HTML 页面/摘要与仓库说明做了有限复核；不是穷尽性文献检索，没有把所有论文算法逐行复现。Codex 正式引用/实现时应保存具体版本、可访问原文、许可和使用范围。<\/p>\n<h2>2. 一手来源登记<\/h2>\n<table>\n<thead>\n<tr>\n<th>ID<\/th>\n<th>标识与入口<\/th>\n<th>本包用途<\/th>\n<th>不能推断<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>R1<\/td>\n<td>Glasgow, Multiview-SPIM-μPIV for mapping 3C-3D blood flow within beating zebrafish heart. DOI 10.5525/gla.researchdata.2322。<code>https://researchdata.gla.ac.uk/2322/<\/code><\/td>\n<td>官方文件清单/来源；记录小影像/代码及大数据申请限制<\/td>\n<td>年龄、完整细胞膜和全周期壁运动均已齐备<\/td>\n<\/tr>\n<tr>\n<td>R2<\/td>\n<td>作者仓库 JJ473/BOE_multiview_SPIM_PIV。<code>https://github.com/JJ473/BOE_multiview_SPIM_PIV<\/code><\/td>\n<td>处理速度快照、位置/速度/不确定度数组及分析说明<\/td>\n<td>数组已由本包下载验证、与全部壁相位已配准<\/td>\n<\/tr>\n<tr>\n<td>R3<\/td>\n<td>Hong BD 等，Modeling left ventricular dynamics with characteristic deformation modes，2019。DOI 10.1007/s10237-019-01168-8。<code>https://link.springer.com/article/10.1007/s10237-019-01168-8<\/code><\/td>\n<td>理想构型、低维变形和整体/局部比较线索<\/td>\n<td>人体左室参数可直接用于斑马鱼<\/td>\n<\/tr>\n<tr>\n<td>R4<\/td>\n<td>Van Liedekerke P 等，A quantitative high-resolution computational mechanics cell model for growing and regenerating tissues，2020，online 2019。DOI 10.1007/s10237-019-01204-7。<code>https://link.springer.com/article/10.1007/s10237-019-01204-7<\/code><\/td>\n<td>三维细胞网络、被动/接触/组织标定与分裂思路；核对阻尼语义<\/td>\n<td>心肌主动周期收缩和本项目 FSI 已通过<\/td>\n<\/tr>\n<tr>\n<td>R5<\/td>\n<td>Quirós Rodríguez A 等，A Conservative Cartesian Cut Cell Method for the Solution of the Incompressible Navier-Stokes Equations on Staggered Meshes。arXiv:2211.10698。<code>https://arxiv.org/abs/2211.10698<\/code><\/td>\n<td>守恒交错切割算子、离散结构参考<\/td>\n<td>本项目三维移动几何与状态转移已经完成<\/td>\n<\/tr>\n<tr>\n<td>R6<\/td>\n<td>Battista NA 等，Fluid Dynamics in Heart Development: Effects of Hematocrit and Trabeculation。arXiv:1610.07510。<code>https://arxiv.org/abs/1610.07510<\/code><\/td>\n<td>既有心脏流体工作及模型边界参考<\/td>\n<td>与本路线三维主动细胞双向耦合完全等价<\/td>\n<\/tr>\n<tr>\n<td>R7<\/td>\n<td>Serino DA 等，AMP model problem analysis，arXiv:1812.03192；完整算法 arXiv:1812.05208。<code>https://arxiv.org/abs/1812.03192<\/code>；<code>https://arxiv.org/abs/1812.05208<\/code><\/td>\n<td>附加质量/阻尼稳定性和独立 FSI 基准线索<\/td>\n<td>弹性连续体算法可未经推导直接保证过阻尼 DCM 稳定<\/td>\n<\/tr>\n<tr>\n<td>R8<\/td>\n<td>用户给定 Zenodo 记录 15627197。<code>https://zenodo.org/records/15627197<\/code><\/td>\n<td>备用资料入口<\/td>\n<td>本次访问未成功，文件内容/数量/体量不重新确认为事实<\/td>\n<\/tr>\n<tr>\n<td>R9<\/td>\n<td>Libat L 等，A space-time extension of a conservative two-fluid cut-cell method for moving diffusion problems。arXiv:2512.23358v2。<code>https://arxiv.org/abs/2512.23358v2<\/code><\/td>\n<td>规定运动下时空控制体与单元生灭的补充线索<\/td>\n<td>方程为扩散，不是完整不可压缩 Navier–Stokes 或本项目 FSI<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>R1 官方当前记录列出两个约 5 MB 相位影像和约 6 MB 代码，约 37 GB 大数据需申请；Z0 仍须实际读取小文件并核对单位、年龄和相位。R2 的 README 说明快照含三组位置、速度及不确定度数组；这只是可读性入口，不是本包已取得配对生物证据。<\/p>\n<p>v02 对 R9 标题的描述保留在原文件；本表采用本次页面显示的正式标题，不据此改变任何计算状态。<\/p>\n<h2>3. 本包新增测试与公式的来源性质<\/h2>\n<p>Poiseuille、振荡通道、制造解、活塞和 SLS 等式在对应阶段给定方程及适用边界，是用于独立验证的解析/直接推导合同，不是实验曲线。Codex 需先用独立解析/符号程序检验，再作为求解器参考。制造源项不得由待验离散算子自身生成。<\/p>\n<p>Z11 有限矩沉积记忆方程由同连接共同参数的线性逐批 SLS 方程直接求和，适用范围已写清；不是声称发现或实现了任意非线性 ECM 重塑理论。与逐批独立参考一致性、正性及能量验收仍 NOT_RUN。<\/p>\n<p>文档生产时对部分代数关系所做的编辑性检查只属于文档 QA，不是 PRL 或 <code>muse_dcm<\/code> 实验。原始/模拟快照、CPU 测量、求解残差与生物误差必须由未来实际运行产生。<\/p>\n<h2>4. v02 → v03 的主要扩展<\/h2>\n<p>保持路线与 Z0–Z11 编号，将 Z4b、Z6a/b/c、Z9a/b、Z10b 拆为单独文件；Z6/Z9 是控制入口，避免一份长指令自动跨关。<\/p>\n<p>每阶段新增：可执行任务顺序、必需算例/对照、边界/载荷、参考解或独立检查、主要读出、可视化清单、原始数据、异常处理和明确停止点。保留现有质量10^-3、能量1%、整体/局部2%/5% 等主阈值，新增合成单元测试阈值和资源保护值必须首次正式前冻结。<\/p>\n<p>统一可视化明确 <code>file://<\/code> 离线双击、小型展示副本与原始数据分离、真实时间/版本同步、字段缺失与零值分离。恢复/检查点保存完整内变量，不只网格。<\/p>\n<p>本包选择当前构型零应力沉积作为 Z11 的默认合成材料机制，并保留旧参考态增量为对照；这属于执行细化，不是生物事实。已有批准机制不同时必须按变更合同处理，不能在程序里静默替换。<\/p>\n<h2>5. 内部资料<\/h2>\n<p>用户原文的 M1 路径、Hong/肝脏 PDF 路径和 Casebook 摘要均为待本地核验线索。本包未重新判 PASS/FAIL，也未处理用户本地 PDF 字节。复制公共论文、数据或第三方代码须保留许可，不把它们改名为项目原创。<\/p>\n"}, "05_REPORT_AND_CHANGE_TEMPLATES.md": {"title": "报告与变更模板", "id": "公共说明", "kind": "common", "html": "<h1>Codex 报告、预登记和变更模板<\/h1>\n<p>模板没有实测数值。字段待实际运行填入；null、空表或 NOT_RUN 不能转成 PASS。真实 CLI/路径只有在实际存在并执行过后才能填写。<\/p>\n<h2>1. 阶段报告 report.md<\/h2>\n<pre><code class=\"language-markdown\"># &lt;阶段 ID&gt; 执行报告\n\n## 状态和范围\n- overall_status:\n- physics_status:\n- visualization_status:\n- claims_status:\n- 已完成子项:\n- 未完成/阻断子项:\n- 可以支持的结论:\n- 明确不能支持的结论:\n\n## 环境与输入\nPRL/内核位置、提交/dirty 状态、硬件、单位、参数来源、随机种子、前置证据、预登记哈希。\n\n## 实际执行\n列真实命令、开始/结束、运行 ID、每次修复/重跑版本。区分 PILOT 与正式运行。\n\n## 最重要结果\n给原始数值、单位、参考值、误差、阈值和来源文件定位；不只说“趋势正确”。\n\n## 可视化入口\n离线 HTML、静态图、动画/视频或交互播放、原始数据、检查点、查看器测试截图。\n\n## 独立验收\n验证器实际命令和输出；空间/时间/迭代误差、守恒、对照及未解析项。\n\n## 失败与限制\n最后有效时刻、首次异常对象、失败包、原因证据、尚不能确认的内容。\n\n## 代码修改和资源\n修改文件清单、共享内核回归、CPU/内存/存储/总运行量与预算；保留用户修改的说明。\n\n## 下一阶段合同\n是否就绪、需要什么证据；未执行下一阶段。\n<\/code><\/pre>\n<h2>2. 预登记最小字段<\/h2>\n<p>模板见 <code>templates/preregistration.template.json<\/code>。内容必须包含真实：方程/参数/关闭项、几何/单位、载荷、实验矩阵、网格/时间序列、观测区域、误差范数/非零参考尺度、阈值、求解策略、预算、输出频率、数据来源和版本。<\/p>\n<p>流程为 <code>DRAFT → FROZEN → RUNNING → ACCEPTED/FAILED/STOPPED<\/code>，与运行状态分开。冻结哈希在正式结果前保存；修订创建新版本，不覆盖。若阈值靠预检选定，说明预检只用于尺度/预算/正确性摸底，不能用于事后调低正式标准。<\/p>\n<h2>3. 机器可读摘要<\/h2>\n<p>建议采用如下语义，不强制覆盖项目已有 schema：<\/p>\n<pre><code class=\"language-json\">{\n  &quot;stage_id&quot;: &quot;REPLACE_WITH_STAGE&quot;,\n  &quot;run_id&quot;: null,\n  &quot;overall_status&quot;: &quot;NOT_RUN&quot;,\n  &quot;physics_status&quot;: &quot;NOT_RUN&quot;,\n  &quot;visualization_status&quot;: &quot;NOT_RUN&quot;,\n  &quot;claims_status&quot;: &quot;NOT_RUN&quot;,\n  &quot;scope_passed&quot;: [],\n  &quot;excluded_claims&quot;: [],\n  &quot;completed_subchecks&quot;: [],\n  &quot;blocked_subchecks&quot;: [],\n  &quot;last_valid_time&quot;: null,\n  &quot;metrics_file&quot;: null,\n  &quot;viewer_path&quot;: null,\n  &quot;verification_log&quot;: null,\n  &quot;next_stage_executed&quot;: false\n}\n<\/code><\/pre>\n<p>指标长表至少有 case_id、metric_id、value、unit、reference_scale、threshold、comparison、status、source_file、source_locator。记录“未计算”不是 value=0。一个主指标通过不自动覆盖所有必需子项。<\/p>\n<h2>4. 失败包模板<\/h2>\n<pre><code class=\"language-text\">failure_reason.md\nminimal_config.json\nlast_valid_checkpoint/\nfirst_invalid_snapshot/\nresiduals_before_failure.csv\ngeometry_or_contact_ids.csv\nstdout_stderr.log\nreproduce_commands.md\nversions_and_environment.json\n<\/code><\/pre>\n<p>可视化同时标最后有效和首异常状态，首异常的数据类型/数值失效可见；不能只给一张漂亮最后帧。超预算也保存正常中止包，不当 crash 隐藏。<\/p>\n<h2>5. 模型/阈值变更请求 change_request.md<\/h2>\n<pre><code class=\"language-markdown\"># 变更请求 &lt;ID&gt;\n当前阶段与原合同版本：\n原定义/公式/阈值：\n发现的问题与证据：\n建议的新定义/公式：\n为何不只是代码修复：\n对能量、质量、参考态、对照和生物主张的影响：\n受影响的历史结果/测试：\n必要回归/重跑：\n新增预算/依赖：\n在获准前可继续的无关工作：\n状态：等待用户决定；未执行语义变更。\n<\/code><\/pre>\n<p>只修复索引/符号等实现错误而不改变合同方程时，使用 bugfix 记录：旧最小失败、代码 diff、回归与新结果。不得把 bugfix 隐藏成原来就 PASS。<\/p>\n<h2>6. 最终回复合同<\/h2>\n<p>Codex 对用户的阶段结束回复必须给：精确状态/范围、真实离线结果入口、3 个最重要定量结果及单位、未完成/失败项、实际修改、下一阶段合同。不要只有“已完成”或十个文件名；也不要提交一篇新计划却不做授权工作。<\/p>\n<p>没有开始计算时，定量结果只报告真实几何/资料审计指标；不得生成虚构模拟数值凑满三项。下一阶段是否可执行不等于已经执行。<\/p>\n"}, "stages/Z0_ENTRY_DATA_AND_KERNEL_AUDIT.md": {"title": "资料、内核审计与可旋转模型入口", "id": "Z0", "kind": "execution", "html": "<h1>Z0｜资料、内核审计与可旋转模型入口<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：用户授权 Z0；可访问实际 PRL 工作区；历史记录仅作待核验输入\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z1 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 问题与允许范围<\/h2>\n<p>从一个入口看清：模型对象代表什么、代码从哪里来、哪些资料实际可读、哪些能力有运行证据。Z0 只做资料/源码审计、静态几何和 Z1 合同；不做主动收缩、动态组织、CFD 或泵血，不申请受限数据、不发送邮件、不下载巨大原始包。<\/p>\n<p>完成不只意味着“有一个网页”，还意味着模型、资料、依赖路径和缺项表相互对应。<code>synthetic_entry_status<\/code> 与 <code>experimental_data_status<\/code> 分开；数据缺失不自动阻断合成入口。<\/p>\n<h2>2. Z0.1 定位项目、保留现场<\/h2>\n<p>记录实际路径、操作系统/CPU/内存、实际存在的编译环境、git 分支/提交和未提交修改，列出准备新增/修改的路径。历史 E 盘路径只是线索。定位唯一 <code>muse_dcm<\/code>，核验真实 import/构建路径，发现重复副本先说明，不删除、不复制。<\/p>\n<p>读取现有 M1 记录和当前实际依赖测试；只有实际读过才能写“已核查”。每条能力列为 <code>available_and_tested / available_unverified / missing / failed / not_used<\/code>。对 FAIL 追到具体函数与本阶段依赖；门户上的 PASS/FAIL 数量不替代证据。<\/p>\n<h2>3. Z0.2 小文件与数据结构核查<\/h2>\n<p>按 [R1] Glasgow、[R2] 作者仓库、[R8] Zenodo 备用顺序检查，保存来源、许可、版本、文件大小和限制。官方影像与仓库速度是两个来源，不能默认已经配准。<\/p>\n<p>在累计 256 MiB 下载上限内优先取两个相位小影像和一个速度快照；先看清单，禁止整包克隆大数据。实际文件记录 SHA-256、获取时间、格式与解析日志。不要直接运行下载代码；风险反序列化格式须先审计，优先安全读取或隔离转换。<\/p>\n<p>检查鱼 ID、年龄 hpf、条件/温度、荧光标记、体素尺寸、轴顺序/左右手性、相位/时间定义、速度单位、不确定度和有效掩码。缺项即 UNKNOWN，文件名的 phase 数字不是自动确认的物理时间。<\/p>\n<p>速度快照输出各数组 shape/dtype/数值范围/缺失比例，检查位置、速度与不确定度长度匹配。配准变换保存 R、t、尺度与轴置换；速度向量不能加空间平移。单位/配准未确认时仅并排展示，不能强行叠加或标为真实细胞尺度速度。<\/p>\n<h2>4. Z0.3 静态合成模型<\/h2>\n<p>使用已有几何生成器或独立前处理，不新建力学引擎。至少构建单闭合细胞、双闭合细胞、每层 4×4 个细胞的双层片。入口每细胞可选约 80–320 个面，但记录实际值；这不是正式收敛档位。<\/p>\n<p>几何尺度可无量纲 L0，不冒充实验尺寸。可铺砌闭合多面体或已有适用几何均可，但相互穿透的球壳不是完整液密组织。每个细胞有腔面/基底面/侧面和层身份；双层标“心肌候选层/心内膜候选层，尚无动力学”。ECM 只显示候选连接/锚点，<code>geometry_only<\/code>，不输出假反力。<\/p>\n<p>区分细胞闭合面、组织连接与未来共同腔面。组织片有真实边缘，不标完整心室。重复的两细胞皮质是否有不同物理归属说明清楚；不得在显示中填缝后声称已液密。<\/p>\n<h2>5. Z0.4 几何检查与语义表<\/h2>\n<p>检查索引有效、每个闭合细胞边的相邻面数、法向一致、正体积、自交、退化面、重复面、ID 与面归属。输出面积/体积/网格质量分布及错误位置。用一个可计算几何与独立体积公式交叉检查。<\/p>\n<p>建立力学项表：每项的公式/源码位置、参考构型、单位、参数来源、材料方向、目标体积和阻尼物理对象。尚未实现的主动/ECM/CFD 路径标 planned，不能写“有 DCM 所以心肌可用”。<\/p>\n<p>为 Z1 明确三档网格、时间步、加载路径、参考尺度、独立验证器、预算和失败条件；缺必要能力给最小修复任务与回归范围，不启动 Z1 正式计算。<\/p>\n<h2>6. 必需数据表<\/h2>\n<p><code>dependency_matrix.csv<\/code>：capability、source_path、kernel_revision、test_id、evidence_path、observed_status、required_by、blocking_reason。<\/p>\n<p><code>data_inventory.csv<\/code>：source/version/license/hash/size、fish_id/age/marker、voxel_spacing/axes/time_or_phase、velocity_unit/uncertainty/registration、missing_fields/validation_level。<\/p>\n<p><code>object_registry.csv<\/code>：object_id、kind、cell_id、layer、boundary_role、geometry_origin、unit、mesh_version、geometry_status。<\/p>\n<p>字段字典中主动功、压力、流量和 WSS 均为 <code>not_computed<\/code>，不填 0。<\/p>\n<h2>7. 本阶段必须可看的结果<\/h2>\n<table>\n<thead>\n<tr>\n<th>视图/图<\/th>\n<th>内容与证据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>可旋转静态入口<\/td>\n<td>单/双细胞、双层；原三角边、透明、剖切、选 ID；与原始坐标一致<\/td>\n<\/tr>\n<tr>\n<td>分层剖面<\/td>\n<td>心肌—ECM 候选连接—心内膜；无动力学、无血液标签<\/td>\n<\/tr>\n<tr>\n<td>几何检查图<\/td>\n<td>开边/自交/不良面定位，体积和质量分布，不隐藏失败<\/td>\n<\/tr>\n<tr>\n<td>实验正交切片<\/td>\n<td>实际下载影像、相位和尺度；缺数据不用假影像补齐<\/td>\n<\/tr>\n<tr>\n<td>实验速度入口<\/td>\n<td>实际数组及不确定度/有效域；未知单位醒目标记<\/td>\n<\/tr>\n<tr>\n<td>能力/缺项矩阵<\/td>\n<td>有证据、未知、失败及其后续影响<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>静态 Z0 不生成压力、V(t)、PV 或泵功曲线。资料缺失以实际访问限制/缺项卡片说明。离线入口需真实测试并保存截图。<\/p>\n<h2>8. 验收与交接<\/h2>\n<p>合成对象在声称范围内通过几何检查；对象/字段定义齐备；关键依赖明确；真实资料缺项暴露；离线查看器可用；Z1 合同可执行。满足这些只给资料/几何范围 PASS，不给力学/CFD PASS。<\/p>\n<p>PRL/内核无法访问或必要几何失败：<code>BLOCKED_DEPENDENCY<\/code>。外部数据不可读：数据子项 <code>BLOCKED_DATA<\/code>，合成入口可以独立成立。预算耗尽不自动续下大包。<\/p>\n<p>专属输出：三张表、内核审计、静态模型、<code>model_semantics.md<\/code>、<code>data_gaps.md<\/code>、<code>Z1_frozen_contract.md<\/code> 和浏览器测试证据。参考 [R1–R4] 见共享来源文件；公开资料不是本路线的运行证据。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z1。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z1_PASSIVE_SINGLE_AND_DOUBLE_CELL.md": {"title": "被动单细胞与双细胞力学", "id": "Z1", "kind": "execution", "html": "<h1>Z1｜被动单细胞与双细胞力学<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z0 合成入口/内核路径可用；被动物理项和尺度已冻结\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z2 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 核心问题与边界<\/h2>\n<p>实际复用的 DCM 能否产生正确的被动力、平衡、接触与耗散，并在细化后稳定？无主动、无 ECM 网络、无 CFD、无分裂。通过只覆盖本次材料/接触/积分路径，不等于真实心肌已标定，更不等于组织层已液密。<\/p>\n<h2>2. 实际方程必须可查<\/h2>\n<p>写清 E_pass(q) 的面积/面内弹性/弯曲/体积/黏附分解与 F=-∂E/∂q。过阻尼 C(q)v=F 时，每个阻力矩阵对应什么物理对象、是否有刚体零模均登记；不能为可逆而偷偷加背景阻力。刚体规范只去除整体平移/旋转自由度，不抵抗真实形变，反力仍保存。<\/p>\n<p>若体积罚为 <code>E_V=K_V(V-V0)^2/(2V0)<\/code>，其等效压力 <code>p_V=-K_V(V-V0)/V0<\/code>；内核形式不同则推导相应式。目标与实际体积不同。每档网格按同一连续材料意义设置离散刚度/阻尼/接触权重，不能增加边数同时增加材料。<\/p>\n<h2>3. 必需实验矩阵<\/h2>\n<table>\n<thead>\n<tr>\n<th>ID<\/th>\n<th>实验<\/th>\n<th>验证<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>GRAD<\/td>\n<td>非退化姿态、随机方向能量差分<\/td>\n<td>光滑项 F=-∂E/∂q<\/td>\n<\/tr>\n<tr>\n<td>RIGID<\/td>\n<td>整体平移及非坐标轴旋转<\/td>\n<td>能量客观性、力随动、内力合矩<\/td>\n<\/tr>\n<tr>\n<td>LAPLACE<\/td>\n<td>恒张力近球细胞<\/td>\n<td>压差—张力—实际曲率关系<\/td>\n<\/tr>\n<tr>\n<td>AXIAL<\/td>\n<td>有限端区小幅轴向加载/持载/卸载<\/td>\n<td>反力、形变、功、体积<\/td>\n<\/tr>\n<tr>\n<td>TRANSVERSE<\/td>\n<td>横向与剪切探针<\/td>\n<td>所声明方向响应<\/td>\n<\/tr>\n<tr>\n<td>RELAX<\/td>\n<td>卸载恢复或小幅线性模态<\/td>\n<td>松弛机制及非负耗散<\/td>\n<\/tr>\n<tr>\n<td>CONTACT<\/td>\n<td>双细胞接近—受压—分离<\/td>\n<td>排斥/黏附、穿透、反作用<\/td>\n<\/tr>\n<tr>\n<td>REFINE<\/td>\n<td>网格、时间、体积罚分别变化<\/td>\n<td>误差来源分离<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>球基准只保留与 <code>Δp=2γ/R<\/code> 相容的恒表面张力和体积约束/压力项；额外弹性或弯曲关闭或明确计入。约束体积时压差由乘子给出，体积罚时检查外施压差与 p_V 合计。不能在额外应力存在时硬要求 p_ext=2γ/R。<\/p>\n<p>恒压自由球可能存在径向稳定性问题，首选固定体积/求压反力的测试，不将不稳定平衡当作应恢复的动态算例。<\/p>\n<h2>4. 加载和细化默认值<\/h2>\n<p>使用合成 L0（初始等体积半径）、F0（冻结被动弹性力尺度）、T0（已定义黏性/弹性时间）。先 1% 形变，后 5%，不追求大变形。有限材料端区加载，不钉单点制造应力奇点。黏附开/关采用相同几何与路径。<\/p>\n<p>建议约 80/320/1280 面三档相似网格或已有三档有效离散，记录 h 和接触解析度。时间可从 T0/50、/100、/200 三档开始，未解析则在预算内加严但不伪装 PASS。空间和时间独立变化；体积罚基准的 0.5/1/2 倍另列，不能混进网格序列。<\/p>\n<p>实际体积容忍度在预登记中单列，例如首轮近不可压缩合成目标 10^-3；若既有物理模型允许更多可压缩性，按批准语义报告，不将可压缩细胞硬叫不可压缩。<\/p>\n<h2>5. 执行与独立验收<\/h2>\n<p>先 GRAD/RIGID，再球与受载平衡，再恢复，最后双细胞。方向差分 ε/L0 从 10^-2 到 10^-7，期待先下降后舍入地板；接触切换点不适用光滑差分。<\/p>\n<p>松弛不得预设全部 DCM 单指数。若线性化可得 <code>C δqdot=-H δq<\/code>，用非刚体广义模态衰减作参考；否则用独立高精度积分/更细参考并标数值参考。没有黏性不能期待松弛。<\/p>\n<p>每步记录各能量、外载功、物理耗散、约束反力、实际体积/面积、接触间隙/状态。独立重算体积和作用反作用合力合矩。双细胞交换 ID 后只重排，不改变物理结果；切向接触如含力偶应明确计入，不能只看净力为零。<\/p>\n<p>穿透容忍度按冻结物理接触尺度和离散误差解释，必须给出具体数值；不能随 h 增大分母来隐藏未解析接触。<\/p>\n<h2>6. 可视化结果合同<\/h2>\n<table>\n<thead>\n<tr>\n<th>图/视图<\/th>\n<th>要看见<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>单细胞网格动画<\/td>\n<td>原形叠加、端区、实际位移、加载力与体积<\/td>\n<\/tr>\n<tr>\n<td>双细胞接触特写<\/td>\n<td>排斥/黏附、接触区、间隙/穿透位置及两端反力<\/td>\n<\/tr>\n<tr>\n<td>网格质量地图<\/td>\n<td>最差单元与对应时刻，不能只显示最终漂亮状态<\/td>\n<\/tr>\n<tr>\n<td>Laplace 对照图<\/td>\n<td>真实 Δp 与 2γ/R、误差、不同网格<\/td>\n<\/tr>\n<tr>\n<td>反力—位移/恢复<\/td>\n<td>加载卸载、解析或数值参考、方向/单位<\/td>\n<\/tr>\n<tr>\n<td>能量账本图<\/td>\n<td>外功、储能、耗散与残差<\/td>\n<\/tr>\n<tr>\n<td>梯度/收敛图<\/td>\n<td>ε、h、Δt、罚参数分开<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>不输出未定义体内应力，节点力不叫 Pa。点击接触对要能查看原始间隙与两端施力位置。<\/p>\n<h2>7. 验收、故障与输出<\/h2>\n<p>方向导数≤10^-6，刚体/内力合力合矩代数≤10^-10；整体/局部 2%/5% 并有趋势；能量≤1%；实际体积单独达冻结阈值。动态平衡检验 C v-F 或惯性方程残差，不把动态内力非零当错误。<\/p>\n<p>能量上升先查外功/初始储能；无外功且无主动才要求按模型耗散。接触跳变先查几何和解析度，不先加阻尼。某接触路径不通过会阻断依赖它的组织，不允许换引擎绕开。<\/p>\n<p>专属输出：<code>constitutive_audit.md<\/code>、<code>passive_parameters.json<\/code>、<code>contact_pair_ledger.csv<\/code>、<code>gradient_check.csv<\/code>、<code>mesh_time_penalty_study.csv<\/code>、各实验快照。Z2 接收通过被动参考态、允许主动扩展接口和体积误差。理论线索 [R4] 不提供可直接移植的心肌生理参数。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z2。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z2_ACTIVE_SINGLE_CELL.md": {"title": "主动单细胞：自由缩短、固定端与有限负载", "id": "Z2", "kind": "execution", "html": "<h1>Z2｜主动单细胞：自由缩短、固定端与有限负载<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z1 被动力学、夹持/接触、积分和体积检查 PASS\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z3 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 核心问题与范围<\/h2>\n<p>改变材料方向上主动参考长度，能否产生方向正确、体积受控、能量来源清楚的收缩？只有单细胞和外部测试负载，无 CFD、ECM 周转或电生理。这里是规定激活的机械模型，不是完整肌丝/ATP 模型。<\/p>\n<h2>2. 主动定义<\/h2>\n<p>采用长轴比约 2:1 的合成细胞或已验证兼容构型，主方向来自材料参考态，锚点/材料坐标不依赖任意三角边。主动连接总权重随网格保持，不在各网格“挑几根顺向边”随意加弹簧。<\/p>\n<p>默认 <code>a(t)=[1-cos(2πt/T)]/2<\/code>，<code>ell0(a)=ell_ref(1-epsilon_a a)<\/code>，k 固定：<\/p>\n<pre><code class=\"language-latex\">E_{fib}=\\tfrac12 k(\\ell-\\ell_0)^2,\\qquad P_{act}=-k(\\ell-\\ell_0)\\dot\\ell_0.\n<\/code><\/pre>\n<p>ε_a 依次 0.02、0.05、0.10，是合成探针。V0、被动参考构型和材料定义不随激活变化。已有批准公式优先，但必须推导相同严格的功率分解。<\/p>\n<p>激活能量导数、节点力和功来自同一能量；不能同时再把同一纤维节点力做功计成第二份主动输入。保留正/负主动功，去激活释放/回收储能不能裁成零。<\/p>\n<h2>3. 必需实验矩阵<\/h2>\n<table>\n<thead>\n<tr>\n<th>ID<\/th>\n<th>条件<\/th>\n<th>主要证据<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>OFF<\/td>\n<td>a=0，与被动同初始和负载<\/td>\n<td>新模块不改变 Z1<\/td>\n<\/tr>\n<tr>\n<td>FREE<\/td>\n<td>除刚体规范外自由<\/td>\n<td>材料长轴缩短、横向补偿、实际体积<\/td>\n<\/tr>\n<tr>\n<td>ISO<\/td>\n<td>有限端区间距固定<\/td>\n<td>端反力、外位移功近零、储能变化<\/td>\n<\/tr>\n<tr>\n<td>LOAD<\/td>\n<td>冻结外弹簧或恒力负载<\/td>\n<td>对外功与循环账本<\/td>\n<\/tr>\n<tr>\n<td>ROTATE<\/td>\n<td>细胞和材料方向整体旋转<\/td>\n<td>物理响应客观性<\/td>\n<\/tr>\n<tr>\n<td>REFINE<\/td>\n<td>网格/时间分别三档<\/td>\n<td>长度、反力、主动功均收敛<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>外弹簧推荐 <code>E_load=k_load(d-d_ref)^2/2<\/code>，其刚度按 Z1 被动轴向刚度的冻结比例选定；弹簧储能属于系统内部还是外功二选一，不能双计。恒力负载必须明示施加位置、方向和功。固定端不等于给整个细胞表面规定运动。<\/p>\n<h2>4. 单元验证后再动态<\/h2>\n<p>先固定 q 只改变 a，验证能量差和主动功积分；再固定 a 改 q，验证能量梯度。再组合 FREE 的小幅单周期，之后 ISO/LOAD。幅度逐级通过，不在小幅能量未闭合时增加幅度。<\/p>\n<p>保存每根代表纤维 ell、ell0、激活、反力、P_act、材料权重；总量由权重一致求和。三档网格沿用 Z1；独立 Δt 序列兼顾主动周期和被动松弛时间，不以心跳周期代替所有材料时间尺度。<\/p>\n<p>记录实际 <code>|V-V0|/V0<\/code> 及相对被动起始体积变化。面积与体积约束不相容时写模型问题，不能靠自交或改变 V0 达到自由缩短。<\/p>\n<h2>5. 观测与能量<\/h2>\n<p>长度采用两个材料端区中心距离或冻结材料点距离，不用每帧包围盒。轴向应变相对固定 L_ref，横向两个材料方向分别读出。ISO 测总端反力，LOAD 测端外功。<\/p>\n<p>每周期记录 ΔE_pass、ΔE_fib、主动功、外功、耗散、残差；有结构惯性计 K_s，过阻尼不捏造动能。不同幅度不得重新拟合主动刚度。反力/长度相位只在非零可解析信号下报告。<\/p>\n<h2>6. 可视化交付<\/h2>\n<table>\n<thead>\n<tr>\n<th>图/视图<\/th>\n<th>必需内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>三条件同步动画<\/td>\n<td>FREE/ISO/LOAD 同一激活时刻、真实网格、材料方向、夹持端区<\/td>\n<\/tr>\n<tr>\n<td>主动连接机制<\/td>\n<td>选中连接的实际长度/参考长度/激活/力，含义不能混淆<\/td>\n<\/tr>\n<tr>\n<td>长度—时间图<\/td>\n<td>激活、长轴、横向变化和实际体积<\/td>\n<\/tr>\n<tr>\n<td>固定端反力图<\/td>\n<td>端距不变但反力/储能可变化<\/td>\n<\/tr>\n<tr>\n<td>负载回线<\/td>\n<td>端力—位移、循环方向与输出功<\/td>\n<\/tr>\n<tr>\n<td>能量分账<\/td>\n<td>主动功正负、储能、耗散、外功、残差<\/td>\n<\/tr>\n<tr>\n<td>收敛图<\/td>\n<td>长度、反力和主动功的 h/Δt 独立误差<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>默认显示真实变形；放大可选并标倍数。动画帧与曲线游标同一时间版本。<\/p>\n<h2>7. 验收、诊断与交接<\/h2>\n<p>OFF 复现被动；FREE 缩短方向正确但幅度由方程决定，不强迫等于参考长度幅度；ISO 储能和反力有来源；LOAD 输出由主动/初始/外部能量解释。继承 2%/5%、能量1% 和独立体积阈值。<\/p>\n<p>ISO 能量不闭合先查双计主动功；网格变细反力增大先查纤维材料量；旋转改变响应先查材料方向绑定。禁止速度截断、隐含阻尼或体积驱动修补。<\/p>\n<p>专属输出：<code>activation_definition.md<\/code>、<code>material_fiber_map<\/code>、<code>active_energy_unit_test.csv<\/code>、三负载快照/账本、幅度与收敛表。后续使用同一材料主动定义，不把本阶段参数叫作斑马鱼生理标定。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z3。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z3_ECM_VISCOELASTIC_NETWORK.md": {"title": "ECM 黏弹网络：内变量、剪切与离散标定", "id": "Z3", "kind": "execution", "html": "<h1>Z3｜ECM 黏弹网络：内变量、剪切与离散标定<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z0 几何/单位入口；Z1 的连接力、几何与积分基础通过；Z2 无需参与独立网络计算但默认已完成\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z4 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 要回答的问题<\/h2>\n<p>薄层连接网络能否传递法向与切向作用，恢复指定松弛时间，并在连接数量变化时保持同一等效材料？本阶段使用两块刚性测试面/材料锚点，不驱动完整 DCM 组织，不加入 CFD、分裂或材料周转。<\/p>\n<p>网络代表层间力学等效耦合，不代表所有心肌间质、不含三维体积占据、孔隙流或 ECM 细胞身份。连接可承压的线性模型与仅承拉的纤维模型不是同一模型；首版使用已批准的双向 SLS 等效连接，不临时加入松弛/屈曲开关。<\/p>\n<h2>2. 单连接定义与解析检查<\/h2>\n<pre><code class=\"language-latex\">E=\\frac12 k_\\infty x^2+\\frac12k_1(x-z)^2,\\quad\nf=k_\\infty x+k_1(x-z),\\quad\n\\dot z=\\frac{x-z}{\\tau},\\quad \\eta=k_1\\tau.\n<\/code><\/pre>\n<p>独立合成例设 k∞=1、k1=2、τ=1，采用自洽无量纲尺度；x0=0.01。正伸长的反力 f 是维持该伸长所需外力；两端网络内力的方向与之相反，求和时保持作用反作用。<\/p>\n<p>固定 x0、z(0)=0 时：<\/p>\n<pre><code class=\"language-latex\">z(t)=x_0(1-e^{-t/\\tau}),\\quad f(t)=x_0[k_\\infty+k_1e^{-t/\\tau}],\\quad D=\\int\\eta\\dot z^2dt\\ge0.\n<\/code><\/pre>\n<p>阶跃 t=0 的瞬间外功要明确计入；数值使用平滑斜坡时，不能再将上述理想阶跃全程视作精确解。可将阶跃后的已知状态作为初值，从 t=0+ 比较松弛。另做平滑加载用于全程能量账本。<\/p>\n<p>正弦伸长的稳态复刚度为 <code>K*(ω)=k∞+k1 iωτ/(1+iωτ)<\/code>；实部 <code>k∞+k1(ωτ)^2/[1+(ωτ)^2]<\/code>，虚部 <code>k1ωτ/[1+(ωτ)^2]<\/code>。采用一致的 exp(iωt) 约定，比较幅值和相位。循环耗散按力—位移积分独立检查。<\/p>\n<h2>3. 法向/剪切网络的代表面积<\/h2>\n<p>取参考薄层厚度 t0 和面积 A_total。每条连接有明确 A_e 或求积权重，覆盖规则使同一材料不重复计数。目标法向与切向响应分别由 E_n、G 和 t0 标定，黏性支路采用同一代表面积/取向缩放。<\/p>\n<p>首选由原有锚点映射建立法向和成对交叉连接。对相同均匀应变 ε，比较网络总能与目标薄层能；法向加载和两个独立方向剪切都需通过。斜连接同时贡献多个方向刚度，不能各自套 <code>E A/t0<\/code> 后宣称标定完成。<\/p>\n<p>标定需要的微观参数可由线性方程/受约束拟合求出，但只用独立网络材料试验，不用后续心室目标流量。要求非负刚度/黏度及已声明材料对称性；无法同时拟合目标张量时说明网络拓扑限制，不用负弹簧掩盖。<\/p>\n<p>锚点基于材料坐标/面内重心权重，不随当前最近节点任意跳动。相邻层刚体运动时连接几何随动；切向分量采用客观材料框架，不能投影到固定世界坐标后误产生恢复力。<\/p>\n<h2>4. 必需实验矩阵<\/h2>\n<table>\n<thead>\n<tr>\n<th>case_id<\/th>\n<th>内容<\/th>\n<th>不可省略的对照<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Z3-ONE<\/td>\n<td>单连接固定伸长松弛与平滑循环<\/td>\n<td>解析解、独立能量积分<\/td>\n<\/tr>\n<tr>\n<td>Z3-NORMAL<\/td>\n<td>平行面相对法向位移<\/td>\n<td>固定材料参数、不同连接密度<\/td>\n<\/tr>\n<tr>\n<td>Z3-SHEAR-X/Y<\/td>\n<td>两个切向方向均匀剪切<\/td>\n<td>法向间距固定，排除斜连接误标定<\/td>\n<\/tr>\n<tr>\n<td>Z3-ROTATE<\/td>\n<td>整体平移/大角度旋转<\/td>\n<td>无应变零力；预应力正确转动<\/td>\n<\/tr>\n<tr>\n<td>Z3-DENSITY<\/td>\n<td>同一物理面积三档连接数量<\/td>\n<td>面积权重和材料总量不变<\/td>\n<\/tr>\n<tr>\n<td>Z3-TIME<\/td>\n<td>独立三档 Δt/τ<\/td>\n<td>内变量积分、回线耗散和相位<\/td>\n<\/tr>\n<tr>\n<td>Z3-RESTART<\/td>\n<td>中途保存/重启单连接或小网络<\/td>\n<td>与连续运行的 z、力、能量一致<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>建议连接密度按每面 4×4、8×8、16×16 锚点组织，但须与实际拓扑和双向/交叉计数吻合。它不是扩大物理组织片。τ 不随连接数量变化；每档记录 ΣA_e、材料总量和有效刚度。<\/p>\n<h2>5. 时间推进与历史保护<\/h2>\n<p>采用内核已有的经过检查的隐式/解析内变量推进；若 x 在一步内采用分段线性假设，可推导精确更新用于独立参考，不能把固定 x 的指数式直接应用于任意变化 x。时间形式阶次先登记。<\/p>\n<p>任何候选迭代都从 z_n 推进到候选 z_(n+1)，只在接受后提交。网络内变量必须可被序列化，Z7 将依赖它。把 z 重置为 0 或 x 不是“重启”，会改变材料记忆。<\/p>\n<h2>6. 可视化必须展示<\/h2>\n<table>\n<thead>\n<tr>\n<th>视图/图<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>网络三维入口<\/td>\n<td>两刚性面、法向/交叉连接、锚点、选中连接的 A_e/x/z/f<\/td>\n<\/tr>\n<tr>\n<td>加载动画<\/td>\n<td>法向与剪切两个方向的实际位移；主动/流体字段不适用<\/td>\n<\/tr>\n<tr>\n<td>反力—时间<\/td>\n<td>初始和长期刚度、解析松弛曲线、拟合 τ 与真实输入 τ<\/td>\n<\/tr>\n<tr>\n<td>力—位移回线<\/td>\n<td>周期方向、面积代表的耗散；不同 ωτ 并列<\/td>\n<\/tr>\n<tr>\n<td>模量/相位图<\/td>\n<td>K′、K″或幅相随 ωτ 变化，标明是否达到周期态<\/td>\n<\/tr>\n<tr>\n<td>密度比较图<\/td>\n<td>三档反力/总能，ΣA_e 与单连接刚度，说明不是材料变多<\/td>\n<\/tr>\n<tr>\n<td>能量与客观性<\/td>\n<td>形变功、储能、耗散、残差；刚体旋转前后误差<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>不得用连接反力色标命名为完整 ECM 三维应力；可额外计算经定义的单位界面面积牵引。<\/p>\n<h2>7. 验收、故障定位与交接<\/h2>\n<p>单连接解析误差目标≤1% 且显示时间收敛；恢复 τ 的相对误差≤2%；整体/局部遵守 2%/5%；耗散非负、能量残差≤1%；客观性/反作用代数目标≤10^-10。密度细化后有效材料不随数量系统性增长。<\/p>\n<p>剪切过硬先查交叉连接重复计数；整体旋转后有力先查局部框架和参考向量；τ 随密度变化先查 k1 与 η 的缩放；重启后突变先查 z/参考态未保存。没有三项法向/两剪切标定，不进入组织实验。<\/p>\n<p>专属交付：<code>ecm_constitutive.md<\/code>、<code>anchor_and_area_weights<\/code>、<code>effective_modulus_calibration.csv<\/code>、单连接解析验证、网络参数与重启包。Z4 接收冻结的 E_n/G/τ 及从材料到离散连接的转换，不接收特定网格的任意弹簧列表作为材料定义。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z4。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z4_FINITE_BILAYER_TISSUE.md": {"title": "有限双层组织：层间传递、局部扰动与边缘效应", "id": "Z4", "kind": "execution", "html": "<h1>Z4｜有限双层组织：层间传递、局部扰动与边缘效应<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z1 被动力学、Z2 主动机制、Z3 ECM 网络均在使用路径上 PASS\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z4b 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 科学与工程问题<\/h2>\n<p>一层主动心肌 DCM 能否通过已标定 ECM 带动被动心内膜 DCM，并产生可重复的局部幅值/相位响应？在整体被动响应和平均激活匹配后，局部 ECM 改变是否产生低分辨率模型不能同样预测的信号？本阶段是有限组织片，无 CFD，不是闭合心室。<\/p>\n<p>不以“看到第二层动了”作为通过。必须分清刚体漂移、端部夹持、边缘效应、局部应变和真实层间相对运动。<\/p>\n<h2>2. 模型与固定边界<\/h2>\n<p>先每层 4×4 个细胞，固定细胞邻接/连接，沿冻结材料方向统一激活。Z0 组织几何可作为入口，但必须使用 Z1–Z3 已验证材料。ECM 位于两层之间，材料量和厚度定义沿用 Z3。<\/p>\n<p>规定一种有限面积端部支撑/小幅夹持，或仅消除刚体零模并由完整方程决定其余自由度；选择需在预登记中明确。自由边缘不偷偷加弹簧，使中央区看起来平稳。测量轴和感兴趣区域在材料参考态冻结。<\/p>\n<p>心内膜侧面连接有明确力学和连续性含义；片外边缘是开放边界，不能声称片已封闭流体腔。默认无 ECM 滑动重挂、细胞重排或拓扑变化。<\/p>\n<h2>3. 最小实验矩阵及顺序<\/h2>\n<table>\n<thead>\n<tr>\n<th>case_id<\/th>\n<th>条件<\/th>\n<th>目的<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Z4-PASSIVE<\/td>\n<td>无激活的小幅整体拉伸/剪切/松弛<\/td>\n<td>核对组合后有效材料与简化对照标定<\/td>\n<\/tr>\n<tr>\n<td>Z4-UNIFORM<\/td>\n<td>全部心肌相同小幅激活<\/td>\n<td>期望对称性、层间传递和基线<\/td>\n<\/tr>\n<tr>\n<td>Z4-LOCAL<\/td>\n<td>中央预定 2×2 物理区域 ECM 松弛时间 ×2<\/td>\n<td>单变量局部扰动；瞬时/长期刚度保持<\/td>\n<\/tr>\n<tr>\n<td>Z4-SHUFFLE<\/td>\n<td>相同 τ 直方图和材料量，改变空间位置<\/td>\n<td>区分总量效应与空间结构效应<\/td>\n<\/tr>\n<tr>\n<td>Z4-SIZE<\/td>\n<td>4×4 与 8×8 片，细胞尺寸相同<\/td>\n<td>边缘到内部的影响，不是网格收敛<\/td>\n<\/tr>\n<tr>\n<td>Z4-REFINE<\/td>\n<td>固定细胞数/片尺寸，细胞面与 ECM 密度分别细化<\/td>\n<td>排除离散效应<\/td>\n<\/tr>\n<tr>\n<td>Z4-SIMPLE<\/td>\n<td>标定后的简单双层组织表示<\/td>\n<td>公平预测对照<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>局部第一扰动只改变 τ：同时调整 η、保持 k∞ 与 k1 不变，避免把松弛时间效应混成刚度效应。幅度 ×2 是合成探针；若已有批准扰动则沿用，不新增局部激活延迟或减弱作为同一实验。<\/p>\n<p>4×4 偶数网格没有唯一中心单细胞，默认用中央 2×2 区域保持对称；若要单细胞扰动，另写具体 ID 并解释其非中心位置。8×8 中保持同样物理大小的中央 2×2 扰动和观测区，不扩大病变面积。<\/p>\n<p>先完成均匀与一个局部扰动；预算允许且基本门通过再完成必需的空间重排、尺寸和对照，不做多参数联合扫描。必需项没做完全阶段不 PASS，但保留已完成子项。<\/p>\n<h2>4. 层间观测量的精确定义<\/h2>\n<p>用成对材料锚点构造两层位移 <code>u_m(X,t)<\/code>、<code>u_e(X,t)<\/code>；用冻结材料法/切方向测相对位移，不用节点序号直接相减。刚体运动按预登记方法消除，但保留其原始轨迹供检查。<\/p>\n<p>主读出：中央固定区域平均轴向表面应变、层间切向滑移、法向分离、ECM 牵引积分、细胞面积/体积变化。不要把两个层材料点当前坐标的距离变化直接叫同层应变。<\/p>\n<p>稳态小幅非零响应定义 <code>H(ω)=hat(y_e)/hat(y_m)<\/code>，增益 |H|、相位 arg(H)，De=ωτ。必须使用相同响应量与材料方向。若分母幅度低于冻结阈值，不报相位，标 <code>UNRESOLVED_SIGNAL<\/code> 子项。先检查周期态再拟合一阶谐波；大变形直接比较轨迹，不强套线性响应。<\/p>\n<h2>5. 简单组织对照及公平性<\/h2>\n<p>使用无细胞身份细节的等效双层片/粗粒化组织，仅作为外部对照，不替代 DCM 生产内核。由 Z4-PASSIVE 的独立整体加载/松弛标定被动参数，再固定参数预测激活和局部扰动。材料时间尺度、平均激活、边界、观测平均尺度保持一致。<\/p>\n<p>局部 ECM τ 场的信息也应提供给相应公平对照；不能让 DCM 知道病变位置而对照只能用均匀材料，再声称 DCM 物理独有。可以区分“均匀简化对照”和“携带同样局部参数的对照”，分别解释。<\/p>\n<p>若简化对照同样预测，则结果仍可能是有效组织机制，但停止 DCM 独有优势主张。报告误差—成本而不只同页颜色差异。<\/p>\n<h2>6. 可视化交付<\/h2>\n<table>\n<thead>\n<tr>\n<th>图/视图<\/th>\n<th>具体内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>双层 3D 动画和剖切<\/td>\n<td>真实三角网格、心肌/心内膜身份、ECM 连接，激活/时刻一致<\/td>\n<\/tr>\n<tr>\n<td>选择细胞/锚点联动<\/td>\n<td>本细胞应变、成对层位移、连接牵引和体积曲线<\/td>\n<\/tr>\n<tr>\n<td>局部扰动地图<\/td>\n<td>τ 输入图与实际响应图并列，不能只显示响应猜原因<\/td>\n<\/tr>\n<tr>\n<td>均匀/局部/空间重排对照<\/td>\n<td>同一视角、相位和色标，整体量与局部量同时显示<\/td>\n<\/tr>\n<tr>\n<td>层间增益/相位图<\/td>\n<td>主区域信号及可靠性阈值，De 与单位/约定明确<\/td>\n<\/tr>\n<tr>\n<td>边缘效应图<\/td>\n<td>沿边缘距离的响应、4×4/8×8 中央区比较<\/td>\n<\/tr>\n<tr>\n<td>能量与收敛<\/td>\n<td>三模块分账、内部交换抵消、网格/时间/密度独立图<\/td>\n<\/tr>\n<tr>\n<td>对照误差—成本<\/td>\n<td>同样观测量和精度，记录标定与求解成本<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 验收与停止<\/h2>\n<p>小幅稳定区均匀对照的对称性误差不得超过其数值误差包络；结果随细化稳定，整体≤2%、局部≤5%、能量≤1%。两个物理片大小的差异允许非零，但必须解释边缘范围；若中央区尚受强边缘影响，不称“内部组织极限”。<\/p>\n<p>局部扰动效应需大于基线数值不确定度，且可在冻结区域重复。效应小于误差只说明未解析，不说明没有生物机制。大压缩对称破缺需独立扰动/稳定性检查，不自动判 bug，也不在本阶段追求屈曲叙事。<\/p>\n<p>不允许为了接下来的心室几何重新标定此处已经冻结的材料。专属输出：<code>bilayer_boundary_contract.md<\/code>、<code>roi_material_map<\/code>、<code>perturbation_registry.csv<\/code>、<code>transfer_metrics.csv<\/code>、边缘/密度/网格研究和公平对照配置。<\/p>\n<p>Z4b 接收的是已检查的组织连接与材料；完整腔面和受压路径仍未通过。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z4b。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z4b_WATERTIGHT_CAVITY_AND_PRESSURE.md": {"title": "无 CFD 共同腔面与被动受压", "id": "Z4b", "kind": "execution", "html": "<h1>Z4b｜无 CFD 共同腔面与被动受压<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z4 双层组织力学/连接与 Z1 压力作用路径 PASS\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z5 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 为什么独立设门<\/h2>\n<p>证明“闭合的细胞”确实能组成“定义明确的共同血液腔面”，并将腔压正确传回 DCM。这里没有 CFD、不解流量，也不使用主动泵血。采用合成短管与理想椭球的静态/准静态力学检查，提前发现曲率、顶点聚集、连接漏缝和端口假封帽问题。<\/p>\n<p>本阶段人工均匀压力是外载，不声称来自真实血液。<\/p>\n<h2>2. 共同腔面构造合同<\/h2>\n<p>每个细胞保留闭合表面和身份。明确腔面、基底面、侧面以及相邻细胞的连接拓扑；共同腔面仅使用腔面及有物理归属的连接区域。优先共形拼接或经过验证的约束，不用渲染补洞当液密结构。<\/p>\n<p>给出 <code>XΓ=g(q)<\/code>；每个壁顶点/面能追溯到细胞自由度与材料位置。单独流体壁网格只能是该映射的派生，不自带独立位置自由度、表面能或运动驱动。若采用投影/光滑，给出导数和偏差，不能只计算一个“相邻节点平均力”代替一致反力。<\/p>\n<p>短管与椭球可含固定平面端口，端口边缘由明确有限支撑保持。体积计算用虚拟封帽；封帽有 <code>virtual_cap=true<\/code>、<code>solid_wall=false<\/code>。纯闭合腔形态用无端口版本作几何测试，压力加载时不解不可压缩流体，所以不应混淆不同问题。<\/p>\n<h2>3. 几何与材料方向<\/h2>\n<p>短管先建立规则环向/轴向分区。理想椭球可用截短长旋转椭球，但避免把经纬线两端大量退化三角形作为顶点。材料方向从参数化材料坐标映射，检查极区或坐标图接缝；不能把参考方向在每个三角形上任意拼接。<\/p>\n<p>纯切向单一纤维方向在某些闭合曲面上可能无法全局光滑；发现奇点/缺陷需明确建模或采用已定义方向图，不隐藏法向翻转。这里不主张全局无缺陷方向场。<\/p>\n<p>曲面细胞数量与几何分辨率分别记录。保持细胞尺寸、壁体积和层厚的关系清楚；不能在同一个腔面上复制两层但不给细胞厚度/侧面。<\/p>\n<h2>4. 必需实验<\/h2>\n<table>\n<thead>\n<tr>\n<th>case_id<\/th>\n<th>内容<\/th>\n<th>检查<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Z4b-CLOSE<\/td>\n<td>细胞、组织、共同腔面三套闭合检查<\/td>\n<td>缺边/重复面/未归属面及端口边界<\/td>\n<\/tr>\n<tr>\n<td>Z4b-VOLUME<\/td>\n<td>三角面体积与独立方法比较<\/td>\n<td>多面体精确一致和解析曲面逼近分别报告<\/td>\n<\/tr>\n<tr>\n<td>Z4b-MAP<\/td>\n<td>随机方向位移与 J 检查<\/td>\n<td>g 的导数、力映射虚功、合力合矩<\/td>\n<\/tr>\n<tr>\n<td>Z4b-PRESSURE<\/td>\n<td>小均匀跨壁压力加载/卸载<\/td>\n<td>压力做功、反力、实际腔体和细胞体积<\/td>\n<\/tr>\n<tr>\n<td>Z4b-RIGID<\/td>\n<td>刚体变换几何和载荷<\/td>\n<td>客观性、封帽/端口不会创造假能量<\/td>\n<\/tr>\n<tr>\n<td>Z4b-REFINE<\/td>\n<td>同一材料与几何的网格细化<\/td>\n<td>压力载荷、体积与位移读出收敛<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>外部压力 p_ext 与腔内 p_in 明确，Δp=p_in-p_ext。第一载荷控制为冻结力尺度的小值，使壁应变约 1% 的线性探针；只允许预检选定该数值并登记，正式阶段不能为好看的动画改载荷。<\/p>\n<p>固定端口下均匀压力外功应与 <code>Δp dV<\/code> 的定义一致；若计算包含外层体积或其它受压面，必须按实际受压面功积分，不套单一腔体体积公式。用独立方向差分 <code>δV<\/code> 检查均匀腔压力与 <code>p δV<\/code> 的功对应；端口支撑反力必须记录。<\/p>\n<h2>5. 关键零效应对照<\/h2>\n<p>同一几何只交换细胞 ID，结果只重排。只重三角剖分并保持参考态时，差异属于可量化离散/转移误差；不可重新设零应力。仅改变虚拟封帽的三角剖分不改变实际壁载荷或固体能量。<\/p>\n<p>共同腔面抽样变密不应自动增加受压总力；检查面面积积分权重。通过几何 g 的导数检查和虚功检查是两项，不用同一错误 J 形成的代数恒等式自证正确。<\/p>\n<h2>6. 必须可视化的结果<\/h2>\n<table>\n<thead>\n<tr>\n<th>视图<\/th>\n<th>用户看到什么<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>三对象切换<\/td>\n<td>单细胞闭合面、组织连接、共同腔面分别显示<\/td>\n<\/tr>\n<tr>\n<td>端口特写<\/td>\n<td>实体壁、开口边、虚拟封帽不同文字/显示方式；封帽默认半透明<\/td>\n<\/tr>\n<tr>\n<td>ID 追踪<\/td>\n<td>点击壁面片显示原细胞/材料锚点和映射权重<\/td>\n<\/tr>\n<tr>\n<td>泄缝/自交地图<\/td>\n<td>所有未解释开边、退化面和相交位置<\/td>\n<\/tr>\n<tr>\n<td>被动受压动画<\/td>\n<td>真实变形、压力箭头、支撑反力、无 CFD 标签<\/td>\n<\/tr>\n<tr>\n<td>体积与功曲线<\/td>\n<td>腔体 V、细胞 V、压力功、储能/耗散和误差<\/td>\n<\/tr>\n<tr>\n<td>映射与细化图<\/td>\n<td>J 导数、虚功/力矩误差、不同网格压力位移<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 验收与交接<\/h2>\n<p>未标记开边为零；所有物理壁面归属完整；单细胞/组织/腔面各自合格；虚功/反力合矩≤10^-10，g 导数按 10^-6 检查；受压能量≤1%，整体/局部读出 2%/5%。解析曲面几何误差要随独立几何细化下降，不以 10^-10 要求三角球等于解析球。<\/p>\n<p>Z4b 不产生压力场、流量或 WSS。专属输出：<code>cavity_topology_contract.md<\/code>、<code>wall_to_cell_map<\/code>、<code>port_registry.json<\/code>、<code>pressure_work_check.csv<\/code>、腔体与细胞体积日志。后续 Z6c/Z7/Z8 必须复用同一语义，不能另造一张不受细胞约束的光滑壁。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z5。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z5_FIXED_GRID_CFD.md": {"title": "独立 CFD：固定规则边界与解析/制造解", "id": "Z5", "kind": "execution", "html": "<h1>Z5｜独立 CFD：固定规则边界与解析/制造解<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z0 数值/单位合同；默认 Z4b 已完成；本阶段不调用 DCM 力学\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z6a（先阅读 Z6 控制入口） 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 本阶段范围<\/h2>\n<p>实现/核验最小三维不可压缩牛顿流体求解器。只有固定规则边界，无切割单元、无移动壁、无 DCM、无理想阀。采用交错 Cartesian 网格、有限体积通量和压力投影；允许复用线性代数库，不替换为未声明的黑箱完整 CFD。<\/p>\n<p>二维解析场可以嵌在三维网格作单项验证，但至少一个测试必须在 x/y/z 和三个速度分量上都有非平凡变化，防止“二维求解器加一层”被误报为三维通过。<\/p>\n<h2>2. 方程、离散和预登记<\/h2>\n<pre><code class=\"language-latex\">\\rho(\\partial_tu+u\\cdot\\nabla u)=-\\nabla p+\\mu\\nabla^2u+f,\\quad\\nabla\\cdot u=0.\n<\/code><\/pre>\n<p>明确 u/v/w 各在相应面中心，p 在单元中心。记录散度 D、梯度 G、黏性 L、速度质量矩阵与边界项。检查 D/G 的加权伴随关系、黏性耗散符号和全局通量抵消。不能只在求解后做一次中心差分散度图。<\/p>\n<p>压力投影的边界条件须由原始速度/牵引边界和时间离散推导，不能为方便给所有边界 p=0。全 Neumann 情况检查兼容性与规范；压力只在共同规范下比较。<\/p>\n<p>为每个算子/场/边界登记预期阶次。首版可采用有明确稳定性限制的一阶时间积分，也可采用已有经过审计的高阶方法；在结果前固定，不能事后把失败的二阶改称一阶通过。空间主目标为光滑规则网格上的二阶速度离散，压力和边界梯度单独声明。对流、黏性显隐选择和 CFL 条件写清。<\/p>\n<h2>3. 必需基准及公式<\/h2>\n<h3>Z5-P：平行板 Poiseuille 流<\/h3>\n<p>通道 y∈[-H,H]，沿 x 流动，z 周期，x 周期加等效体力 G 或周期压降；不要同时加入两份驱动。G=-∂p/∂x&gt;0：<\/p>\n<pre><code class=\"language-latex\">u_x(y)=\\frac{G}{2\\mu}(H^2-y^2),\\quad Q/W=\\frac{2GH^3}{3\\mu},\\quad |\\tau_w|=GH.\n<\/code><\/pre>\n<p>保存总压力/周期压力分解。解析比较包括速度剖面、流量、壁面剪切和功率—黏性耗散。启动过程不是稳态解析解，需先到稳态或以解析初值检查维持。<\/p>\n<h3>Z5-O：振荡平行板流<\/h3>\n<p>同一通道，<code>G(t)=Re{Ghat exp(iωt)}<\/code>，无对流贡献。取 λ=√(iωρ/μ)，选择一致复根：<\/p>\n<pre><code class=\"language-latex\">\\hat u(y)=\\frac{\\hat G}{i\\omega\\rho}\\left[1-\\frac{\\cosh(\\lambda y)}{\\cosh(\\lambda H)}\\right].\n<\/code><\/pre>\n<p>比较稳态周期幅值和相位，解析速度梯度给 WSS 参考。ω 很小时用稳态极限/稳定数值求值避免消去误差；大 ω 时确保黏性边界层被解析。默认 α=H√(ωρ/μ) 取 0.5 和 2 两个合成测试，先单工况通过再扩展。<\/p>\n<h3>Z5-M：真正三维制造解<\/h3>\n<p>单位立方体，令 <code>ψ=sin²(πx) sin²(πy) sin²(πz) exp(-t)<\/code>，向量势 <code>A=(ψ,2ψ,3ψ)<\/code>，取 <code>u=curl A<\/code>，<code>p=cos(πx)cos(πy)cos(πz)exp(-t)<\/code>。由 curl 恒等式有 div u=0，且边界速度为零，三个速度分量均可非零。<\/p>\n<p>独立符号/解析程序生成 <code>f=ρ(∂t u+u·∇u)+∇p-μ∇²u<\/code>，先验证连续方程残差，再评估数值误差。参考力不能由待验证的离散算子作用于解析数组生成，否则会形成自证循环。p 的平均规范与数值一致。<\/p>\n<p>这些公式是本合同给定测试方程的解析/直接推导参考，不是来自斑马鱼测量。<\/p>\n<h2>4. 测试顺序与规模<\/h2>\n<p>先检查索引/边界/散度梯度，再扩散和静止解，再 Poiseuille，再振荡，最后三维制造解。光滑制造解从每方向 16/32/64 单元的三档开始；通道法向也用三档有效间隙分辨率。预检可 8³，但不能充当正式收敛序列。<\/p>\n<p>时间序列取冻结 T 或扩散时间尺度的 Δt、Δt/2、Δt/4；所有档满足方法稳定性和解析需求。空间细化时固定足够小 Δt，时间细化时固定足够细网格。不要因为自动 CFL 导致 h 和 Δt 一起变而仍称独立空间收敛。<\/p>\n<p>压力线性求解容差加严 10 倍做验证；迭代误差小于离散误差的 10%。记录每步压力残差、质量通量、黏性耗散、对流/投影能量贡献与计时。所有诊断用实际 staggered 位置和控制体权重。<\/p>\n<h2>5. 原始读出<\/h2>\n<p>u/v/w 和 p 的独立 L2/L∞ 误差；固定探针与截面；Q、WSS、全局/局部散度；振荡幅相；动能与驱动功/耗散。压力误差计算前只移除规范允许的常数，不做空间拟合矫正。<\/p>\n<p>WSS 使用壁面切向牵引定义；不同一侧壁的符号由 n 定义，不能只比较绝对值掩盖法向反转。读出有符号分量和模长。<\/p>\n<h2>6. 可视化最低要求<\/h2>\n<table>\n<thead>\n<tr>\n<th>视图/图<\/th>\n<th>检查点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>三维网格与变量位置<\/td>\n<td>面心 u/v/w、中心 p、端口/周期/无滑移边界标记<\/td>\n<\/tr>\n<tr>\n<td>通道截面与剖面<\/td>\n<td>解析与数值速度、压力梯度、误差场<\/td>\n<\/tr>\n<tr>\n<td>振荡动画<\/td>\n<td>同时刻流场与中心速度游标；幅值/相位误差<\/td>\n<\/tr>\n<tr>\n<td>真三维制造解<\/td>\n<td>三个速度分量切片和压力/误差体切片，非二维挤出<\/td>\n<\/tr>\n<tr>\n<td>WSS 图<\/td>\n<td>壁面符号、解析梯度与数值梯度、独立收敛<\/td>\n<\/tr>\n<tr>\n<td>守恒/能量图<\/td>\n<td>散度、Q、动能、外功、耗散、残差<\/td>\n<\/tr>\n<tr>\n<td>h 与 Δt 收敛图<\/td>\n<td>u、p、WSS 分开，参考斜率只用于比较不伪造拟合<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>无细胞阶段所有细胞/ECM 字段为不适用，不用心室外形包装规则通道。<\/p>\n<h2>7. 验收与交接<\/h2>\n<p>解析整体≤2%、局部≤5% 且达到冻结预期精度；散度基准默认≤10^-8（归一化）；能量≤1%；稳态/周期状态有实际证据。压力/剪切未过门时只能报告已过速度/流量子项，不能宣称 Z5 全面通过。<\/p>\n<p>故障优先查周期驱动双计、投影边界、交错位置错位、压力规范和时间相位。无需通过改变 μ/ρ 来消除错误。输出 <code>discrete_operators.md<\/code>、<code>analytic_reference_checks<\/code>、<code>boundary_condition_registry<\/code>、所有收敛/功率表和独立 verifier。<\/p>\n<p>Z6 接收固定网格正确性证据和算子接口，不能由 Z5 PASS 推断切割几何与移动边界已支持。[R5] 是后续空间算子参考，不替代这里的实现检验。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z6a（先阅读 Z6 控制入口）。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z6_MOVING_BOUNDARY_CONTROLLER.md": {"title": "移动边界 CFD 总控制入口", "id": "Z6", "kind": "controller", "html": "<h1>Z6｜移动边界 CFD 总控制入口<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：阶段控制入口，不授权批量执行子门\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z5 PASS；Z4b 共同腔面语义可供后续映射；每个子门需单独授权\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z6a；不得一次执行 Z6a–Z6c 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 本文件只做分门与汇总<\/h2>\n<p>Z6 分为三份独立执行文件：<\/p>\n<table>\n<thead>\n<tr>\n<th>子门<\/th>\n<th>文件<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Z6a<\/td>\n<td><code>Z6a_CUT_GEOMETRY_AND_SWEEP.md<\/code><\/td>\n<td>几何截交、面积/体积矩、壁扫掠与单元生灭；不解流体<\/td>\n<\/tr>\n<tr>\n<td>Z6b<\/td>\n<td><code>Z6b_FIXED_CURVED_WALL_CFD.md<\/code><\/td>\n<td>固定曲壁 CFD、压力/牵引和 WSS；壁不动<\/td>\n<\/tr>\n<tr>\n<td>Z6c<\/td>\n<td><code>Z6c_MOVING_WALL_CFD.md<\/code><\/td>\n<td>规定运动、守恒重映射、流体单元出现/消失、排液<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>用户仅给本文件并要求执行 Z6 时，先完成本控制入口的依赖/算法审计，生成 Z6a 的冻结合同与阻断表，<strong>不要自动把三个子门全部运行<\/strong>。真实子门执行以用户明确选择该子门为准。<\/p>\n<h2>2. 必须在进入 Z6a/Z6b 前冻结的设计<\/h2>\n<p>写出三维切割几何表示、控制体体积/面面积/矩、交错动量控制体构造；不只给压力格子的 alpha。冻结极小单元策略、压力/黏性边界通量、状态转移和时间几何积分。只列“使用 cut-cell”不构成规格。<\/p>\n<p>候选极小单元合并必须具有局部守恒转移和确定性邻接规则，不跨不连通流体分量、不跨实体壁。采用重分配时写清质量/动量/动能性质及能量缺陷的可测表达式。不能简单删除小单元、截断速度、重置压力或补液。<\/p>\n<p>若只能实现固定二维参考方法，保持相关能力 <code>missing<\/code>，不可把第三维复制若干层宣称三维移动方法完成。[R5] 仅作空间算子参考，[R9] 的移动扩散线索也不等于不可压缩 NS 已解。<\/p>\n<h2>3. 父阶段如何验收<\/h2>\n<p>Z6a/b/c 的必需项均 PASS，且使用的是兼容几何/算子/状态转移版本；任何共享修改后受影响前子门需回归。只把不同版本的三个成功动画拼一起不算 Z6 PASS。<\/p>\n<p>父阶段汇总页需可跳转三子门真实结果；展示一张贯穿三者的证据矩阵：几何→固定曲壁→移动边界、每项版本和通过范围。没有实际数据时只显示合同链接和 NOT_RUN。<\/p>\n<h2>4. 阶段完成后交给 Z7 的内容<\/h2>\n<p>同源的壁几何/速度/流体通量/反力定义，完整状态回退和检查点格式，移动质量/动量/能量证据，极小单元适用范围与失败包，以及 Z7 耦合合同。不得在 Z6 用规定运动的成功宣称结构双向耦合成功。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z6a；不得一次执行 Z6a–Z6c。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z6a_CUT_GEOMETRY_AND_SWEEP.md": {"title": "切割几何与壁面扫掠：先不求流体", "id": "Z6a", "kind": "execution", "html": "<h1>Z6a｜切割几何与壁面扫掠：先不求流体<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z6 设计审计与算法选择冻结；Z5 网格/单位定义可用\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z6b 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 要验证的对象<\/h2>\n<p>只计算三维几何：Cartesian 单元与流体区域的交、开放面、多面体体积/一阶矩、真实壁面片、交错动量控制体及时间扫掠。可播放规定几何轨迹，但没有速度求解、压力、WSS 或泵血。<\/p>\n<p>必须区分解析曲面的三角近似误差与“同一个分片曲面切割求积”的误差。只比较两种都用同一错误体积函数的结果不是独立验证。<\/p>\n<h2>2. 几何数据合同<\/h2>\n<p>对每个原始/合并单元存 <code>cell_id, fluid_component_id, V_fluid, alpha, centroid, face_apertures, face_centroids, wall_polygons, wall_normals<\/code>。对 u/v/w 控制体也存对应几何，不能用压力体积分数代替所有动量权重。<\/p>\n<p>n_f 指向流体外；同一公共网格面在相邻控制体中的面积相同、法向相反。记录三角面/壁片到原几何面和材料标识的映射。所有积分的面积/体积单位写清。<\/p>\n<p><code>alpha<\/code> 只允许处于 [0,1] 的舍入容差内，默认 10^-12；明显越界必须报错，不静默 clip。退化接触（壁恰过顶点/边/面）采用稳定且确定性的符号规则并专门测试，不能随机扰动后不记录。<\/p>\n<h2>3. 必需几何实验<\/h2>\n<table>\n<thead>\n<tr>\n<th>case_id<\/th>\n<th>几何/运动<\/th>\n<th>参考与风险<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Z6a-PLANE<\/td>\n<td>不同法向、偏移的半空间截方格<\/td>\n<td>可解析多面体体积和共有面一致性<\/td>\n<\/tr>\n<tr>\n<td>Z6a-SPHERE<\/td>\n<td>固定球/分片球，球心相对格点偏移<\/td>\n<td>解析体积与离散表面体积分开<\/td>\n<\/tr>\n<tr>\n<td>Z6a-ELLIPSOID<\/td>\n<td>非球形、非轴对齐椭球<\/td>\n<td>真正三维曲面与矩<\/td>\n<\/tr>\n<tr>\n<td>Z6a-TRANSLATE<\/td>\n<td>恒速平移跨多个单元<\/td>\n<td>新出现/消失及扫掠符号<\/td>\n<\/tr>\n<tr>\n<td>Z6a-RETURN<\/td>\n<td>平移后换向返回<\/td>\n<td>可逆几何路径、无累计体积漂移<\/td>\n<\/tr>\n<tr>\n<td>Z6a-DET1<\/td>\n<td>同一多面体的 det=1 仿射变形<\/td>\n<td>全局体积严格保持、局部体积改变<\/td>\n<\/tr>\n<tr>\n<td>Z6a-SMALL<\/td>\n<td>壁面逼近网格角使流体体积分数很小<\/td>\n<td>10^-1、10^-3、10^-5 等位置探针与合并策略<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>预检 8³，正式 16³/32³/64³ 或等效三档；表面网格独立细化。时间扫描的三档步长保证跨格/换向过程覆盖，不只采壁恰好避开网格的幸运相位。选择一条在粗步内发生单元生灭的轨迹。<\/p>\n<h2>4. 守恒恒等式与时间几何<\/h2>\n<p>对固定 Cartesian 单元流体部分：<\/p>\n<pre><code class=\"language-latex\">\\Delta V_K=\\int_{t_n}^{t_{n+1}}\\int_{\\Gamma_w\\cap K}w\\cdot n_f\\,dA\\,dt.\n<\/code><\/pre>\n<p>两侧应来自可交叉检查的路径：时间端点体积差，以及扫掠构造/独立时间求积。不可直接把 ΔV_K 命名为扫掠量再证明两者相等。全域 ∑V_K 与闭合边界体积独立比较。<\/p>\n<p>空间恒等式检查 <code>∫∂Ω n dA=0<\/code>、<code>V=(1/3)∫∂Ω x·n dA<\/code> 和合并前后体积/矩守恒。采用同一多面体可将代数误差目标设为 10^-10；解析球与三角球之差按几何收敛验收，不强制机器精度。<\/p>\n<p>时间重构应在预登记中说明是时空多面体、扫掠面还是分段积分；新拓扑事件时细分时间几何，不能把换向前后速度平均为零而漏掉中间扫掠。<\/p>\n<h2>5. 极小单元方案只做几何层面验证<\/h2>\n<p>输出每个合并/重分配集合的原单元、目标单元、流体连通性和体积权重。验证跨格平移时集合变化不丢体积/矩，不合并隔墙两侧。限制过长合并链和退化控制体并记录失败。<\/p>\n<p>Z6a 不承诺任何动量/能量转移性质；那些需 Z6b/c 在实际流场中验收。不要只因为 alpha 合法就写“cut-cell 已守恒”。<\/p>\n<h2>6. 必须可视化的结果<\/h2>\n<table>\n<thead>\n<tr>\n<th>视图/图<\/th>\n<th>内容<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>切割单元 3D 放大<\/td>\n<td>原格、流体子体、开放面、壁片法向、alpha/体积<\/td>\n<\/tr>\n<tr>\n<td>交错控制体切换<\/td>\n<td>p/u/v/w 不同几何位置与权重<\/td>\n<\/tr>\n<tr>\n<td>生灭/合并动画<\/td>\n<td>几何扫描时间、单元类别改变与合并邻接，不含压力场<\/td>\n<\/tr>\n<tr>\n<td>扫掠体积视图<\/td>\n<td>t_n/t_(n+1) 边界及中间扫掠区域<\/td>\n<\/tr>\n<tr>\n<td>几何守恒图<\/td>\n<td>端点 ΔV 与独立扫掠、全局/局部残差、换向时刻<\/td>\n<\/tr>\n<tr>\n<td>小体积直方图<\/td>\n<td>alpha 分布、最小值、合并前后控制体大小<\/td>\n<\/tr>\n<tr>\n<td>h/表面/时间误差<\/td>\n<td>三类细化分开，解析曲面与多面体两种参考分开<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>点击异常单元可查看其壁片/原三角形 ID、相邻体积和数值容差。失败位置必须能自动跳转。<\/p>\n<h2>7. 验收与输出<\/h2>\n<p>无未解释负体积/重复面积/法向错误；同多面体体积/面抵消代数≤10^-10；解析几何误差随独立细化下降且达到冻结几何预算；时空扫掠误差默认≤10^-6 V_ref 并随时间/几何细化下降，具体分配需在正式前冻结。任何几何缺陷不得通过求解器后续补液掩盖。<\/p>\n<p>专属输出：<code>cut_geometry_contract.md<\/code>、<code>momentum_control_volume_geometry<\/code>、<code>sweep_ledger.csv<\/code>、<code>merge_map<\/code>、独立几何验证器、最小失败几何。Z6b 只接收通过版本和明确适用范围。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z6b。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z6b_FIXED_CURVED_WALL_CFD.md": {"title": "固定曲壁 CFD：切割算子、牵引与壁面剪切", "id": "Z6b", "kind": "execution", "html": "<h1>Z6b｜固定曲壁 CFD：切割算子、牵引与壁面剪切<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z5 和 Z6a 在兼容代码版本上 PASS；极小单元/压力边界策略已冻结\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z6c 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 范围<\/h2>\n<p>将 Z5 已通过的流体算子推广到 Z6a 的固定曲壁几何；壁速度严格为零。检验压力、黏性、通量和牵引，而不是移动边界。无 DCM、无流固耦合、无阀。<\/p>\n<p>一个圆管流量正确，不足以证明曲壁压力、法向、剪切和新几何控制体全部正确。必须有静止、驱动、三维变化和格点偏移的独立检查。<\/p>\n<h2>2. 算子要求<\/h2>\n<p>几何来自 Z6a 同一版本，包括 p/u/v/w 各自控制体、开放面、壁面积/法向和合并集合。记录切割面压力和黏性通量如何进入动量方程；输出到结构的未来反力应取同一离散壁通量，不使用另一个不相关的后处理梯度。<\/p>\n<p>切割区 D/G 的加权伴随、共有面动量抵消、黏性负定/耗散性质分别验证。压力矩阵对称性或非对称性按实际算法声明；不能只因迭代器返回成功就认为方程正确。无滑移壁与开放/周期边界各自说明。<\/p>\n<p>极小单元若合并或重分配，保存原始/有效控制体映射、局部传输量与能量变化。只有可独立计算的缺陷才能叫数值耗散，禁止丢动量后用压力归零掩盖。<\/p>\n<h2>3. 必需实验<\/h2>\n<table>\n<thead>\n<tr>\n<th>case_id<\/th>\n<th>设定<\/th>\n<th>参考<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Z6b-REST<\/td>\n<td>固定非轴对齐曲腔，u=0、常压、无体力<\/td>\n<td>持续静止、零黏性牵引、规范一致<\/td>\n<\/tr>\n<tr>\n<td>Z6b-HYDRO<\/td>\n<td>固定曲腔，均匀体加速度 b<\/td>\n<td>u=0，p=p0+ρ b·x，检查压力/体力平衡<\/td>\n<\/tr>\n<tr>\n<td>Z6b-PIPE<\/td>\n<td>圆管半径 R，轴向充分发展流<\/td>\n<td>Poiseuille 速度/流量/剪切<\/td>\n<\/tr>\n<tr>\n<td>Z6b-MMS<\/td>\n<td>三维制造场作用于固定曲域<\/td>\n<td>已知 u/p/f 与边界值<\/td>\n<\/tr>\n<tr>\n<td>Z6b-OFFSET<\/td>\n<td>同一物理管/曲腔相对网格偏移<\/td>\n<td>排除幸运切割与极小单元失真<\/td>\n<\/tr>\n<tr>\n<td>Z6b-REFINE<\/td>\n<td>流体 h、壁表面分辨率、Δt 分开<\/td>\n<td>几何误差、算子误差和时间误差<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>圆管解析式：<code>u_x(r)=G(R²-r²)/(4μ)<\/code>，<code>Q=π G R⁴/(8μ)<\/code>，<code>|τ_w|=G R/2<\/code>，G=-dp/dx。流向周期+等效驱动可减少端部误差，不能同时施两份驱动。若采用入口出口，声明充分发展段和边界误差，不把入口发展区比作无限长解析解。<\/p>\n<p>圆管的三角壁是圆的近似。分别比较同一多面体求解的网格收敛，以及表面趋近解析圆的几何误差；不要求有限多边形壁上圆管公式精确满足无滑移。<\/p>\n<p>MMS 沿用 Z5 独立解析生成方式；切割曲壁上的解析 u 若非零，施加为<strong>测试用规定边界值<\/strong>，不是声称无滑移静壁流。记录该基准边界不同，避免和静壁验证混为一谈。至少有一个三分量/三空间方向非平凡的制造场。<\/p>\n<h2>4. 规模与实验次序<\/h2>\n<p>先 REST/HYDRO，再圆管与剪切，再 MMS 和格点偏移。流体三档可按管直径 16/32/64 格；曲面也至少三档独立逼近。几何偏移使用冻结的 0、0.23h、0.49h 等非特殊位置，并包含 Z6a 已识别极小 alpha 的配置。<\/p>\n<p>固定曲壁阶段不触发真实单元生灭，但静态极小单元策略必须受检。正式结果记录最小 alpha、合并统计、压力条件数/迭代量和局部残差；禁止筛掉“难切位置”只报告好位置。<\/p>\n<h2>5. 主要指标与 WSS 定义<\/h2>\n<p>压力、u/v/w、流量、动能、驱动功、物理耗散和局部通量。壁面切向牵引<\/p>\n<pre><code class=\"language-latex\">\\tau_w=(I-nn^T)\\sigma n=(I-nn^T)2\\mu D(u)n.\n<\/code><\/pre>\n<p>法向 n 与受力对象约定固定；同时报告方向分量和模长。WSS 从冻结的壁梯度/牵引重构算子得到，并用解析圆管/平板独立验收。不能把最近一个流体节点速度除以随意距离当作已验证 WSS。<\/p>\n<p>用固定物理壁区平均/积分作主局部量，端口尖角排除区在预登记中定义，不能看到异常后扩大掩码。整体壁反力与动量/压力负载收支另行比较。<\/p>\n<h2>6. 可视化合同<\/h2>\n<table>\n<thead>\n<tr>\n<th>视图/图<\/th>\n<th>必需信息<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>曲壁和切格特写<\/td>\n<td>原三角面、壁法向、流体子体、最小 alpha、合并对象<\/td>\n<\/tr>\n<tr>\n<td>静止/静水压图<\/td>\n<td>速度误差而非伪流动美化、p 与体力平衡、异常位置<\/td>\n<\/tr>\n<tr>\n<td>圆管流场<\/td>\n<td>纵截面/横截面、解析剖面与差值<\/td>\n<\/tr>\n<tr>\n<td>WSS 壁图<\/td>\n<td>有符号剪切、有效采样区、解析与数值误差<\/td>\n<\/tr>\n<tr>\n<td>格点偏移对照<\/td>\n<td>同几何不同网格偏移；显示差异和成本<\/td>\n<\/tr>\n<tr>\n<td>守恒/阶次图<\/td>\n<td>质量、动量、能量、压力及 WSS 独立收敛<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>7. 验收、失败与交接<\/h2>\n<p>静止与静水压无超出冻结误差包络的假流；解析整体/局部 2%/5% 与冻结阶次成立；能量≤1%；流量和壁牵引各自通过。WSS 未通过时不得在后续页面启用成已验证物理字段。<\/p>\n<p>压力尖峰先查几何/极小单元合并/梯度边界与规范，不以截断压力处理。格点偏移敏感说明还未解析；不能只在对齐几何标 PASS 后覆盖全部曲壁。<\/p>\n<p>输出 <code>curved_wall_operator_contract.md<\/code>、<code>wall_traction_ledger.csv<\/code>、<code>wss_validation.csv<\/code>、偏移/几何/网格研究、所有异常单元包。Z6c 接收的是固定曲壁通过，不包括任何移动状态转移能力。[R5] 为方法参考。<\/p>\n<h2>通用执行闭环与最终答复<\/h2>\n<ol>\n<li>保存工作区和依赖快照，记录已有未提交修改；不得覆盖、回滚、清理用户原始文件。<\/li>\n<li>在阶段专用目录保存 <code>preregistration.json<\/code>：方程、参数来源、单位、实验列表、非零参考尺度、阈值、随机种子、预算、代码/内核版本。正式结果产生后不得回调阈值。<\/li>\n<li>先做小规模预检并输出真实可检查的几何/字段；未经预检不得直接启动全量。预检失败就停在本阶段，不使用假数据填满页面。<\/li>\n<li>正式计算、可视化导出、独立验证分开；验证器从原始文件重算关键指标，不能仅相信求解器输出的 <code>passed=true<\/code>。<\/li>\n<li>交付 <code>report.md<\/code>、<code>summary.json<\/code>、<code>metrics.csv<\/code>、参数、真实执行命令、日志、原始快照、离线 <code>index.html<\/code>；适用时另交付可重启检查点。文件组织可适配现有项目，但需保留语义及相对路径清单。<\/li>\n<li>正常结束、失败、预算停止都写明最后有效时刻。只有所有必需检查真正完成且通过，阶段才可为 <code>PASS<\/code>；部分成功用 <code>completed_subchecks<\/code> 列出，不把全阶段涂绿。<\/li>\n<li>最终回复按“状态与通过范围—结果入口—最重要的三项数值—失败/缺项—实际修改—下一阶段合同”报告，附真实可打开路径。停止，不执行 Z6c。<\/li>\n<\/ol>\n<p><strong>可视化底线：<\/strong> 至少有可离线打开的模型/网格视图、可读的定量验收图、数据与日志入口。适用的细胞或流体字段必须来自本次原始快照。可旋转、选对象、剖切、透明、时间同步和色标单位按共享合同验收；无动力学的阶段不伪造时间曲线。用于绘图的抽样不能影响数值验收，展示平滑不得改变求解几何。<\/p>\n<p><strong>状态细分：<\/strong> <code>NOT_RUN / RUNNING / PASS / FAIL_NUMERICAL / UNRESOLVED / BLOCKED_DEPENDENCY / BLOCKED_SPEC / BLOCKED_DATA / STOPPED_BUDGET<\/code>。另记录 <code>physics_status<\/code>、<code>visualization_status<\/code> 和 <code>claims_status<\/code>，避免“计算通过但交付缺失”或“数据不足但合成工作有效”被混淆。<\/p>\n"}, "stages/Z6c_MOVING_WALL_CFD.md": {"title": "移动边界 CFD：规定运动、单元生灭与活塞排液", "id": "Z6c", "kind": "execution", "html": "<h1>Z6c｜移动边界 CFD：规定运动、单元生灭与活塞排液<\/h1>\n<blockquote>\n<p>文档版本：v03（2026-09-10）｜文档类型：单阶段 Codex 执行合同\n当前计算状态：<strong>NOT_RUN<\/strong>。本文定义待执行工作，不包含已获得的模拟结果。\n前置证据：Z6a 几何/扫掠、Z6b 固定曲壁及 Z5 独立 CFD 均 PASS；状态转移策略冻结\n本轮终点：提交本文件授权范围的结果与验收；<strong>不得自动执行 Z7（先汇总 Z6） 或其他阶段<\/strong>。<\/p>\n<\/blockquote>\n<h2>给 Codex 的首要指令<\/h2>\n<p>请在用户实际打开的 PRL 工作区完成本阶段，不要只返回建议或伪代码。先定位仓库、阅读现有项目说明和本阶段实际依赖，再冻结输入、完成有上限的预检、实现/运行授权实验、导出原始证据和离线页面，最后独立复核。发现关键依赖或模型定义缺失时，交付阻断证据，不擅自跨过。<\/p>\n<p>生产路线始终是：<strong>唯一 <code>muse_dcm<\/code> 内核 + 主动心肌 DCM + 被动心内膜 DCM + 薄层 ECM 网络 + 自建最小 CFD<\/strong>。本阶段未使用的模块保持关闭。不得复制第二套 DCM、用规定壁运动冒充主动双向耦合、用目标细胞体积缩小冒充收缩，或用合成分区冒充实验细胞膜。<\/p>\n<p>同时阅读 <code>../01_GLOBAL_EXECUTION_CONTRACT.md<\/code>、<code>../02_VISUALIZATION_AND_DATA_CONTRACT.md<\/code> 和 <code>../03_VALIDATION_METRICS.md<\/code>。本文件已保留关键规则，脱离总包时也不得省略：只执行本阶段；保护用户修改与失败包；默认 CPU；阈值先冻结；结果与检查点分开；未运行字段为缺失而非零；失败也交付可视化；不因动画好看判 PASS。共享文件若缺失且影响公式、符号或验收，标记 <code>BLOCKED_SPEC<\/code>，不要猜。<\/p>\n<h2>1. 问题与范围<\/h2>\n<p>给定已知壁运动，验证不可压缩流体在切割单元出现/消失、极小单元集合变化和边界换向时保持正确质量、动量及能量。本阶段壁运动是输入，<strong>不是 DCM 计算结果，也不是主动泵血<\/strong>。<\/p>\n<p>同时保存“规定轨迹”和“实际采用的离散壁速度”，证明二者在同一时间离散下兼容。不得从稀疏动画帧差分得到求解器壁速度。<\/p>\n<h2>2. 移动算法必须补齐的部分<\/h2>\n<p>压力投影使用随时间变化的有效体积/开口面积和壁扫掠关系。新出现流体单元的质量/动量从保守邻域或时空控制体转移，不能直接填零速度/复制最近值而不记收支。消失单元的动量有去向。压力是约束变量，其初始化/规范不能被误当守恒标量，但它影响动量更新，必须检查。<\/p>\n<p>对交错动量控制体建立保守映射；合并组变化要追踪组件连通性，不能从实体壁另一侧借流体。状态转移单独输出前后质量、动量、动能及数值缺陷；不能只有总容积。<\/p>\n<p>被拒绝时间步必须回退流体、几何版本、合并组、累计通量和能量；事件触发以真实时间为准。测试几何恰换向或穿过格点的情形，不只测试单向平移。<\/p>\n<h2>3. 必需算例及参考<\/h2>\n<h3>Z6c-T：恒速刚体平移匹配流<\/h3>\n<p>封闭腔及内部流体以常向量 U 平移，初始 u=U，p 为常数，壁速度 U。无加速度时解析 u 始终为 U、黏性耗散为零，总腔体积恒定。腔体穿过固定背景格使单元出现/消失。<\/p>\n<p>这不是“静止血液被运动壁拖动”的启动问题。若起始 u=0 就不应期待全程 U 解析。初始/边界完全匹配后，可把异常动量、压力和能量定位到几何转移。<\/p>\n<h3>Z6c-D：体积保持腔体变形<\/h3>\n<p>同一分片腔面施加 <code>A(t)=diag(exp(eps sinωt), exp(-eps sinωt),1)<\/code>，det A=1。节点与壁速度由同一仿射映射及其导数得到；不每帧重新投影成不同体积的光滑表面。<\/p>\n<p>初始 eps=0.02，之后可 0.05；无端口，规定边界必须全局体积兼容。这一算例不是预设内部速度/压力解析解，主要验证质量、边界功、流体耗散和数值收敛。<\/p>\n<h3>Z6c-P：有开口活塞排液及精确一维嵌入测试<\/h3>\n<p>设域 0&lt;x&lt;L(t)，固定面积 A，x=0 为固定开放端口，x=L 为活塞。测试专用侧壁为无穿透/自由滑移，使 <code>u=(Ldot,0,0)<\/code> 在整个管内相容。初始值匹配时<\/p>\n<pre><code class=\"language-latex\">Q_{out}=-A\\dot L,\\quad V=AL,\\quad\np(x,t)=p_{res}(t)-\\rho x\\ddot L(t).\n<\/code><\/pre>\n<p>这里 Q_out 在 x=0 朝腔外为正。壁面活塞运动导致真实加速压差，不能要求压力全程为零。侧壁滑移仅是有精确参考的测试夹具，不是生产心室的默认边界。<\/p>\n<p>再加一个生产无滑移侧壁的活塞工况：仍检验 Q_out=-dV/dt，但上述均匀速度/压力不再是其精确解。明确区分两者，端部奇点的局部量不作主验收。<\/p>\n<h3>Z6c-R：拒绝/重启与换向<\/h3>\n<p>在上述一个确定工况人为触发一次时间步拒绝，或中途保存后重启；与不拒绝/不中断参考比较全部有效状态和累计收支。只有控制器试验触发器，不改变物理参数。<\/p>\n<h2>4. 时间和空间试验<\/h2>\n<p>冻结一条至少跨过多个网格面的轨迹，包含加速/减速/换向、单元消失后再出现和最小 alpha 配置。三档 h、三档 Δt 分别检查；固定运动在所有档保持相同物理时间、振幅和周期。<\/p>\n<p>不要求刚体平移轨迹在每步恰好移动整数网格，反而需包含非整数位移。记录每步 CFL、壁面跨格距离、极小体积、合并次数、转移次数与局部动量残差。<\/p>\n<h2>5. 质量、动量与能量账本<\/h2>\n<p>每步保存 ΔV、进出通量积分、局部扫掠误差与累计 R_V。周期末和周期内最大误差同时报告。动量包括壁面反力、端口动量/压力输运及体力；刚体匹配流是
